name: Website UI smoke checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate links, JS, SVG components and export paths
        run: node tools/check-study-ui.cjs
