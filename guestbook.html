  </div></header>

  <main id="main">
    <section class="subhero"><div class="container"><article class="subhero-card glass reveal">
      <a class="back-link" href="index.html"><svg class="icon icon-arrow-left" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M16 10H5"></path><path d="m9 6-4 4 4 4"></path></svg> 返回首页</a><div class="kicker">留言板</div><h1>交流与反馈</h1>
      <p>可以讨论项目、学习或网站体验。留言无需注册且会公开展示，请不要填写联系方式或其他敏感信息。</p>
      <div class="guestbook-admin-entry"><a class="button" href="admin.html" rel="nofollow"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><rect x="4" y="9" width="12" height="8" rx="2"></rect><path d="M7 9V6a3 3 0 0 1 6 0v3"></path></svg> 管理员登录</a></div>
    </article></div></section>

    <section class="section"><div class="container guestbook-grid">
      <article class="panel glass reveal">
        <div class="kicker">新留言</div><h3>写下你的想法</h3>
        <form class="guestbook-form" id="guestbook-form">
          <div class="field"><label for="name">名字</label><input id="name" name="name" type="text" minlength="1" maxlength="40" autocomplete="name" required><div class="field-help">1–40 个字符，可以使用昵称。</div></div>
          <div class="field"><label for="content">留言</label><textarea id="content" name="content" minlength="1" maxlength="500" required></textarea><div class="field-help">1–500 个字符，请勿填写联系方式、账号或其他敏感信息。</div></div>
          <div class="honeypot" aria-hidden="true"><label for="website">网站</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
          <div class="form-actions"><button class="button primary" id="guestbook-submit" type="submit">发布留言</button></div>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>
      </article>

      <section class="panel glass reveal" aria-labelledby="messages-heading">
        <div class="kicker">公开记录</div><h3 id="messages-heading">最近留言</h3>
        <div class="message-list" id="message-list" aria-live="polite"><div class="empty-state">正在加载留言…</div></div>
      </section>
    </div></section>
  </main>
