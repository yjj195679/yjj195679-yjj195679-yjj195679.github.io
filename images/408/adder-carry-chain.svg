<svg class="hw-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" role="img" aria-labelledby="adder-carry-chain-title adder-carry-chain-desc"><title id="adder-carry-chain-title">四位串行进位加法器</title><desc id="adder-carry-chain-desc">四个全加器并行接收本位输入，但进位由低位逐级传递。</desc><style>.hw-diagram .hw-bg{fill:var(--diagram-bg,#fff)}.hw-diagram text{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:21px}.hw-diagram .hw-title{font-size:28px;font-weight:bold}.hw-diagram .hw-small{font-size:18px}.hw-diagram .hw-box{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#315d87);stroke-width:2}.hw-diagram .hw-blue{stroke:#387cb5}.hw-diagram .hw-green{stroke:#39846c}.hw-diagram .hw-purple{stroke:#9164ad}.hw-diagram .hw-red{stroke:#c45b64}.hw-diagram .hw-line{fill:none;stroke:var(--diagram-line,#315d87);stroke-width:2.5}.hw-diagram .hw-dash{stroke-dasharray:7 5}</style><defs><marker id="adder-carry-chain-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--diagram-line,#315d87)"/></marker></defs><rect class="hw-bg" width="960" height="550" rx="12"/><text x="35" y="45" text-anchor="start" class="hw-title">四位串行进位加法器</text><text x="480" y="85" text-anchor="middle" class="">低位在左，高位在右；蓝框为全加器，横向箭头为进位</text><rect x="115" y="170" width="145" height="90" rx="10" class="hw-box hw-blue"/><text x="187.5" y="208.0" text-anchor="middle" class="">FA0</text><text x="187.5" y="236.0" text-anchor="middle" class="">第 0 位</text><text x="187" y="120" text-anchor="middle" class="">A0，B0</text><polyline points="187,130 187,170" class="hw-line" marker-end="url(#adder-carry-chain-arrow)"/><polyline points="187,260 187,310" class="hw-line" marker-end="url(#adder-carry-chain-arrow)"/><text x="187" y="340" text-anchor="middle" class="">S0</text><polyline points="260,215 310,215" class="hw-line" marker-end="url(#adder-carry-chain-arrow)"/><text x="285" y="197" text-anchor="middle" class="hw-small">C1</text><rect x="310" y="170" width="145" height="90" rx="10" class="hw-box hw-blue"/><text x="382.5" y="208.0" text-anchor="middle" class="">FA1</text><text x="382.5" y="236.0" text-anchor="middle" class="">第 1 位</text><text x="382" y="120" text-anchor="middle" class="">A1，B1</text><polyline points="382,130 382,170" class="hw-line" marker-end="url(#adder-carry-chain-arrow)"/><polyline points="382,260 382,310" class="hw-line" marker-end="url(#adder-carry-chain-arrow)"/><text x="382" y="340" text-anchor="middle" class="">S1</text><polyline points="455,215 505,215" class="hw-line" marker-end="url(#adder-carry-chain-arrow)"/><text x="480" y="197" text-anchor="middle" class="hw-small">C2</text><rect x="505" y="170" width="145" height="90" rx="10" class="hw-box hw-blue"/><text x="577.5" y="208.0" text-anchor="middle" class="">FA2</text><text x="577.5" y="236.0" text-anchor="middle" class="">第 2 位</text><text x="577" y="120" text-anchor="middle" class="">A2，B2</text><polyline points="577,130 577,170" class="hw-line" marker-end="url(#adder-carry-chain-arrow)"/><polyline points="577,260 577,310" class="hw-line" marker-end="url(#adder-carry-chain-arrow)"/><text x="577" y="340" text-anchor="middle" class="">S2</text><polyline points="650,215 700,215" class="hw-line" marker-end="url(#adder-carry-chain-arrow)"/><text x="675" y="197" text-anchor="middle" class="hw-small">C3</text><rect x="700" y="170" width="145" height="90" rx="10" class="hw-box hw-blue"/><text x="772.5" y="208.0" text-anchor="middle" class="">FA3</text><text x="772.5" y="236.0" text-anchor="middle" class="">第 3 位</text><text x="772" y="120" text-anchor="middle" class="">A3，B3</text><polyline points="772,130 772,170" class="hw-line" marker-end="url(#adder-carry-chain-arrow)"/><polyline points="772,260 772,310" class="hw-line" marker-end="url(#adder-carry-chain-arrow)"/><text x="772" y="340" text-anchor="middle" class="">S3</text><text x="48" y="190" text-anchor="middle" class="">C0</text><polyline points="35,215 115,215" class="hw-line" marker-end="url(#adder-carry-chain-arrow)"/><polyline points="845,215 920,215" class="hw-line" marker-end="url(#adder-carry-chain-arrow)"/><text x="900" y="190" text-anchor="middle" class="">C4</text><text x="480" y="395" text-anchor="middle" class="">Sᵢ = Aᵢ ⊕ Bᵢ ⊕ Cᵢ</text><text x="480" y="435" text-anchor="middle" class="">Cᵢ₊₁ = AᵢBᵢ + (Aᵢ ⊕ Bᵢ)Cᵢ</text><text x="480" y="480" text-anchor="middle" class="">例：0111 + 0001 = 1000，进位从低位逐级传到高位</text><text x="480" y="520" text-anchor="middle" class="hw-small">图中下标：Cᵢ 是第 i 位的输入进位；与正文按位编号的写法等价</text></svg>