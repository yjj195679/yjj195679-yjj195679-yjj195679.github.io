<svg class="hw-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" role="img" aria-labelledby="adder-sub-control-title adder-sub-control-desc"><title id="adder-sub-control-title">同一个加法器怎样完成减法</title><desc id="adder-sub-control-desc">Sub同时控制B按位异或和最低进位，形成A加B或A加B反码加一。</desc><style>.hw-diagram .hw-bg{fill:var(--diagram-bg,#fff)}.hw-diagram text{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:21px}.hw-diagram .hw-title{font-size:28px;font-weight:bold}.hw-diagram .hw-small{font-size:18px}.hw-diagram .hw-box{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#315d87);stroke-width:2}.hw-diagram .hw-blue{stroke:#387cb5}.hw-diagram .hw-green{stroke:#39846c}.hw-diagram .hw-purple{stroke:#9164ad}.hw-diagram .hw-red{stroke:#c45b64}.hw-diagram .hw-line{fill:none;stroke:var(--diagram-line,#315d87);stroke-width:2.5}.hw-diagram .hw-dash{stroke-dasharray:7 5}</style><defs><marker id="adder-sub-control-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--diagram-line,#315d87)"/></marker></defs><rect class="hw-bg" width="960" height="550" rx="12"/><text x="35" y="45" text-anchor="start" class="hw-title">同一个加法器怎样完成减法</text><rect x="60" y="135" width="170" height="70" rx="10" class="hw-box hw-blue"/><text x="145.0" y="177.0" text-anchor="middle" class="">A（n 位）</text><rect x="60" y="290" width="170" height="70" rx="10" class="hw-box hw-blue"/><text x="145.0" y="332.0" text-anchor="middle" class="">B（n 位）</text><rect x="330" y="290" width="180" height="70" rx="10" class="hw-box hw-purple"/><text x="420.0" y="332.0" text-anchor="middle" class="">逐位 XOR</text><rect x="650" y="190" width="235" height="110" rx="10" class="hw-box hw-blue"/><text x="767.5" y="238.0" text-anchor="middle" class="">n 位加法器</text><text x="767.5" y="266.0" text-anchor="middle" class="">A + B′ + C0</text><text x="420" y="120" text-anchor="middle" class="">Sub：0 加法 / 1 减法</text><polyline points="230,170 580,170 580,220 650,220" class="hw-line" marker-end="url(#adder-sub-control-arrow)"/><polyline points="230,325 330,325" class="hw-line" marker-end="url(#adder-sub-control-arrow)"/><polyline points="420,140 420,290" class="hw-line hw-dash" marker-end="url(#adder-sub-control-arrow)"/><polyline points="420,140 600,140 600,275 650,275" class="hw-line hw-dash" marker-end="url(#adder-sub-control-arrow)"/><text x="600" y="120" text-anchor="middle" class="hw-small">C0 = Sub</text><polyline points="510,325 600,325 600,250 650,250" class="hw-line" marker-end="url(#adder-sub-control-arrow)"/><text x="555" y="350" text-anchor="middle" class="hw-small">B′</text><polyline points="765,300 765,395" class="hw-line" marker-end="url(#adder-sub-control-arrow)"/><text x="765" y="425" text-anchor="middle" class="">结果 S（保留 n 位）</text><text x="480" y="475" text-anchor="middle" class="">Sub=0：A+B；Sub=1：A+~B+1 = A−B（模 2ⁿ）</text><text x="480" y="515" text-anchor="middle" class="hw-small">虚线：控制信号；实线：数据通路。最高进位与有符号溢出分别判断。</text></svg>