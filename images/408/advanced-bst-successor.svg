<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="advanced-bst-successor-title advanced-bst-successor-desc"><title id="advanced-bst-successor-title">BST删除：用后继替换后还要删除哪个结点</title><desc id="advanced-bst-successor-desc">本例后继25是叶子，可直接摘除；一般后继无左孩子，但可能有右孩子，须接回其右子树。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="advanced-bst-successor-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">BST删除：用后继替换后还要删除哪个结点</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#advanced-bst-successor-arrow)" d="M347.5,86.0 L239.07142857142856,152.0"/><path class="ve" marker-end="url(#advanced-bst-successor-arrow)" d="M470.0,86.0 L592.5714285714286,152.0"/><path class="ve" marker-end="url(#advanced-bst-successor-arrow)" d="M700.0,226.0 L756.0,282.0"/><g class="done"><rect class="vb" x="330" y="20" width="150" height="62" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="405.0" y="58.0">25</text></g><g class="base"><rect class="vb" x="100" y="160" width="150" height="62" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="175.0" y="198.0">10</text></g><g class="base"><rect class="vb" x="590" y="160" width="150" height="62" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="665.0" y="198.0">30</text></g><g class="base"><rect class="vb" x="720" y="290" width="150" height="62" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="795.0" y="328.0">40</text></g></g></svg>