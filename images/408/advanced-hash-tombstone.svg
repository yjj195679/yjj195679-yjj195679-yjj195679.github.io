<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="advanced-hash-tombstone-title advanced-hash-tombstone-desc"><title id="advanced-hash-tombstone-title">线性探查：为什么不能把删除位置直接清空</title><desc id="advanced-hash-tombstone-desc">沿3→4→5：槽3是10，槽4已删仍继续，槽5命中24。只有真正未使用的空槽才可据此判失败。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="advanced-hash-tombstone-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">线性探查：为什么不能把删除位置直接清空</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="40.0" y="100" width="104.85714285714286" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="92.42857142857143" y="147.0">0:空</text></g><g class="base"><rect class="vb" x="152.85714285714286" y="100" width="104.85714285714286" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="205.28571428571428" y="147.0">1:空</text></g><g class="base"><rect class="vb" x="265.7142857142857" y="100" width="104.85714285714286" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="318.14285714285717" y="147.0">2:空</text></g><g class="base"><rect class="vb" x="378.57142857142856" y="100" width="104.85714285714286" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="431.0" y="147.0">3:10</text></g><g class="base"><rect class="vb" x="491.42857142857144" y="100" width="104.85714285714286" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="543.8571428571429" y="147.0">4:已删</text></g><g class="active"><rect class="vb" x="604.2857142857143" y="100" width="104.85714285714286" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="656.7142857142858" y="147.0">5:24</text></g><g class="base"><rect class="vb" x="717.1428571428571" y="100" width="104.85714285714286" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="769.5714285714286" y="147.0">6:空</text></g></g></svg>