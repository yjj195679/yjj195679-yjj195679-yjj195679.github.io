<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="advanced-loser-replay-title advanced-loser-replay-desc"><title id="advanced-loser-replay-title">败者树：内部存输家，为什么只重赛一条路径</title><desc id="advanced-loser-replay-desc">输出冠军3后，只从其所属第0路补9。9先与缓存败者8比，8胜、9留原内部点；8再与缓存败者5比，5胜、8留根。其他分支不用重赛。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="advanced-loser-replay-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">败者树：内部存输家，为什么只重赛一条路径</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#advanced-loser-replay-arrow)" d="M160.32075471698113,291.0 L208.32075471698113,238.0"/><path class="ve" marker-end="url(#advanced-loser-replay-arrow)" d="M308.50943396226415,291.0 L272.50943396226415,238.0"/><path class="ve" marker-end="url(#advanced-loser-replay-arrow)" d="M580.3207547169811,291.0 L628.3207547169811,238.0"/><path class="ve" marker-end="url(#advanced-loser-replay-arrow)" d="M728.5094339622641,291.0 L692.5094339622641,238.0"/><path class="ve" marker-end="url(#advanced-loser-replay-arrow)" d="M311.3636363636364,161.0 L371.3636363636364,128.0"/><path class="ve" marker-end="url(#advanced-loser-replay-arrow)" d="M592.0,161.0 L526.0,128.0"/><path class="ve" marker-end="url(#advanced-loser-replay-arrow)" d="M346.0,79.51612903225806 L248.0,71.61290322580645"/><g class="base"><rect class="vb" x="40" y="295" width="170" height="70" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="125.0" y="337.0">路0：9</text></g><g class="base"><rect class="vb" x="250" y="295" width="170" height="70" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="335.0" y="337.0">路1：8</text></g><g class="active"><rect class="vb" x="460" y="295" width="170" height="70" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="545.0" y="337.0">路2：5</text></g><g class="base"><rect class="vb" x="670" y="295" width="170" height="70" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="755.0" y="337.0">路3：7</text></g><g class="base"><rect class="vb" x="150" y="165" width="190" height="65" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="245.0" y="204.5">存败者 9</text></g><g class="base"><rect class="vb" x="570" y="165" width="190" height="65" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="665.0" y="204.5">存败者 7</text></g><g class="base"><rect class="vb" x="350" y="55" width="190" height="65" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="445.0" y="94.5">存败者 8</text></g><g class="done"><rect class="vb" x="30" y="30" width="210" height="65" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="135.0" y="69.5">总冠军 5</text></g></g></svg>