<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="advanced-negate-minimum-title advanced-negate-minimum-desc"><title id="advanced-negate-minimum-title">补码最小负数：按位取反加1为何仍是自己</title><desc id="advanced-negate-minimum-desc">扩大到能表示+8的位宽后再做取负，便可得到正确结果。实际C最小整数取负须遵循类型范围与溢出规则。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="advanced-negate-minimum-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">补码最小负数：按位取反加1为何仍是自己</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="40" y="100" width="252" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="166.0" y="147.0">符号扩展：11111000</text></g><g class="active"><rect class="vb" x="300" y="100" width="252" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="426.0" y="147.0">8bit取负：00001000</text></g><g class="active"><rect class="vb" x="560" y="100" width="252" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="686.0" y="147.0">真值+8</text></g></g></svg>