<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="advanced-raid-parity-title advanced-raid-parity-desc"><title id="advanced-raid-parity-title">RAID校验：一块盘丢失后怎样用异或恢复</title><desc id="advanced-raid-parity-desc">本例P=0000。RAID5通常只能容忍一个成员盘失效；它不是文件误删或所有灾难情形的备份替代品。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="advanced-raid-parity-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">RAID校验：一块盘丢失后怎样用异或恢复</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="40" y="100" width="252" height="80" rx="10"/><text class="vt" font-size="18.65203761755486" text-anchor="middle" x="166.0" y="147.0">0000 XOR 1010 XOR 1100</text></g><g class="active"><rect class="vb" x="300" y="100" width="252" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="426.0" y="147.0">D1=0110</text></g><g class="base"><rect class="vb" x="560" y="100" width="252" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="686.0" y="147.0">校验恢复成功</text></g></g></svg>