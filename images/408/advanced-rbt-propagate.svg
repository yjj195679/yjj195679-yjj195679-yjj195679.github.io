<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="advanced-rbt-propagate-title advanced-rbt-propagate-desc"><title id="advanced-rbt-propagate-title">红黑树删除：兄弟两侄全黑为何要向上修复</title><desc id="advanced-rbt-propagate-desc">20恰好是根，去掉额外黑标记即可结束；所有路径的黑高一起减少1，但仍彼此相同。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="advanced-rbt-propagate-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">红黑树删除：兄弟两侄全黑为何要向上修复</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#advanced-rbt-propagate-arrow)" d="M470.3333333333333,84.0 L614.3333333333334,192.0"/><g class="done rb-black"><rect class="vb" x="360" y="20" width="130" height="60" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="425.0" y="57.0">20 · 黑</text></g><g class="base rb-red"><rect class="vb" x="600" y="200" width="130" height="60" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="665.0" y="237.0">30 · 红</text></g></g></svg>