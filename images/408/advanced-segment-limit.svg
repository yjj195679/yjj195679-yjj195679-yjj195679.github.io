<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="advanced-segment-limit-title advanced-segment-limit-desc"><title id="advanced-segment-limit-title">分段保护：先判断段内偏移，再做基址相加</title><desc id="advanced-segment-limit-desc">段号范围与段内偏移是两道检查；合法地址还必须满足读写执行权限。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="advanced-segment-limit-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">分段保护：先判断段内偏移，再做基址相加</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="40" y="100" width="252" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="166.0" y="147.0">段表只有0,1,2段</text></g><g class="active"><rect class="vb" x="300" y="100" width="252" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="426.0" y="147.0">若给段号3则无对应项</text></g><g class="base"><rect class="vb" x="560" y="100" width="252" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="686.0" y="147.0">不进入base+d计算</text></g></g></svg>