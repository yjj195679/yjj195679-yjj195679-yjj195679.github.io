<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="advanced-srtn-preemption-title advanced-srtn-preemption-desc"><title id="advanced-srtn-preemption-title">最短剩余时间优先：新短作业到达时怎样抢占</title><desc id="advanced-srtn-preemption-desc">在就绪进程中选择剩余CPU时间最短者；每次有新到达或当前进程完成都重新比较。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="advanced-srtn-preemption-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">最短剩余时间优先：新短作业到达时怎样抢占</text><g transform="translate(0 55)"><g class="done"><rect class="vb" x="40" y="100" width="124" height="100" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="102.0" y="144.0">A</text><text class="vt" font-size="19" text-anchor="middle" x="102.0" y="170.0">0→2</text></g><g class="done"><rect class="vb" x="170" y="100" width="124" height="100" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="232.0" y="144.0">B</text><text class="vt" font-size="19" text-anchor="middle" x="232.0" y="170.0">2→4</text></g><g class="done"><rect class="vb" x="300" y="100" width="59" height="100" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="329.5" y="144.0">C</text><text class="vt" font-size="19" text-anchor="middle" x="329.5" y="170.0">4→5</text></g><g class="done"><rect class="vb" x="365" y="100" width="124" height="100" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="427.0" y="144.0">B</text><text class="vt" font-size="19" text-anchor="middle" x="427.0" y="170.0">5→7</text></g><g class="active"><rect class="vb" x="495" y="100" width="319" height="100" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="654.5" y="144.0">A</text><text class="vt" font-size="19" text-anchor="middle" x="654.5" y="170.0">7→12</text></g></g></svg>