<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="arp-next-hop-example-title arp-next-hop-example-desc"><title id="arp-next-hop-example-title">跨网发送：ARP 问网关，IP 仍指远端</title><desc id="arp-next-hop-example-desc">主机A发送到远端B时，首跳以太网帧目的MAC为本地网关R的MAC，IP目的地址仍为B。路由器下一跳重新封装链路首部。</desc><style>.dg-bg{fill:var(--diagram-bg,#fff)}.dg-box{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.dg-arrow{fill:none;stroke:var(--diagram-line,#356493);stroke-width:2.5}.dg-text{fill:var(--diagram-text,#17212f);font-family:SimSun,serif}.dg-accent{fill:var(--diagram-line,#356493)}</style><defs><marker id="arp-next-hop-example-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-accent" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="dg-bg" width="960" height="520" rx="12"/><text class="dg-text" x="480" y="42" text-anchor="middle" font-size="28">跨网发送：ARP 问网关，IP 仍指远端</text><rect class="dg-box" x="45" y="120" width="220" height="100" rx="12"/><text class="dg-text" x="155.0" y="163.0" text-anchor="middle" font-size="22">主机 A</text><text class="dg-text" x="155.0" y="193.0" text-anchor="middle" font-size="22">先查路由</text><rect class="dg-box" x="370" y="120" width="220" height="100" rx="12"/><text class="dg-text" x="480.0" y="163.0" text-anchor="middle" font-size="22">本地网关 R</text><text class="dg-text" x="480.0" y="193.0" text-anchor="middle" font-size="22">下一跳为 R</text><rect class="dg-box" x="695" y="120" width="220" height="100" rx="12"/><text class="dg-text" x="805.0" y="163.0" text-anchor="middle" font-size="22">远端主机 B</text><text class="dg-text" x="805.0" y="193.0" text-anchor="middle" font-size="22">位于另一网络</text><path class="dg-arrow" d="M270 170 L365 170" marker-end="url(#arp-next-hop-example-arrow)"/><path class="dg-arrow" d="M595 170 L690 170" marker-end="url(#arp-next-hop-example-arrow)"/><rect class="dg-box" x="45" y="290" width="400" height="105" rx="12"/><text class="dg-text" x="245.0" y="335.5" text-anchor="middle" font-size="22">A 所在链路：ARP 查询 R 的 IP</text><text class="dg-text" x="245.0" y="365.5" text-anchor="middle" font-size="22">获得 R 的 MAC（缓存命中可免查询）</text><rect class="dg-box" x="515" y="290" width="400" height="105" rx="12"/><text class="dg-text" x="715.0" y="335.5" text-anchor="middle" font-size="22">首跳帧：目的 MAC = R 的 MAC</text><text class="dg-text" x="715.0" y="365.5" text-anchor="middle" font-size="22">所载 IP 包：目的 IP = B 的 IP</text><text class="dg-text" x="480" y="460" text-anchor="middle" font-size="21">普通路由转发逐跳替换链路首部；NAT 等机制的地址改写另论。</text></svg>
