<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-avl-cases-title atlas-avl-cases-desc"><title id="atlas-avl-cases-title">AVL四类失衡：先认插入方向再旋转</title><desc id="atlas-avl-cases-desc">图以插入后沿路径找到的最低失衡祖先为根，LL/RR/LR/RL描述其重侧及下一段方向。；旋转保持中序序列不变。删除后的平衡因子和修复传播有额外情况，不能机械套用插入时“只修复一次”的结论。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-avl-cases-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">AVL四类失衡：先认插入方向再旋转</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="40" y="40" width="370" height="110" rx="10"/><text class="vt" style="font-size:19.0px" x="225.0" y="89.0" text-anchor="middle">LL：左孩子的左侧</text><text class="vt" style="font-size:19.0px" x="225.0" y="115.0" text-anchor="middle">对失衡根右旋</text></g><g class="base"><rect class="vb" x="490" y="40" width="370" height="110" rx="10"/><text class="vt" style="font-size:19.0px" x="675.0" y="89.0" text-anchor="middle">RR：右孩子的右侧</text><text class="vt" style="font-size:19.0px" x="675.0" y="115.0" text-anchor="middle">对失衡根左旋</text></g><g class="base"><rect class="vb" x="40" y="240" width="370" height="110" rx="10"/><text class="vt" style="font-size:19.0px" x="225.0" y="289.0" text-anchor="middle">LR：左孩子的右侧</text><text class="vt" style="font-size:19.0px" x="225.0" y="315.0" text-anchor="middle">先左旋左孩子，再右旋根</text></g><g class="base"><rect class="vb" x="490" y="240" width="370" height="110" rx="10"/><text class="vt" style="font-size:19.0px" x="675.0" y="289.0" text-anchor="middle">RL：右孩子的左侧</text><text class="vt" style="font-size:19.0px" x="675.0" y="315.0" text-anchor="middle">先右旋右孩子，再左旋根</text></g></g></svg>