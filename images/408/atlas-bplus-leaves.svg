<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-bplus-leaves-title atlas-bplus-leaves-desc"><title id="atlas-bplus-leaves-title">B+树：内部索引与叶子顺序链</title><desc id="atlas-bplus-leaves-desc">本图沿用正文资料的子树最大键约定：内部键20、40、60分别对应三棵子树，关键字数与孩子数相等。查找35先选最大键40对应的中间子树。；所有记录入口在叶子，内部索引键20、40、60也在叶子出现；叶子顺序链接方便扫描区间。内部命中索引键仍要下降到叶子；其他实现可能采用最小键分隔，作题须跟随题设。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-bplus-leaves-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">B+树：内部索引与叶子顺序链</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#atlas-bplus-leaves-arrow)" d="M375.0,119.0 L212.3,227.0"/><path class="ve" marker-end="url(#atlas-bplus-leaves-arrow)" d="M445.0,119.0 L445.0,227.0"/><path class="ve" marker-end="url(#atlas-bplus-leaves-arrow)" d="M515.0,119.0 L677.7,227.0"/><path class="ve" marker-end="url(#atlas-bplus-leaves-arrow)" d="M259.0,275.0 L322.0,275.0"/><path class="ve" marker-end="url(#atlas-bplus-leaves-arrow)" d="M564.0,275.0 L627.0,275.0"/><g class="base"><rect class="vb" x="320" y="30" width="250" height="85" rx="10"/><text class="vt" style="font-size:19.0px" x="445.0" y="66.5" text-anchor="middle">内部索引</text><text class="vt" style="font-size:19.0px" x="445.0" y="92.5" text-anchor="middle">20 | 40 | 60</text></g><g class="base"><rect class="vb" x="25" y="235" width="230" height="80" rx="10"/><text class="vt" style="font-size:19.0px" x="140.0" y="269.0" text-anchor="middle">叶子</text><text class="vt" style="font-size:19.0px" x="140.0" y="295.0" text-anchor="middle">10 | 20</text></g><g class="base"><rect class="vb" x="330" y="235" width="230" height="80" rx="10"/><text class="vt" style="font-size:19.0px" x="445.0" y="269.0" text-anchor="middle">叶子</text><text class="vt" style="font-size:19.0px" x="445.0" y="295.0" text-anchor="middle">30 | 40</text></g><g class="base"><rect class="vb" x="635" y="235" width="230" height="80" rx="10"/><text class="vt" style="font-size:19.0px" x="750.0" y="269.0" text-anchor="middle">叶子</text><text class="vt" style="font-size:19.0px" x="750.0" y="295.0" text-anchor="middle">50 | 60</text></g></g></svg>