<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-btree-split-title atlas-btree-split-desc"><title id="atlas-btree-split-title">3阶B树：溢出时中间关键字上升</title><desc id="atlas-btree-split-desc">3阶B树的一个结点最多2个关键字。图中是向原叶结点[10,20]插入30后的临时溢出状态。；把中间关键字20上提，10和30分别留在左右结点；若原结点为根，新建根，高度增加1。非根分裂时上提可能继续导致父结点溢出。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-btree-split-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">3阶B树：溢出时中间关键字上升</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#atlas-btree-split-arrow)" d="M339.0,95.5 L572.0,77.4"/><path class="ve" marker-end="url(#atlas-btree-split-arrow)" d="M629.9,106.0 L543.0,227.0"/><path class="ve" marker-end="url(#atlas-btree-split-arrow)" d="M676.5,106.0 L751.0,227.0"/><g class="active"><rect class="vb" x="35" y="55" width="300" height="105" rx="10"/><text class="vt" style="font-size:19.0px" x="185.0" y="101.5" text-anchor="middle">临时溢出结点</text><text class="vt" style="font-size:19.0px" x="185.0" y="127.5" text-anchor="middle">10 | 20 | 30</text></g><g class="base"><rect class="vb" x="580" y="40" width="150" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="655.0" y="78.0" text-anchor="middle">20</text></g><g class="base"><rect class="vb" x="440" y="235" width="150" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="515.0" y="273.0" text-anchor="middle">10</text></g><g class="base"><rect class="vb" x="700" y="235" width="150" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="775.0" y="273.0" text-anchor="middle">30</text></g></g></svg>