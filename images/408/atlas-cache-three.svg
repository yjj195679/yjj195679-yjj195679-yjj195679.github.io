<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-cache-three-title atlas-cache-three-desc"><title id="atlas-cache-three-title">直接映射、组相联、全相联：候选位置有多少</title><desc id="atlas-cache-three-desc">块内偏移由块大小决定；直接映射的行号位数为log₂L，组相联的组号位数为log₂S，全相联没有组/行索引位。；同一组内比较候选标记并按替换策略选行；全相联灵活但比较开销大。容量计算要说明是否含标记、有效位和脏位。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-cache-three-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">直接映射、组相联、全相联：候选位置有多少</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#atlas-cache-three-arrow)" d="M219.0,140.8 L342.0,115.7"/><path class="ve" marker-end="url(#atlas-cache-three-arrow)" d="M219.0,170.1 L342.0,183.3"/><path class="ve" marker-end="url(#atlas-cache-three-arrow)" d="M219.0,198.4 L472.5,302.0"/><g class="base"><rect class="vb" x="35" y="115" width="180" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="125.0" y="167.0" text-anchor="middle">主存块号j</text></g><g class="base"><rect class="vb" x="350" y="20" width="480" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="590.0" y="59.0" text-anchor="middle">直接映射</text><text class="vt" style="font-size:19.0px" x="590.0" y="85.0" text-anchor="middle">只能进第 j mod L 行</text></g><g class="base"><rect class="vb" x="350" y="160" width="480" height="100" rx="10"/><text class="vt" style="font-size:19.0px" x="590.0" y="204.0" text-anchor="middle">S组、每组E行</text><text class="vt" style="font-size:19.0px" x="590.0" y="230.0" text-anchor="middle">进第 j mod S 组中的任一行</text></g><g class="base"><rect class="vb" x="350" y="310" width="480" height="80" rx="10"/><text class="vt" style="font-size:19.0px" x="590.0" y="344.0" text-anchor="middle">全相联</text><text class="vt" style="font-size:19.0px" x="590.0" y="370.0" text-anchor="middle">可进Cache任意行</text></g></g></svg>