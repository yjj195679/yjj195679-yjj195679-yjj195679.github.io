<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-call-stack-title atlas-call-stack-desc"><title id="atlas-call-stack-title">32位x86栈帧：EBP固定参照，ESP随栈变化</title><desc id="atlas-call-stack-desc">示例为常见32位x86、向低地址增长、使用push ebp; mov ebp,esp建立帧的约定，不代表所有ABI都这样传参。；call保存其后下一条指令的返回地址；递归每次建立独立栈帧。使用帧指针省略优化时不应照搬图中的EBP布局。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-call-stack-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">32位x86栈帧：EBP固定参照，ESP随栈变化</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="250" y="10" width="430" height="75" rx="10"/><text class="vt" style="font-size:19.0px" x="465.0" y="41.5" text-anchor="middle">较高地址：参数</text><text class="vt" style="font-size:19.0px" x="465.0" y="67.5" text-anchor="middle">[EBP+8] 常见首个栈参数</text></g><g class="base"><rect class="vb" x="250" y="95" width="430" height="65" rx="10"/><text class="vt" style="font-size:19.0px" x="465.0" y="134.5" text-anchor="middle">[EBP+4] 返回地址</text></g><g class="active"><rect class="vb" x="250" y="170" width="430" height="65" rx="10"/><text class="vt" style="font-size:19.0px" x="465.0" y="209.5" text-anchor="middle">EBP → [EBP] 旧EBP</text></g><g class="base"><rect class="vb" x="250" y="245" width="430" height="100" rx="10"/><text class="vt" style="font-size:19.0px" x="465.0" y="289.0" text-anchor="middle">局部变量 / 保存寄存器</text><text class="vt" style="font-size:19.0px" x="465.0" y="315.0" text-anchor="middle">ESP → 当前栈顶（较低地址）</text></g></g></svg>