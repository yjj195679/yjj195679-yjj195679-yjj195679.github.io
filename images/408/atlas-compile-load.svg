<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-compile-load-title atlas-compile-load-desc"><title id="atlas-compile-load-title">源程序到运行：各阶段负责什么</title><desc id="atlas-compile-load-desc">编译/汇编生成目标代码；链接把目标模块和所需库组合并处理符号引用，静态与动态链接的发生时点不同。；装入把程序映像准备到内存或虚拟地址空间。运行时地址变换由MMU等机制完成，不是每执行一条指令都重新链接整个程序。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-compile-load-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">源程序到运行：各阶段负责什么</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#atlas-compile-load-arrow)" d="M219.0,65.0 L342.0,65.0"/><text style="font-size:18.0px" class="vt vl" x="297.5" y="53.0" text-anchor="middle">编译/汇编</text><path class="ve" marker-end="url(#atlas-compile-load-arrow)" d="M475.0,104.0 L475.0,197.0"/><text style="font-size:18.0px" class="vt vl" x="475.0" y="145.5" text-anchor="middle">链接</text><path class="ve" marker-end="url(#atlas-compile-load-arrow)" d="M475.0,299.0 L475.0,337.0"/><text style="font-size:18.0px" class="vt vl" x="475.0" y="303.0" text-anchor="middle">装入</text><g class="base"><rect class="vb" x="25" y="30" width="190" height="70" rx="10"/><text class="vt" style="font-size:19.0px" x="120.0" y="72.0" text-anchor="middle">源文件</text></g><g class="base"><rect class="vb" x="350" y="30" width="250" height="70" rx="10"/><text class="vt" style="font-size:19.0px" x="475.0" y="72.0" text-anchor="middle">可重定位目标文件</text></g><g class="base"><rect class="vb" x="350" y="205" width="250" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="475.0" y="244.0" text-anchor="middle">可执行文件</text><text class="vt" style="font-size:19.0px" x="475.0" y="270.0" text-anchor="middle">链接符号与地址</text></g><g class="base"><rect class="vb" x="350" y="345" width="250" height="70" rx="10"/><text class="vt" style="font-size:19.0px" x="475.0" y="374.0" text-anchor="middle">运行地址空间</text><text class="vt" style="font-size:19.0px" x="475.0" y="400.0" text-anchor="middle">装入与动态地址变换</text></g></g></svg>