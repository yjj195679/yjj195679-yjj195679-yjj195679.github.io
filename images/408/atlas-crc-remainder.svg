<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-crc-remainder-title atlas-crc-remainder-desc"><title id="atlas-crc-remainder-title">CRC示例：数据1101，生成多项式1011</title><desc id="atlas-crc-remainder-desc">生成多项式最高次数r=3，所以补3个0，余数也按3bit写为001。1101000 ÷1011的模2余数为001。；发送码字为原数据拼余数1101001；接收端用同一除数得到000可通过检验，但余数为0并不能保证绝对没有任何未检出的差错。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-crc-remainder-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">CRC示例：数据1101，生成多项式1011</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#atlas-crc-remainder-arrow)" d="M404.0,95.0 L492.0,95.0"/><path class="ve" marker-end="url(#atlas-crc-remainder-arrow)" d="M576.4,144.0 L327.0,262.0"/><path class="ve" marker-end="url(#atlas-crc-remainder-arrow)" d="M404.0,315.0 L492.0,315.0"/><g class="base"><rect class="vb" x="30" y="50" width="370" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="215.0" y="89.0" text-anchor="middle">数据1101</text><text class="vt" style="font-size:19.0px" x="215.0" y="115.0" text-anchor="middle">末尾补3个0：1101000</text></g><g class="base"><rect class="vb" x="500" y="50" width="360" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="680.0" y="89.0" text-anchor="middle">用1011模2除</text><text class="vt" style="font-size:19.0px" x="680.0" y="115.0" text-anchor="middle">异或运算，无借位进位</text></g><g class="base"><rect class="vb" x="30" y="270" width="370" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="215.0" y="309.0" text-anchor="middle">余数001</text><text class="vt" style="font-size:19.0px" x="215.0" y="335.0" text-anchor="middle">发送码字1101001</text></g><g class="base"><rect class="vb" x="500" y="270" width="360" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="680.0" y="309.0" text-anchor="middle">接收后再模2除</text><text class="vt" style="font-size:19.0px" x="680.0" y="335.0" text-anchor="middle">无误码时余数000</text></g></g></svg>