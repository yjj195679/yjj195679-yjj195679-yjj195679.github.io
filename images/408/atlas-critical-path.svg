<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-critical-path-title atlas-critical-path-desc"><title id="atlas-critical-path-title">AOE网：最长工期与零余量活动</title><desc id="atlas-critical-path-desc">两条路径工期分别2+4=6、3+2=5，因此最短完成工期6，关键路径源→A→汇。；活动B→汇的最早开始e=ve(B)=3，最迟开始l=vl(汇)−2=4，余量1。事件ve/vl与活动e/l不能混用。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-critical-path-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">AOE网：最长工期与零余量活动</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#atlas-critical-path-arrow)" d="M184.0,172.8 L322.0,116.5"/><text style="font-size:18.0px" class="vt vl" x="267.5" y="126.75" text-anchor="middle">2</text><path class="ve" marker-end="url(#atlas-critical-path-arrow)" d="M184.0,233.6 L322.0,283.5"/><text style="font-size:18.0px" class="vt vl" x="267.5" y="251.75" text-anchor="middle">3</text><path class="ve" marker-end="url(#atlas-critical-path-arrow)" d="M534.0,111.3 L692.0,170.3"/><text style="font-size:18.0px" class="vt vl" x="607.5" y="126.75" text-anchor="middle">4</text><path class="ve" marker-end="url(#atlas-critical-path-arrow)" d="M534.0,288.1 L692.0,235.8"/><text style="font-size:18.0px" class="vt vl" x="607.5" y="251.75" text-anchor="middle">2</text><g class="base"><rect class="vb" x="30" y="160" width="150" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="105.0" y="199.0" text-anchor="middle">源点</text><text class="vt" style="font-size:19.0px" x="105.0" y="225.0" text-anchor="middle">ve=vl=0</text></g><g class="base"><rect class="vb" x="330" y="30" width="200" height="85" rx="10"/><text class="vt" style="font-size:19.0px" x="430.0" y="66.5" text-anchor="middle">A</text><text class="vt" style="font-size:19.0px" x="430.0" y="92.5" text-anchor="middle">ve=2,vl=2</text></g><g class="base"><rect class="vb" x="330" y="280" width="200" height="85" rx="10"/><text class="vt" style="font-size:19.0px" x="430.0" y="316.5" text-anchor="middle">B</text><text class="vt" style="font-size:19.0px" x="430.0" y="342.5" text-anchor="middle">ve=3,vl=4</text></g><g class="base"><rect class="vb" x="700" y="160" width="170" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="785.0" y="199.0" text-anchor="middle">汇点</text><text class="vt" style="font-size:19.0px" x="785.0" y="225.0" text-anchor="middle">ve=vl=6</text></g></g></svg>