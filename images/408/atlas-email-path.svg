<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-email-path-title atlas-email-path-desc"><title id="atlas-email-path-title">邮件投递与读取：SMTP、POP3、IMAP各做什么</title><desc id="atlas-email-path-desc">发件客户端通常通过SMTP提交到发送服务器，服务器之间通过SMTP投递。收件人用POP3或IMAP访问其邮箱；网页邮箱的浏览器到Web服务通常使用HTTPS。；图中POP3/IMAP箭头表示客户端发起访问请求，邮件数据响应方向相反。POP3是否删除服务器副本取决于客户端会话命令和保留设置；IMAP支持服务器端状态同步。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-email-path-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">邮件投递与读取：SMTP、POP3、IMAP各做什么</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#atlas-email-path-arrow)" d="M214.0,100.0 L312.0,100.0"/><text style="font-size:18.0px" class="vt vl" x="272.5" y="88.0" text-anchor="middle">提交</text><path class="ve" marker-end="url(#atlas-email-path-arrow)" d="M544.0,100.0 L642.0,100.0"/><text style="font-size:18.0px" class="vt vl" x="595.0" y="88.0" text-anchor="middle">SMTP</text><path class="ve" marker-end="url(#atlas-email-path-arrow)" d="M760.0,296.0 L760.0,148.0"/><text style="font-size:18.0px" class="vt vl" x="760.0" y="208.0" text-anchor="middle">POP3 / IMAP</text><g class="base"><rect class="vb" x="20" y="60" width="190" height="80" rx="10"/><text class="vt" style="font-size:19.0px" x="115.0" y="107.0" text-anchor="middle">发件人客户端</text></g><g class="base"><rect class="vb" x="320" y="60" width="220" height="80" rx="10"/><text class="vt" style="font-size:19.0px" x="430.0" y="107.0" text-anchor="middle">发件服务器</text></g><g class="base"><rect class="vb" x="650" y="60" width="220" height="80" rx="10"/><text class="vt" style="font-size:19.0px" x="760.0" y="107.0" text-anchor="middle">收件服务器</text></g><g class="base"><rect class="vb" x="650" y="300" width="220" height="80" rx="10"/><text class="vt" style="font-size:19.0px" x="760.0" y="347.0" text-anchor="middle">收件人客户端</text></g></g></svg>