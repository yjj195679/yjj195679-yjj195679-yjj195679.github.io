<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-graph-storage-title atlas-graph-storage-desc"><title id="atlas-graph-storage-title">同一无向图：矩阵与邻接表</title><desc id="atlas-graph-storage-desc">无向简单图邻接矩阵对称，每条无向边在邻接表中对应两个邻接项。矩阵占Θ(V²)，邻接表占Θ(V+E)。；使用邻接矩阵遍历全部邻边每个顶点要扫描一整行，完整BFS/DFS通常Θ(V²)；邻接表通常Θ(V+E)。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-graph-storage-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">同一无向图：矩阵与邻接表</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="30" y="55" width="210" height="120" rx="10"/><text class="vt" style="font-size:19.0px" x="135.0" y="109.0" text-anchor="middle">边集合</text><text class="vt" style="font-size:19.0px" x="135.0" y="135.0" text-anchor="middle">AB、AC、BC</text></g><g class="base"><rect class="vb" x="300" y="40" width="260" height="220" rx="10"/><text class="vt" style="font-size:19.0px" x="430.0" y="118.0" text-anchor="middle">矩阵（顶点A,B,C）</text><text class="vt" style="font-size:19.0px" x="430.0" y="144.0" text-anchor="middle">0  1  1</text><text class="vt" style="font-size:19.0px" x="430.0" y="170.0" text-anchor="middle">1  0  1</text><text class="vt" style="font-size:19.0px" x="430.0" y="196.0" text-anchor="middle">1  1  0</text></g><g class="base"><rect class="vb" x="620" y="40" width="240" height="220" rx="10"/><text class="vt" style="font-size:19.0px" x="740.0" y="118.0" text-anchor="middle">邻接表</text><text class="vt" style="font-size:19.0px" x="740.0" y="144.0" text-anchor="middle">A：B→C</text><text class="vt" style="font-size:19.0px" x="740.0" y="170.0" text-anchor="middle">B：A→C</text><text class="vt" style="font-size:19.0px" x="740.0" y="196.0" text-anchor="middle">C：A→B</text></g></g></svg>