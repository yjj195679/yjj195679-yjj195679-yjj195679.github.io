<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-ieee-single-title atlas-ieee-single-desc"><title id="atlas-ieee-single-title">IEEE754单精度：1位符号、8位阶码、23位尾数</title><desc id="atlas-ieee-single-desc">1.5的S=0，E=127（01111111），F为100…0，十六进制编码0x3FC00000。；隐含的首位1只适用于规格化数；E=0时指数采用1−127，尾数为0.F。E=255且F=0表示无穷，F非0表示NaN。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-ieee-single-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">IEEE754单精度：1位符号、8位阶码、23位尾数</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="35" y="55" width="110" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="90.0" y="94.0" text-anchor="middle">S</text><text class="vt" style="font-size:19.0px" x="90.0" y="120.0" text-anchor="middle">1bit</text></g><g class="base"><rect class="vb" x="155" y="55" width="260" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="285.0" y="94.0" text-anchor="middle">E</text><text class="vt" style="font-size:19.0px" x="285.0" y="120.0" text-anchor="middle">8bit</text></g><g class="base"><rect class="vb" x="425" y="55" width="435" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="642.5" y="94.0" text-anchor="middle">F</text><text class="vt" style="font-size:19.0px" x="642.5" y="120.0" text-anchor="middle">23bit</text></g><g class="base"><rect class="vb" x="35" y="245" width="395" height="110" rx="10"/><text class="vt" style="font-size:19.0px" x="232.5" y="294.0" text-anchor="middle">规格化：0&lt;E&lt;255</text><text class="vt" style="font-size:19.0px" x="232.5" y="320.0" text-anchor="middle">(−1)^S × 1.F × 2^(E−127)</text></g><g class="base"><rect class="vb" x="465" y="245" width="395" height="110" rx="10"/><text class="vt" style="font-size:19.0px" x="662.5" y="294.0" text-anchor="middle">E=0：零 / 非规格化数</text><text class="vt" style="font-size:19.0px" x="662.5" y="320.0" text-anchor="middle">E=255：无穷 / NaN</text></g></g></svg>