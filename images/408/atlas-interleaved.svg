<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-interleaved-title atlas-interleaved-desc"><title id="atlas-interleaved-title">低位交叉编址：相邻字轮流落入4个存储体</title><desc id="atlas-interleaved-desc">低2位选择存储体，连续字可按启动间隔τ轮流启动。若存储周期T≤4τ，理想连续访问可维持每τ一个字的启动节拍。；传送n个字的常见理想模型为T+(n−1)τ；同一体冲突、总线占用、未满足轮流启动条件都会改变结果。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-interleaved-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">低位交叉编址：相邻字轮流落入4个存储体</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="25" y="70" width="200" height="150" rx="10"/><text class="vt" style="font-size:19.0px" x="125.0" y="139.0" text-anchor="middle">体0</text><text class="vt" style="font-size:19.0px" x="125.0" y="165.0" text-anchor="middle">字地址0,4,8…</text></g><g class="base"><rect class="vb" x="240" y="70" width="200" height="150" rx="10"/><text class="vt" style="font-size:19.0px" x="340.0" y="139.0" text-anchor="middle">体1</text><text class="vt" style="font-size:19.0px" x="340.0" y="165.0" text-anchor="middle">字地址1,5,9…</text></g><g class="base"><rect class="vb" x="455" y="70" width="200" height="150" rx="10"/><text class="vt" style="font-size:19.0px" x="555.0" y="139.0" text-anchor="middle">体2</text><text class="vt" style="font-size:19.0px" x="555.0" y="165.0" text-anchor="middle">字地址2,6,10…</text></g><g class="base"><rect class="vb" x="670" y="70" width="200" height="150" rx="10"/><text class="vt" style="font-size:19.0px" x="770.0" y="139.0" text-anchor="middle">体3</text><text class="vt" style="font-size:19.0px" x="770.0" y="165.0" text-anchor="middle">字地址3,7,11…</text></g><g class="base"><rect class="vb" x="130" y="300" width="650" height="65" rx="10"/><text class="vt" style="font-size:19.0px" x="455.0" y="339.5" text-anchor="middle">体号=字地址 mod 4；体内地址=⌊字地址/4⌋</text></g></g></svg>