<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-io-layers-title atlas-io-layers-desc"><title id="atlas-io-layers-title">I/O软件分层：请求向下，完成通知向上</title><desc id="atlas-io-layers-desc">图按概念层次展示，不表示每个请求都必须同步进入“中断处理程序”再访问硬件。驱动启动设备，设备完成后产生中断，由处理程序进入完成路径。；设备独立层使上层不必掌握每种控制器的寄存器细节；具体缓冲、调度和错误处理可以跨层实现。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-io-layers-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">I/O软件分层：请求向下，完成通知向上</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#atlas-io-layers-arrow)" d="M445.0,69.0 L445.0,82.0"/><path class="ve" marker-end="url(#atlas-io-layers-arrow)" d="M445.0,154.0 L445.0,167.0"/><path class="ve" marker-end="url(#atlas-io-layers-arrow)" d="M445.0,239.0 L445.0,252.0"/><path class="ve" marker-end="url(#atlas-io-layers-arrow)" d="M445.0,324.0 L445.0,337.0"/><g class="base"><rect class="vb" x="220" y="10" width="450" height="55" rx="10"/><text class="vt" style="font-size:19.0px" x="445.0" y="44.5" text-anchor="middle">用户层I/O库 / 应用</text></g><g class="base"><rect class="vb" x="220" y="90" width="450" height="60" rx="10"/><text class="vt" style="font-size:19.0px" x="445.0" y="127.0" text-anchor="middle">设备独立软件：命名、保护、缓冲等</text></g><g class="base"><rect class="vb" x="220" y="175" width="450" height="60" rx="10"/><text class="vt" style="font-size:19.0px" x="445.0" y="212.0" text-anchor="middle">设备驱动：把请求转成设备操作</text></g><g class="base"><rect class="vb" x="220" y="260" width="450" height="60" rx="10"/><text class="vt" style="font-size:19.0px" x="445.0" y="297.0" text-anchor="middle">中断处理：响应并报告完成</text></g><g class="base"><rect class="vb" x="220" y="345" width="450" height="55" rx="10"/><text class="vt" style="font-size:19.0px" x="445.0" y="379.5" text-anchor="middle">控制器与设备硬件</text></g></g></svg>