<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-manchester-title atlas-manchester-desc"><title id="atlas-manchester-title">曼彻斯特与差分曼彻斯特：先约定位值</title><desc id="atlas-manchester-desc">两种编码每个码元位中间都有跳变，接收方可据此恢复定时。曼彻斯特看位中间跳变方向；差分曼彻斯特看位边界是否发生跳变。；图给出一种常见约定，不同标准或题设可能把0和1的定义反过来。不要只记某个跳变图而不读编码规则。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-manchester-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">曼彻斯特与差分曼彻斯特：先约定位值</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="35" y="40" width="380" height="140" rx="10"/><text class="vt" style="font-size:19.0px" x="225.0" y="91.0" text-anchor="middle">曼彻斯特示例约定</text><text class="vt" style="font-size:19.0px" x="225.0" y="117.0" text-anchor="middle">0：位中间高→低</text><text class="vt" style="font-size:19.0px" x="225.0" y="143.0" text-anchor="middle">1：位中间低→高</text></g><g class="base"><rect class="vb" x="485" y="40" width="380" height="140" rx="10"/><text class="vt" style="font-size:19.0px" x="675.0" y="91.0" text-anchor="middle">差分曼彻斯特示例约定</text><text class="vt" style="font-size:19.0px" x="675.0" y="117.0" text-anchor="middle">每位中间必有跳变</text><text class="vt" style="font-size:19.0px" x="675.0" y="143.0" text-anchor="middle">0：位开始跳变，1：不跳变</text></g><g class="base"><rect class="vb" x="130" y="290" width="640" height="75" rx="10"/><text class="vt" style="font-size:19.0px" x="450.0" y="334.5" text-anchor="middle">传数据同时携带时钟信息；具体高低电平与0/1对应应遵题设</text></g></g></svg>