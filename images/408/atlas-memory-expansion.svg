<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-memory-expansion-title atlas-memory-expansion-desc"><title id="atlas-memory-expansion-title">8片1K×8芯片：组成4K×16存储器</title><desc id="atlas-memory-expansion-desc">A9…A0接每片芯片内部地址，共1024个字位置；A11、A10参与片选，扩展成4组。；数据位并联使字宽从8bit扩为16bit；总容量4K×16bit=8KiB。此图按16bit字编址说明，若CPU按字节编址还要处理字节选择和地址接法。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-memory-expansion-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">8片1K×8芯片：组成4K×16存储器</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#atlas-memory-expansion-arrow)" d="M209.0,158.2 L298.3,128.0"/><path class="ve" marker-end="url(#atlas-memory-expansion-arrow)" d="M463.9,124.0 L481.7,222.0"/><path class="ve" marker-end="url(#atlas-memory-expansion-arrow)" d="M209.0,216.0 L312.0,244.4"/><path class="ve" marker-end="url(#atlas-memory-expansion-arrow)" d="M674.0,271.1 L712.0,266.1"/><g class="base"><rect class="vb" x="25" y="130" width="180" height="120" rx="10"/><text class="vt" style="font-size:19.0px" x="115.0" y="171.0" text-anchor="middle">CPU地址</text><text class="vt" style="font-size:19.0px" x="115.0" y="197.0" text-anchor="middle">A11…A0</text><text class="vt" style="font-size:19.0px" x="115.0" y="223.0" text-anchor="middle">数据D15…D0</text></g><g class="base"><rect class="vb" x="285" y="30" width="340" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="455.0" y="69.0" text-anchor="middle">A11,A10 → 2-4译码</text><text class="vt" style="font-size:19.0px" x="455.0" y="95.0" text-anchor="middle">选择一个芯片组</text></g><g class="base"><rect class="vb" x="320" y="230" width="350" height="130" rx="10"/><text class="vt" style="font-size:19.0px" x="495.0" y="276.0" text-anchor="middle">每组2片1K×8并联</text><text class="vt" style="font-size:19.0px" x="495.0" y="302.0" text-anchor="middle">一片接D7…D0</text><text class="vt" style="font-size:19.0px" x="495.0" y="328.0" text-anchor="middle">一片接D15…D8</text></g><g class="base"><rect class="vb" x="720" y="210" width="150" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="795.0" y="249.0" text-anchor="middle">4组×2片</text><text class="vt" style="font-size:19.0px" x="795.0" y="275.0" text-anchor="middle">共8片</text></g></g></svg>