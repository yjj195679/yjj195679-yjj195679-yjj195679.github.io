<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-mst-cut-title atlas-mst-cut-desc"><title id="atlas-mst-cut-title">同一张图：Prim与Kruskal看边的方式</title><desc id="atlas-mst-cut-desc">从A做Prim：先AB(1)，再BC(2)，再CD(3)，总权6。Kruskal按边权1、2、3、4、5排序，前三条已连接全部顶点。；这里所有边权不同，最小生成树唯一。两种算法都解决带权无向连通图的最小生成树问题；不是从起点到各点的最短路径。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-mst-cut-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">同一张图：Prim与Kruskal看边的方式</text><g transform="translate(0 55)"><path class="ve" d="M114.0,101.0 L292.0,101.0"/><text style="font-size:18.0px" class="vt vl" x="205.0" y="89.0" text-anchor="middle">1</text><path class="ve" d="M70.0,136.0 L70.0,272.0"/><text style="font-size:18.0px" class="vt vl" x="70.0" y="194.0" text-anchor="middle">4</text><path class="ve" d="M296.0,135.2 L118.0,273.7"/><text style="font-size:18.0px" class="vt vl" x="205.0" y="194.0" text-anchor="middle">2</text><path class="ve" d="M340.0,136.0 L340.0,272.0"/><text style="font-size:18.0px" class="vt vl" x="340.0" y="194.0" text-anchor="middle">5</text><path class="ve" d="M114.0,311.0 L292.0,311.0"/><text style="font-size:18.0px" class="vt vl" x="205.0" y="299.0" text-anchor="middle">3</text><g class="base"><rect class="vb" x="30" y="70" width="80" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="70.0" y="108.0" text-anchor="middle">A</text></g><g class="base"><rect class="vb" x="300" y="70" width="80" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="340.0" y="108.0" text-anchor="middle">B</text></g><g class="base"><rect class="vb" x="30" y="280" width="80" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="70.0" y="318.0" text-anchor="middle">C</text></g><g class="base"><rect class="vb" x="300" y="280" width="80" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="340.0" y="318.0" text-anchor="middle">D</text></g><g class="base"><rect class="vb" x="520" y="70" width="330" height="240" rx="10"/><text class="vt" style="font-size:19.0px" x="685.0" y="145.0" text-anchor="middle">Prim：从已选顶点集合</text><text class="vt" style="font-size:19.0px" x="685.0" y="171.0" text-anchor="middle">挑最小跨割边</text><text class="vt" style="font-size:19.0px" x="685.0" y="197.0" text-anchor="middle"></text><text class="vt" style="font-size:19.0px" x="685.0" y="223.0" text-anchor="middle">Kruskal：全局边排序</text><text class="vt" style="font-size:19.0px" x="685.0" y="249.0" text-anchor="middle">选最轻且不成环的边</text></g></g></svg>