<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-napt-table-title atlas-napt-table-desc"><title id="atlas-napt-table-title">NAPT：两个内网端点映射为不同公网端口</title><desc id="atlas-napt-table-desc">示例两个内网主机访问同一外部服务，NAPT把源IP和源端口改写为公网地址与不同端口。203.0.113.1使用文档示例地址。；返回报文到达不同公网端口后，按转换状态还原内网目的IP与端口；相关校验和也要更新。具体实现可以把远端元组纳入映射/过滤规则。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-napt-table-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">NAPT：两个内网端点映射为不同公网端口</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#atlas-napt-table-arrow)" d="M244.0,109.4 L331.5,132.0"/><path class="ve" marker-end="url(#atlas-napt-table-arrow)" d="M244.0,290.6 L331.5,268.0"/><g class="base"><rect class="vb" x="20" y="40" width="220" height="80" rx="10"/><text class="vt" style="font-size:19.0px" x="130.0" y="87.0" text-anchor="middle">10.0.0.2:5000</text></g><g class="base"><rect class="vb" x="20" y="280" width="220" height="80" rx="10"/><text class="vt" style="font-size:19.0px" x="130.0" y="327.0" text-anchor="middle">10.0.0.3:5000</text></g><g class="base"><rect class="vb" x="320" y="140" width="550" height="120" rx="10"/><text class="vt" style="font-size:19.0px" x="595.0" y="181.0" text-anchor="middle">NAT映射表</text><text class="vt" style="font-size:19.0px" x="595.0" y="207.0" text-anchor="middle">.2:5000 ↔ 203.0.113.1:40001</text><text class="vt" style="font-size:19.0px" x="595.0" y="233.0" text-anchor="middle">.3:5000 ↔ 203.0.113.1:40002</text></g></g></svg>