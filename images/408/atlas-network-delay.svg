<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-network-delay-title atlas-network-delay-desc"><title id="atlas-network-delay-title">发送与传播：最后一bit何时到达</title><desc id="atlas-network-delay-desc">L用bit、R用bit/s，传播距离d与速率v须使用相容单位；传播时延与报文长度无直接关系。；存储转发多跳时还要算每跳发送、传播、排队与处理；分组可流水重叠，不能把一整个报文的发送时间对所有分组和链路重复累加。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-network-delay-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">发送与传播：最后一bit何时到达</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#atlas-network-delay-arrow)" d="M404.0,110.0 L492.0,110.0"/><path class="ve" marker-end="url(#atlas-network-delay-arrow)" d="M619.0,169.0 L509.3,267.0"/><g class="base"><rect class="vb" x="30" y="55" width="370" height="110" rx="10"/><text class="vt" style="font-size:19.0px" x="215.0" y="104.0" text-anchor="middle">发送端把L bit推上链路</text><text class="vt" style="font-size:19.0px" x="215.0" y="130.0" text-anchor="middle">发送时延 L/R</text></g><g class="base"><rect class="vb" x="500" y="55" width="370" height="110" rx="10"/><text class="vt" style="font-size:19.0px" x="685.0" y="104.0" text-anchor="middle">首bit沿介质传播</text><text class="vt" style="font-size:19.0px" x="685.0" y="130.0" text-anchor="middle">传播时延 d/v</text></g><g class="base"><rect class="vb" x="130" y="275" width="640" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="450.0" y="327.0" text-anchor="middle">忽略排队和处理：最后一bit到达用时 L/R + d/v</text></g></g></svg>