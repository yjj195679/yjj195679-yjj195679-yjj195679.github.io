<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-partition-fit-title atlas-partition-fit-desc"><title id="atlas-partition-fit-title">申请18KiB：首次、最佳、最坏适应选谁</title><desc id="atlas-partition-fit-desc">假设按地址排列的空闲分区大小依次20、50、30KiB，申请18KiB：首次与最佳均选20，最坏选50。；邻近适应从上次结束位置继续循环搜索，缺少上次指针就不能唯一判定。回收时须检查地址上相邻的空闲分区并合并，不能仅按分区表排列相邻就合并。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-partition-fit-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">申请18KiB：首次、最佳、最坏适应选谁</text><g transform="translate(0 55)"><g class="active"><rect class="vb" x="30" y="75" width="240" height="95" rx="10"/><text class="vt" style="font-size:19.0px" x="150.0" y="116.5" text-anchor="middle">空闲区1</text><text class="vt" style="font-size:19.0px" x="150.0" y="142.5" text-anchor="middle">20KiB</text></g><g class="base"><rect class="vb" x="330" y="75" width="240" height="95" rx="10"/><text class="vt" style="font-size:19.0px" x="450.0" y="116.5" text-anchor="middle">空闲区2</text><text class="vt" style="font-size:19.0px" x="450.0" y="142.5" text-anchor="middle">50KiB</text></g><g class="base"><rect class="vb" x="630" y="75" width="240" height="95" rx="10"/><text class="vt" style="font-size:19.0px" x="750.0" y="116.5" text-anchor="middle">空闲区3</text><text class="vt" style="font-size:19.0px" x="750.0" y="142.5" text-anchor="middle">30KiB</text></g><g class="base"><rect class="vb" x="30" y="285" width="240" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="150.0" y="324.0" text-anchor="middle">首次适应</text><text class="vt" style="font-size:19.0px" x="150.0" y="350.0" text-anchor="middle">按地址先找到20</text></g><g class="base"><rect class="vb" x="330" y="285" width="240" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="450.0" y="324.0" text-anchor="middle">最佳适应</text><text class="vt" style="font-size:19.0px" x="450.0" y="350.0" text-anchor="middle">最小可容纳区20</text></g><g class="base"><rect class="vb" x="630" y="285" width="240" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="750.0" y="324.0" text-anchor="middle">最坏适应</text><text class="vt" style="font-size:19.0px" x="750.0" y="350.0" text-anchor="middle">最大区50</text></g></g></svg>