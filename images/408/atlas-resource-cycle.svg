<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-resource-cycle-title atlas-resource-cycle-desc"><title id="atlas-resource-cycle-title">单实例资源：请求边与分配边构成环</title><desc id="atlas-resource-cycle-desc">P1持有R2等R1，P2持有R1等R2，单实例且不可抢占时形成相互等待环。请求边从进程指向资源，分配边反向。；当各资源类型都只有一个实例时，环是死锁的充分必要条件；有多个实例时，存在环只是必要条件，仍须检查是否有进程可以完成。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-resource-cycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">单实例资源：请求边与分配边构成环</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#atlas-resource-cycle-arrow)" d="M249.0,85.0 L617.0,85.0"/><text style="font-size:18.0px" class="vt vl" x="435.0" y="73.0" text-anchor="middle">请求</text><path class="ve" marker-end="url(#atlas-resource-cycle-arrow)" d="M715.0,129.0 L715.0,267.0"/><text style="font-size:18.0px" class="vt vl" x="715.0" y="188.0" text-anchor="middle">已分配</text><path class="ve" marker-end="url(#atlas-resource-cycle-arrow)" d="M621.0,315.0 L253.0,315.0"/><text style="font-size:18.0px" class="vt vl" x="435.0" y="303.0" text-anchor="middle">请求</text><path class="ve" marker-end="url(#atlas-resource-cycle-arrow)" d="M155.0,271.0 L155.0,133.0"/><text style="font-size:18.0px" class="vt vl" x="155.0" y="188.0" text-anchor="middle">已分配</text><g class="base"><rect class="vb" x="65" y="45" width="180" height="80" rx="10"/><text class="vt" style="font-size:19.0px" x="155.0" y="92.0" text-anchor="middle">进程P1</text></g><g class="base"><rect class="vb" x="625" y="45" width="180" height="80" rx="10"/><text class="vt" style="font-size:19.0px" x="715.0" y="79.0" text-anchor="middle">资源R1</text><text class="vt" style="font-size:19.0px" x="715.0" y="105.0" text-anchor="middle">单实例</text></g><g class="base"><rect class="vb" x="625" y="275" width="180" height="80" rx="10"/><text class="vt" style="font-size:19.0px" x="715.0" y="322.0" text-anchor="middle">进程P2</text></g><g class="base"><rect class="vb" x="65" y="275" width="180" height="80" rx="10"/><text class="vt" style="font-size:19.0px" x="155.0" y="309.0" text-anchor="middle">资源R2</text><text class="vt" style="font-size:19.0px" x="155.0" y="335.0" text-anchor="middle">单实例</text></g></g></svg>