<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-segment-page-title atlas-segment-page-desc"><title id="atlas-segment-page-title">分段与分页：逻辑单位、映射方式与保护</title><desc id="atlas-segment-page-desc">分段按逻辑模块划分，段长可变；分页按固定大小划分。段内越界先判断，不能直接拿基址加偏移而跳过保护。；段页式把段内地址继续分为页号和偏移，每段通过自己的页表映射到物理页框。所需访存次数取决于TLB及各级表缓存等条件。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-segment-page-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">分段与分页：逻辑单位、映射方式与保护</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="25" y="40" width="400" height="150" rx="10"/><text class="vt" style="font-size:19.0px" x="225.0" y="96.0" text-anchor="middle">分段：段号s + 段内偏移d</text><text class="vt" style="font-size:19.0px" x="225.0" y="122.0" text-anchor="middle">段表给出base和limit</text><text class="vt" style="font-size:19.0px" x="225.0" y="148.0" text-anchor="middle">d&lt;limit 才允许 base+d</text></g><g class="base"><rect class="vb" x="475" y="40" width="400" height="150" rx="10"/><text class="vt" style="font-size:19.0px" x="675.0" y="96.0" text-anchor="middle">分页：页号p + 页内偏移w</text><text class="vt" style="font-size:19.0px" x="675.0" y="122.0" text-anchor="middle">页表给出页框号f</text><text class="vt" style="font-size:19.0px" x="675.0" y="148.0" text-anchor="middle">物理地址 f×页大小+w</text></g><g class="base"><rect class="vb" x="120" y="285" width="660" height="80" rx="10"/><text class="vt" style="font-size:19.0px" x="450.0" y="332.0" text-anchor="middle">段页式：段号 → 该段页表 → 页框号；页内偏移保持不变</text></g></g></svg>