<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-spooling-title atlas-spooling-desc"><title id="atlas-spooling-title">假脱机打印：多个进程排队共享一台打印机</title><desc id="atlas-spooling-desc">用户进程把作业写入磁盘队列后可继续运行；输出进程再串行驱动物理打印机，形成逻辑上的多用户共享。；SPOOLing依赖外存中的输入/输出井和管理程序；它不等于只在主存里增加一个普通缓冲区，也不是把一台物理设备变成真正同时工作的多台硬件。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-spooling-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">假脱机打印：多个进程排队共享一台打印机</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#atlas-spooling-arrow)" d="M256.3,119.0 L337.0,149.1"/><path class="ve" marker-end="url(#atlas-spooling-arrow)" d="M251.7,276.0 L337.0,242.8"/><path class="ve" marker-end="url(#atlas-spooling-arrow)" d="M579.0,152.4 L642.0,129.8"/><path class="ve" marker-end="url(#atlas-spooling-arrow)" d="M760.0,139.0 L760.0,272.0"/><g class="base"><rect class="vb" x="30" y="40" width="230" height="75" rx="10"/><text class="vt" style="font-size:19.0px" x="145.0" y="84.5" text-anchor="middle">进程A：打印作业</text></g><g class="base"><rect class="vb" x="30" y="280" width="230" height="75" rx="10"/><text class="vt" style="font-size:19.0px" x="145.0" y="324.5" text-anchor="middle">进程B：打印作业</text></g><g class="base"><rect class="vb" x="345" y="145" width="230" height="100" rx="10"/><text class="vt" style="font-size:19.0px" x="460.0" y="189.0" text-anchor="middle">磁盘输出井</text><text class="vt" style="font-size:19.0px" x="460.0" y="215.0" text-anchor="middle">保存作业与数据</text></g><g class="base"><rect class="vb" x="650" y="40" width="220" height="95" rx="10"/><text class="vt" style="font-size:19.0px" x="760.0" y="81.5" text-anchor="middle">假脱机输出进程</text><text class="vt" style="font-size:19.0px" x="760.0" y="107.5" text-anchor="middle">按队列取作业</text></g><g class="base"><rect class="vb" x="650" y="280" width="220" height="95" rx="10"/><text class="vt" style="font-size:19.0px" x="760.0" y="321.5" text-anchor="middle">物理打印机</text><text class="vt" style="font-size:19.0px" x="760.0" y="347.5" text-anchor="middle">一次处理一个作业</text></g></g></svg>