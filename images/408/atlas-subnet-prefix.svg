<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-subnet-prefix-title atlas-subnet-prefix-desc"><title id="atlas-subnet-prefix-title">把192.168.1.0/24等分为4个/26</title><desc id="atlas-subnet-prefix-desc">网络前缀统一为192.168.1，图中省略了前三段。每个/26地址块大小2^(32−26)=64，起点必须按64对齐。；在常规IPv4子网中，每块扣除网络地址和广播地址后可分配62个主机地址；/31点到点和/32等特殊用途不能套同一个减2规则。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-subnet-prefix-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">把192.168.1.0/24等分为4个/26</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#atlas-subnet-prefix-arrow)" d="M384.5,99.0 L204.2,227.0"/><path class="ve" marker-end="url(#atlas-subnet-prefix-arrow)" d="M428.5,99.0 L369.3,227.0"/><path class="ve" marker-end="url(#atlas-subnet-prefix-arrow)" d="M472.5,99.0 L534.4,227.0"/><path class="ve" marker-end="url(#atlas-subnet-prefix-arrow)" d="M516.5,99.0 L699.6,227.0"/><g class="base"><rect class="vb" x="210" y="10" width="480" height="85" rx="10"/><text class="vt" style="font-size:19.0px" x="450.0" y="46.5" text-anchor="middle">借2位：/24 → /26</text><text class="vt" style="font-size:19.0px" x="450.0" y="72.5" text-anchor="middle">每块64个地址，掩码255.255.255.192</text></g><g class="base"><rect class="vb" x="20" y="235" width="205" height="100" rx="10"/><text class="vt" style="font-size:19.0px" x="122.5" y="279.0" text-anchor="middle">.0/26</text><text class="vt" style="font-size:19.0px" x="122.5" y="305.0" text-anchor="middle">范围 .0～.63</text></g><g class="base"><rect class="vb" x="240" y="235" width="205" height="100" rx="10"/><text class="vt" style="font-size:19.0px" x="342.5" y="279.0" text-anchor="middle">.64/26</text><text class="vt" style="font-size:19.0px" x="342.5" y="305.0" text-anchor="middle">范围 .64～.127</text></g><g class="base"><rect class="vb" x="460" y="235" width="205" height="100" rx="10"/><text class="vt" style="font-size:19.0px" x="562.5" y="279.0" text-anchor="middle">.128/26</text><text class="vt" style="font-size:19.0px" x="562.5" y="305.0" text-anchor="middle">范围 .128～.191</text></g><g class="base"><rect class="vb" x="680" y="235" width="205" height="100" rx="10"/><text class="vt" style="font-size:19.0px" x="782.5" y="279.0" text-anchor="middle">.192/26</text><text class="vt" style="font-size:19.0px" x="782.5" y="305.0" text-anchor="middle">范围 .192～.255</text></g></g></svg>