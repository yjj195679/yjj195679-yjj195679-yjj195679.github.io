<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-tcp-byte-seq-title atlas-tcp-byte-seq-desc"><title id="atlas-tcp-byte-seq-title">TCP字节序号：seq和ack都是字节位置</title><desc id="atlas-tcp-byte-seq-desc">seq=1000表示本段首个数据字节的序号；600字节使用1000～1599，不能把末字节写成1600。；ack=1600表示1600之前的字节都已连续收到。纯ACK不占序号，SYN和FIN各占一个序号；没有数据的段也仍有seq字段。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-tcp-byte-seq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">TCP字节序号：seq和ack都是字节位置</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#atlas-tcp-byte-seq-arrow)" d="M204.0,140.0 L237.0,140.0"/><path class="ve" marker-end="url(#atlas-tcp-byte-seq-arrow)" d="M659.0,140.0 L692.0,140.0"/><g class="base"><rect class="vb" x="20" y="95" width="180" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="110.0" y="134.0" text-anchor="middle">已确认</text><text class="vt" style="font-size:19.0px" x="110.0" y="160.0" text-anchor="middle">…999</text></g><g class="active"><rect class="vb" x="245" y="95" width="410" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="450.0" y="134.0" text-anchor="middle">本段seq=1000，数据600B</text><text class="vt" style="font-size:19.0px" x="450.0" y="160.0" text-anchor="middle">覆盖字节1000～1599</text></g><g class="base"><rect class="vb" x="700" y="95" width="180" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="790.0" y="134.0" text-anchor="middle">下一期待字节</text><text class="vt" style="font-size:19.0px" x="790.0" y="160.0" text-anchor="middle">ack=1600</text></g><g class="base"><rect class="vb" x="155" y="290" width="590" height="70" rx="10"/><text class="vt" style="font-size:19.0px" x="450.0" y="332.0" text-anchor="middle">无丢失且此前数据连续：接收后累计确认1600</text></g></g></svg>