<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-thread-resources-title atlas-thread-resources-desc"><title id="atlas-thread-resources-title">同一进程的线程：共享什么，各自保存什么</title><desc id="atlas-thread-resources-desc">线程共享进程资源，但每个执行流需要自己的寄存器现场和栈。某线程的栈在共享地址空间中，其他线程技术上可能访问其地址，不能把“独有使用”误解为天然硬件隔离。；用户级线程是否由内核直接调度，取决于线程映射模型；多对一模型下一个阻塞系统调用可能阻塞整个进程。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-thread-resources-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">同一进程的线程：共享什么，各自保存什么</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#atlas-thread-resources-arrow)" d="M289.4,236.0 L393.9,128.0"/><path class="ve" marker-end="url(#atlas-thread-resources-arrow)" d="M610.6,236.0 L506.1,128.0"/><g class="base"><rect class="vb" x="175" y="20" width="550" height="100" rx="10"/><text class="vt" style="font-size:19.0px" x="450.0" y="64.0" text-anchor="middle">进程共享地址空间</text><text class="vt" style="font-size:19.0px" x="450.0" y="90.0" text-anchor="middle">代码、全局数据、堆、打开文件等进程资源</text></g><g class="base"><rect class="vb" x="50" y="240" width="350" height="125" rx="10"/><text class="vt" style="font-size:19.0px" x="225.0" y="283.5" text-anchor="middle">线程T1独有</text><text class="vt" style="font-size:19.0px" x="225.0" y="309.5" text-anchor="middle">寄存器 / PC / 线程栈</text><text class="vt" style="font-size:19.0px" x="225.0" y="335.5" text-anchor="middle">线程控制信息</text></g><g class="base"><rect class="vb" x="500" y="240" width="350" height="125" rx="10"/><text class="vt" style="font-size:19.0px" x="675.0" y="283.5" text-anchor="middle">线程T2独有</text><text class="vt" style="font-size:19.0px" x="675.0" y="309.5" text-anchor="middle">寄存器 / PC / 线程栈</text><text class="vt" style="font-size:19.0px" x="675.0" y="335.5" text-anchor="middle">线程控制信息</text></g></g></svg>