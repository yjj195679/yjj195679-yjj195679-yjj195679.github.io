<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-tlb-cache-title atlas-tlb-cache-desc"><title id="atlas-tlb-cache-title">地址变换与数据缓存：查到映射还要取数据</title><desc id="atlas-tlb-cache-desc">图采用物理地址访问Cache的简化模型；TLB命中只说明地址映射较快得到，不能推断数据Cache也命中。；TLB未命中但页表项驻留有效，可以查表后继续，不一定发生缺页。真实处理器可能并行访问或使用VIPT等设计，计时要看题设。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-tlb-cache-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">地址变换与数据缓存：查到映射还要取数据</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#atlas-tlb-cache-arrow)" d="M194.0,90.0 L292.0,90.0"/><path class="ve" marker-end="url(#atlas-tlb-cache-arrow)" d="M564.0,90.0 L672.0,90.0"/><path class="ve" marker-end="url(#atlas-tlb-cache-arrow)" d="M430.0,139.0 L430.0,252.0"/><path class="ve" marker-end="url(#atlas-tlb-cache-arrow)" d="M509.8,256.0 L693.7,143.0"/><path class="ve" marker-end="url(#atlas-tlb-cache-arrow)" d="M780.0,139.0 L780.0,252.0"/><g class="base"><rect class="vb" x="20" y="45" width="170" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="105.0" y="84.0" text-anchor="middle">虚拟地址</text><text class="vt" style="font-size:19.0px" x="105.0" y="110.0" text-anchor="middle">页号+偏移</text></g><g class="base"><rect class="vb" x="300" y="45" width="260" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="430.0" y="84.0" text-anchor="middle">TLB</text><text class="vt" style="font-size:19.0px" x="430.0" y="110.0" text-anchor="middle">缓存页号→页框号</text></g><g class="base"><rect class="vb" x="300" y="260" width="260" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="430.0" y="299.0" text-anchor="middle">内存页表</text><text class="vt" style="font-size:19.0px" x="430.0" y="325.0" text-anchor="middle">TLB未命中时查表</text></g><g class="base"><rect class="vb" x="680" y="45" width="200" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="780.0" y="84.0" text-anchor="middle">物理地址</text><text class="vt" style="font-size:19.0px" x="780.0" y="110.0" text-anchor="middle">访问数据Cache</text></g><g class="base"><rect class="vb" x="680" y="260" width="200" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="780.0" y="299.0" text-anchor="middle">数据Cache未命中</text><text class="vt" style="font-size:19.0px" x="780.0" y="325.0" text-anchor="middle">访问主存块</text></g></g></svg>