<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-union-compress-title atlas-union-compress-desc"><title id="atlas-union-compress-title">并查集：路径压缩只改父指针</title><desc id="atlas-union-compress-desc">假设原父指针链A→B→C→R，R为根。递归路径压缩的find(A)在返回时把沿途A、B、C直接指向R。；集合划分和代表根不因此改变；压缩后的图仍是一棵树。按秩合并中的秩在压缩后一般不等于当前精确高度。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-union-compress-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">并查集：路径压缩只改父指针</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#atlas-union-compress-arrow)" d="M394.0,85.0 L492.0,85.0"/><path class="ve" marker-end="url(#atlas-union-compress-arrow)" d="M523.2,341.0 L600.7,290.0"/><path class="ve" marker-end="url(#atlas-union-compress-arrow)" d="M645.6,341.0 L653.8,290.0"/><path class="ve" marker-end="url(#atlas-union-compress-arrow)" d="M768.0,341.0 L706.8,290.0"/><g class="base"><rect class="vb" x="30" y="45" width="360" height="80" rx="10"/><text class="vt" style="font-size:19.0px" x="210.0" y="92.0" text-anchor="middle">A → B → C → R</text></g><g class="active"><rect class="vb" x="500" y="45" width="350" height="80" rx="10"/><text class="vt" style="font-size:19.0px" x="675.0" y="92.0" text-anchor="middle">find(A) 返回根R</text></g><g class="base"><rect class="vb" x="600" y="220" width="120" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="660.0" y="258.0" text-anchor="middle">R</text></g><g class="base"><rect class="vb" x="420" y="345" width="100" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="470.0" y="383.0" text-anchor="middle">A</text></g><g class="base"><rect class="vb" x="590" y="345" width="100" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="640.0" y="383.0" text-anchor="middle">B</text></g><g class="base"><rect class="vb" x="760" y="345" width="100" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="810.0" y="383.0" text-anchor="middle">C</text></g></g></svg>