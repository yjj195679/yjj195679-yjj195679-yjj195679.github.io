<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="atlas-wifi-rts-cts-title atlas-wifi-rts-cts-desc"><title id="atlas-wifi-rts-cts-title">可选RTS/CTS交换：谁听到后需要保持安静</title><desc id="atlas-wifi-rts-cts-desc">普通竞争访问典型先等待DIFS并随机退避，之后可以直接发DATA，也可采用RTS/CTS保护。CTS、ACK等响应采用更短的SIFS。；RTS/CTS能缓解隐藏站问题，但不是所有802.11数据帧发送前都必须有RTS/CTS；无线无法简单等同共享以太网的边发边检测碰撞。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="atlas-wifi-rts-cts-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">可选RTS/CTS交换：谁听到后需要保持安静</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#atlas-wifi-rts-cts-arrow)" d="M239.0,90.0 L642.0,90.0"/><text style="font-size:18.0px" class="vt vl" x="442.5" y="78.0" text-anchor="middle">可选RTS/CTS保护</text><g class="base"><rect class="vb" x="35" y="50" width="200" height="80" rx="10"/><text class="vt" style="font-size:19.0px" x="135.0" y="97.0" text-anchor="middle">发送站</text></g><g class="base"><rect class="vb" x="650" y="50" width="200" height="80" rx="10"/><text class="vt" style="font-size:19.0px" x="750.0" y="97.0" text-anchor="middle">接收站/AP</text></g><g class="base"><rect class="vb" x="70" y="230" width="750" height="90" rx="10"/><text class="vt" style="font-size:19.0px" x="445.0" y="269.0" text-anchor="middle">RTS → CTS → DATA → ACK</text><text class="vt" style="font-size:19.0px" x="445.0" y="295.0" text-anchor="middle">相邻响应之间使用SIFS</text></g><g class="base"><rect class="vb" x="180" y="345" width="540" height="55" rx="10"/><text class="vt" style="font-size:19.0px" x="450.0" y="379.5" text-anchor="middle">邻站根据时长信息更新NAV，按规则延后竞争</text></g></g></svg>