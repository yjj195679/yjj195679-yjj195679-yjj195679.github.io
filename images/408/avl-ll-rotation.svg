<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="avl-ll-rotation-title avl-ll-rotation-desc"><title id="avl-ll-rotation-title">AVL 的 LL 型：右旋保持中序顺序</title><desc id="avl-ll-rotation-desc">插入10后30失衡，左孩子20的左子树增长，围绕30右旋。右旋后20为根，10和30为左右孩子，中序仍为10、20、30。</desc><style>.dg-bg{fill:var(--diagram-bg,#fff)}.dg-box{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.dg-arrow{fill:none;stroke:var(--diagram-line,#356493);stroke-width:2.5}.dg-text{fill:var(--diagram-text,#17212f);font-family:SimSun,serif}.dg-accent{fill:var(--diagram-line,#356493)}</style><defs><marker id="avl-ll-rotation-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-accent" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="dg-bg" width="960" height="520" rx="12"/><text class="dg-text" x="480" y="42" text-anchor="middle" font-size="28">AVL 的 LL 型：右旋保持中序顺序</text><text class="dg-text" x="240" y="95" text-anchor="middle" font-size="22">失衡前：在左孩子的左侧增长</text><rect class="dg-box" x="290" y="125" width="110" height="60" rx="12"/><text class="dg-text" x="345.0" y="163.0" text-anchor="middle" font-size="22">30</text><rect class="dg-box" x="175" y="240" width="110" height="60" rx="12"/><text class="dg-text" x="230.0" y="278.0" text-anchor="middle" font-size="22">20</text><rect class="dg-box" x="60" y="355" width="110" height="60" rx="12"/><text class="dg-text" x="115.0" y="393.0" text-anchor="middle" font-size="22">10</text><path class="dg-arrow" d="M330 185 L250 235" marker-end="url(#avl-ll-rotation-arrow)"/><path class="dg-arrow" d="M215 300 L135 350" marker-end="url(#avl-ll-rotation-arrow)"/><path class="dg-arrow" d="M410 265 L535 265" marker-end="url(#avl-ll-rotation-arrow)"/><text class="dg-text" x="470" y="235" text-anchor="middle" font-size="23">右旋</text><rect class="dg-box" x="665" y="125" width="110" height="60" rx="12"/><text class="dg-text" x="720.0" y="163.0" text-anchor="middle" font-size="22">20</text><rect class="dg-box" x="550" y="285" width="110" height="60" rx="12"/><text class="dg-text" x="605.0" y="323.0" text-anchor="middle" font-size="22">10</text><rect class="dg-box" x="780" y="285" width="110" height="60" rx="12"/><text class="dg-text" x="835.0" y="323.0" text-anchor="middle" font-size="22">30</text><path class="dg-arrow" d="M690 185 L615 280" marker-end="url(#avl-ll-rotation-arrow)"/><path class="dg-arrow" d="M750 185 L825 280" marker-end="url(#avl-ll-rotation-arrow)"/><text class="dg-text" x="480" y="460" text-anchor="middle" font-size="21">旋转不改变中序序列；LR 型须先对左孩子左旋，再对失衡点右旋。</text></svg>
