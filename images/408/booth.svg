<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" role="img" aria-labelledby="booth-title booth-desc"><title id="booth-title">Booth 判位规则：01 加、10 减</title><desc id="booth-desc">Q 零位和附加位为 00 或 11 则不变，为 01 则加 M，为 10 则减 M。然后联合算术右移，保留符号。</desc><style>.d-bg{fill:var(--diagram-bg,#fff)}.d-box{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.d-arrow{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.5}.d-control{stroke-dasharray:8 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif","Songti SC",STSong,SimSun,"Times New Roman",serif}.d-muted{fill:var(--diagram-muted,#46566b)}.d-emphasis{font-weight:700}.d-band{fill:var(--diagram-fill,#f1f4f8)}</style><defs><marker id="booth-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="d-bg" width="960" height="610" rx="12"/><text x="40" y="45" text-anchor="start" font-size="30" class="d-emphasis">Booth 判位规则：01 加、10 减</text><text x="40" y="83" text-anchor="start" font-size="22" class="d-muted">补码乘法 · 观察顺序固定为 (Q0, Q-1)</text><rect class="d-box" x="330" y="115" width="300" height="70" rx="12"/><text x="480.0" y="158.0" text-anchor="middle" font-size="24" class="">检查 (Q0, Q-1)</text><rect class="d-box" x="40" y="235" width="270" height="80" rx="12"/><text x="175.0" y="268.0" text-anchor="middle" font-size="24" class="">00 或 11</text><text x="175.0" y="298.0" text-anchor="middle" font-size="24" class="">A 保持不变</text><rect class="d-box" x="345" y="235" width="270" height="80" rx="12"/><text x="480.0" y="268.0" text-anchor="middle" font-size="24" class="">01</text><text x="480.0" y="298.0" text-anchor="middle" font-size="24" class="">A ← A + M</text><rect class="d-box" x="650" y="235" width="270" height="80" rx="12"/><text x="785.0" y="268.0" text-anchor="middle" font-size="24" class="">10</text><text x="785.0" y="298.0" text-anchor="middle" font-size="24" class="">A ← A - M</text><polyline class="d-arrow " points="480,185 480,205 175,205 175,235" marker-end="url(#booth-arrow)"/><polyline class="d-arrow " points="480,185 480,205 480,205 480,235" marker-end="url(#booth-arrow)"/><polyline class="d-arrow " points="480,185 480,205 785,205 785,235" marker-end="url(#booth-arrow)"/><rect class="d-box" x="80" y="395" width="800" height="85" rx="12"/><text x="480.0" y="430.5" text-anchor="middle" font-size="24" class="">A:Q:Q-1 联合算术右移一位</text><text x="480.0" y="460.5" text-anchor="middle" font-size="24" class="">最高位补 A 的符号位</text><polyline class="d-arrow " points="175,315 175,355 480,355 480,395" marker-end="url(#booth-arrow)"/><polyline class="d-arrow " points="480,315 480,355 480,355 480,395" marker-end="url(#booth-arrow)"/><polyline class="d-arrow " points="785,315 785,355 480,355 480,395" marker-end="url(#booth-arrow)"/><text x="480" y="525" text-anchor="middle" font-size="25" class="">Q-1 初始为 0；重复 n 轮后读取 A:Q</text><text x="480" y="568" text-anchor="middle" font-size="23" class="d-muted">M 为最小负数时，A 与 ±M 须用足够位宽</text></svg>
