<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 665" role="img" aria-labelledby="btree-height-title btree-height-desc"><title id="btree-height-title">B 树高度：先记两端关键字数</title><desc id="btree-height-desc">最少情况下根含一个关键字并有两个孩子，其余结点至少含 a 减一个关键字。最大情况下所有结点含 m 减一个关键字。两端总数分别为二乘 a 的 h减一次方减一，和 m 的 h 次方减一。</desc><style>.d-bg{fill:var(--diagram-bg,#fff)}.d-box{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.d-arrow{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.5}.d-control{stroke-dasharray:8 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif","Songti SC",STSong,SimSun,"Times New Roman",serif}.d-muted{fill:var(--diagram-muted,#46566b)}.d-emphasis{font-weight:700}.d-band{fill:var(--diagram-fill,#f1f4f8)}</style><defs><marker id="btree-height-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="d-bg" width="960" height="665" rx="12"/><text x="40" y="45" text-anchor="start" font-size="30" class="d-emphasis">B 树高度：先记两端关键字数</text><text x="40" y="82" text-anchor="start" font-size="21" class="d-muted">m&gt;=3；a=ceil(m/2)；根为第 1 层；n 为关键字数</text><text x="250" y="125" text-anchor="middle" font-size="25" class="d-emphasis">最稀疏：关键字下限</text><text x="715" y="125" text-anchor="middle" font-size="25" class="d-emphasis">最充满：关键字上限</text><rect class="d-box" x="80" y="150" width="340" height="70" rx="12"/><text x="250.0" y="178.0" text-anchor="middle" font-size="24" class="">第 1 层：1 个根</text><text x="250.0" y="208.0" text-anchor="middle" font-size="24" class="">1 个关键字</text><rect class="d-box" x="535" y="150" width="360" height="70" rx="12"/><text x="715.0" y="178.0" text-anchor="middle" font-size="24" class="">第 1 层：1 个根</text><text x="715.0" y="208.0" text-anchor="middle" font-size="24" class="">m-1 个关键字</text><rect class="d-box" x="80" y="260" width="340" height="85" rx="12"/><text x="250.0" y="295.5" text-anchor="middle" font-size="24" class="">第 2 层：2 个结点</text><text x="250.0" y="325.5" text-anchor="middle" font-size="24" class="">每个 a-1 个关键字</text><rect class="d-box" x="535" y="260" width="360" height="85" rx="12"/><text x="715.0" y="295.5" text-anchor="middle" font-size="24" class="">第 2 层：m 个结点</text><text x="715.0" y="325.5" text-anchor="middle" font-size="24" class="">每个 m-1 个关键字</text><polyline class="d-arrow " points="250,220 250,260" marker-end="url(#btree-height-arrow)"/><polyline class="d-arrow " points="715,220 715,260" marker-end="url(#btree-height-arrow)"/><rect class="d-box" x="65" y="405" width="370" height="85" rx="12"/><text x="250.0" y="440.5" text-anchor="middle" font-size="24" class="">第 h 层：2a^(h-2) 个结点</text><text x="250.0" y="470.5" text-anchor="middle" font-size="24" class="">每个 a-1 个关键字</text><rect class="d-box" x="520" y="405" width="390" height="85" rx="12"/><text x="715.0" y="440.5" text-anchor="middle" font-size="24" class="">第 h 层：m^(h-1) 个结点</text><text x="715.0" y="470.5" text-anchor="middle" font-size="24" class="">每个 m-1 个关键字</text><polyline class="d-arrow " points="250,345 250,405" marker-end="url(#btree-height-arrow)"/><polyline class="d-arrow " points="715,345 715,405" marker-end="url(#btree-height-arrow)"/><text x="250" y="540" text-anchor="middle" font-size="24" class="d-emphasis">n_min = 2*a^(h-1) - 1</text><text x="715" y="540" text-anchor="middle" font-size="24" class="d-emphasis">n_max = m^h - 1</text><text x="480" y="590" text-anchor="middle" font-size="23" class="">反解高度，再按整数取整；h=1 时最少关键字为 1</text><text x="480" y="629" text-anchor="middle" font-size="22" class="d-muted">图中第 h 层展开适用于 h&gt;=2；失败结点不计入高度</text></svg>
