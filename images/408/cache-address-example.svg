<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="cache-address-example-title cache-address-example-desc"><title id="cache-address-example-title">直接映射 Cache：先拆地址，再比较标记</title><desc id="cache-address-example-desc">32位字节地址，数据容量16KiB，块64B，256行。地址拆为18位标记、8位行号、6位块内偏移。</desc><style>.dg-bg{fill:var(--diagram-bg,#fff)}.dg-box{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.dg-arrow{fill:none;stroke:var(--diagram-line,#356493);stroke-width:2.5}.dg-text{fill:var(--diagram-text,#17212f);font-family:SimSun,serif}.dg-accent{fill:var(--diagram-line,#356493)}</style><defs><marker id="cache-address-example-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-accent" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="dg-bg" width="960" height="520" rx="12"/><text class="dg-text" x="480" y="42" text-anchor="middle" font-size="28">直接映射 Cache：先拆地址，再比较标记</text><text class="dg-text" x="480" y="90" text-anchor="middle" font-size="22">32 位字节地址 · 数据容量 16 KiB · 每块 64 B</text><rect class="dg-box" x="50" y="125" width="440" height="85" rx="12"/><text class="dg-text" x="270.0" y="175.5" text-anchor="middle" font-size="22">标记 Tag：18 位</text><rect class="dg-box" x="490" y="125" width="240" height="85" rx="12"/><text class="dg-text" x="610.0" y="175.5" text-anchor="middle" font-size="22">行号：8 位</text><rect class="dg-box" x="730" y="125" width="180" height="85" rx="12"/><text class="dg-text" x="820.0" y="175.5" text-anchor="middle" font-size="22">块内偏移：6 位</text><path class="dg-arrow" d="M610 210 L610 265" marker-end="url(#cache-address-example-arrow)"/><rect class="dg-box" x="440" y="270" width="340" height="80" rx="12"/><text class="dg-text" x="610.0" y="318.0" text-anchor="middle" font-size="22">选中 256 行中的一行</text><path class="dg-arrow" d="M270 210 L270 370" marker-end="url(#cache-address-example-arrow)"/><rect class="dg-box" x="65" y="375" width="410" height="85" rx="12"/><text class="dg-text" x="270.0" y="410.5" text-anchor="middle" font-size="22">有效位为 1 且 Tag 相同</text><text class="dg-text" x="270.0" y="440.5" text-anchor="middle" font-size="22">才是 Cache 命中</text><path class="dg-arrow" d="M820 210 L820 375" marker-end="url(#cache-address-example-arrow)"/><rect class="dg-box" x="560" y="375" width="350" height="85" rx="12"/><text class="dg-text" x="735.0" y="425.5" text-anchor="middle" font-size="22">命中后按偏移取字节</text><text class="dg-text" x="480" y="500" text-anchor="middle" font-size="20">行数 = 16384 / 64 = 256；容量不含标记、有效位等开销。</text></svg>
