<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 750" role="img" aria-labelledby="critical-section-stages-title critical-section-stages-desc"><title id="critical-section-stages-title">互斥程序四段：申请 → 访问 → 释放 → 其他</title><desc id="critical-section-stages-desc">程序每次访问临界资源先进入进入区申请权限，在临界区访问，退出区释放权限，再执行剩余区。可再次循环访问，退出区不是进程终止。</desc><style>.s-bg{fill:var(--diagram-bg,#fff)}.s-node{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.s-edge{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.2}.s-guide{stroke:var(--diagram-line,#58677a);stroke-width:1;stroke-dasharray:5 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif",SimSun,serif}.s-note{fill:var(--diagram-muted,#46566b)}.s-head{font-weight:700}</style><defs><marker id="critical-section-stages-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="s-bg" width="960" height="750" rx="12"/><text x="35" y="44" font-size="28" text-anchor="start" class="s-head">互斥程序四段：申请 → 访问 → 释放 → 其他</text><rect class="s-node" x="120" y="115" width="720" height="76" rx="12"/><text x="480.0" y="146.5" font-size="22" text-anchor="middle" class="">进入区 Entry</text><text x="480.0" y="173.5" font-size="22" text-anchor="middle" class="">申请/检查进入权限</text><rect class="s-node" x="120" y="265" width="720" height="76" rx="12"/><text x="480.0" y="296.5" font-size="22" text-anchor="middle" class="">临界区 Critical</text><text x="480.0" y="323.5" font-size="22" text-anchor="middle" class="">访问临界资源</text><rect class="s-node" x="120" y="415" width="720" height="76" rx="12"/><text x="480.0" y="446.5" font-size="22" text-anchor="middle" class="">退出区 Exit</text><text x="480.0" y="473.5" font-size="22" text-anchor="middle" class="">释放互斥权限</text><rect class="s-node" x="120" y="565" width="720" height="76" rx="12"/><text x="480.0" y="596.5" font-size="22" text-anchor="middle" class="">剩余区 Remainder</text><text x="480.0" y="623.5" font-size="22" text-anchor="middle" class="">其他工作</text><polyline class="s-edge" points="480,191 480,265" marker-end="url(#critical-section-stages-arrow)"/><polyline class="s-edge" points="480,341 480,415" marker-end="url(#critical-section-stages-arrow)"/><polyline class="s-edge" points="480,491 480,565" marker-end="url(#critical-section-stages-arrow)"/><polyline class="s-edge" points="840,603 915,603 915,153 840,153" marker-end="url(#critical-section-stages-arrow)" stroke-dasharray="7 6"/><text x="875" y="375" font-size="20" text-anchor="middle" class="">下一轮</text><text x="480" y="705" font-size="22" text-anchor="middle" class="s-note">临界区是代码段，临界资源是资源；退出区不表示进程终止。</text></svg>
