<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 730" role="img" aria-labelledby="csma-stages-title csma-stages-desc"><title id="csma-stages-title">介质访问：检测碰撞与避免碰撞</title><desc id="csma-stages-desc">左边为 CSMA/CD 监听、发送并检测、碰撞后停止、退避重试；右边为常见无线 DCF 的 DIFS、退避、发送、SIFS 后 ACK。无线退避在忙时冻结。</desc><style>.s-bg{fill:var(--diagram-bg,#fff)}.s-node{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.s-edge{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.2}.s-guide{stroke:var(--diagram-line,#58677a);stroke-width:1;stroke-dasharray:5 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif",SimSun,serif}.s-note{fill:var(--diagram-muted,#46566b)}.s-head{font-weight:700}</style><defs><marker id="csma-stages-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="s-bg" width="960" height="730" rx="12"/><text x="35" y="44" font-size="28" text-anchor="start" class="s-head">介质访问：检测碰撞与避免碰撞</text><text x="235" y="95" font-size="24" text-anchor="middle" class="">CSMA/CD：经典共享以太网</text><text x="725" y="95" font-size="24" text-anchor="middle" class="">CSMA/CA：常见无线 DCF</text><rect class="s-node" x="45" y="130" width="380" height="76" rx="12"/><text x="235.0" y="175.0" font-size="22" text-anchor="middle" class="">监听信道</text><rect class="s-node" x="535" y="130" width="380" height="76" rx="12"/><text x="725.0" y="175.0" font-size="22" text-anchor="middle" class="">空闲满足 DIFS</text><polyline class="s-edge" points="235,206 235,260" marker-end="url(#csma-stages-arrow)"/><polyline class="s-edge" points="725,206 725,260" marker-end="url(#csma-stages-arrow)"/><rect class="s-node" x="45" y="260" width="380" height="76" rx="12"/><text x="235.0" y="291.5" font-size="22" text-anchor="middle" class="">空闲后发送</text><text x="235.0" y="318.5" font-size="22" text-anchor="middle" class="">同时检测碰撞</text><rect class="s-node" x="535" y="260" width="380" height="76" rx="12"/><text x="725.0" y="291.5" font-size="22" text-anchor="middle" class="">随机退避</text><text x="725.0" y="318.5" font-size="22" text-anchor="middle" class="">信道忙则冻结计数</text><polyline class="s-edge" points="235,336 235,390" marker-end="url(#csma-stages-arrow)"/><polyline class="s-edge" points="725,336 725,390" marker-end="url(#csma-stages-arrow)"/><rect class="s-node" x="45" y="390" width="380" height="76" rx="12"/><text x="235.0" y="435.0" font-size="22" text-anchor="middle" class="">若碰撞：强化信号、停止</text><rect class="s-node" x="535" y="390" width="380" height="76" rx="12"/><text x="725.0" y="435.0" font-size="22" text-anchor="middle" class="">退避结束后发送</text><polyline class="s-edge" points="235,466 235,520" marker-end="url(#csma-stages-arrow)"/><polyline class="s-edge" points="725,466 725,520" marker-end="url(#csma-stages-arrow)"/><rect class="s-node" x="45" y="520" width="380" height="76" rx="12"/><text x="235.0" y="565.0" font-size="22" text-anchor="middle" class="">随机退避后重试</text><rect class="s-node" x="535" y="520" width="380" height="76" rx="12"/><text x="725.0" y="565.0" font-size="22" text-anchor="middle" class="">对端等 SIFS 后回 ACK</text><text x="480" y="690" font-size="22" text-anchor="middle" class="s-note">CA 不保证绝无碰撞；SIFS &lt; DIFS；全双工交换以太网不使用 CD 竞争。</text></svg>
