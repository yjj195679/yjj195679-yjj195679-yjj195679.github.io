<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="dfs-color-states-title dfs-color-states-desc"><title id="dfs-color-states-title">DFS 三色：灰色还在搜索路径上</title><desc id="dfs-color-states-desc">白色被发现后变灰，完成所有相邻边的搜索后变黑。有向图中，从当前顶点指回灰色祖先形成回边，可证明有环；指向黑色顶点并不必然有环。</desc><style>.s-bg{fill:var(--diagram-bg,#fff)}.s-node{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.s-edge{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.2}.s-guide{stroke:var(--diagram-line,#58677a);stroke-width:1;stroke-dasharray:5 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif",SimSun,serif}.s-note{fill:var(--diagram-muted,#46566b)}.s-head{font-weight:700}</style><defs><marker id="dfs-color-states-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="s-bg" width="960" height="640" rx="12"/><text x="35" y="44" font-size="28" text-anchor="start" class="s-head">DFS 三色：灰色还在搜索路径上</text><rect class="s-node" x="45" y="130" width="240" height="76" rx="12"/><text x="165.0" y="161.5" font-size="22" text-anchor="middle" class="">白色 White</text><text x="165.0" y="188.5" font-size="22" text-anchor="middle" class="">未发现</text><rect class="s-node" x="360" y="130" width="240" height="76" rx="12"/><text x="480.0" y="161.5" font-size="22" text-anchor="middle" class="">灰色 Gray</text><text x="480.0" y="188.5" font-size="22" text-anchor="middle" class="">已发现，未完成</text><rect class="s-node" x="675" y="130" width="240" height="76" rx="12"/><text x="795.0" y="161.5" font-size="22" text-anchor="middle" class="">黑色 Black</text><text x="795.0" y="188.5" font-size="22" text-anchor="middle" class="">搜索完成</text><polyline class="s-edge" points="285,168 360,168" marker-end="url(#dfs-color-states-arrow)"/><text x="322" y="143" font-size="20" text-anchor="middle" class="">发现</text><polyline class="s-edge" points="600,168 675,168" marker-end="url(#dfs-color-states-arrow)"/><text x="637" y="143" font-size="20" text-anchor="middle" class="">退出</text><rect class="s-node" x="75" y="345" width="230" height="76" rx="12"/><text x="190.0" y="390.0" font-size="22" text-anchor="middle" class="">灰色祖先 A</text><rect class="s-node" x="655" y="345" width="230" height="76" rx="12"/><text x="770.0" y="390.0" font-size="22" text-anchor="middle" class="">当前顶点 B</text><polyline class="s-edge" points="305,380 655,380" marker-end="url(#dfs-color-states-arrow)"/><text x="480" y="352" font-size="20" text-anchor="middle" class="">DFS 树路径 A → … → B</text><polyline class="s-edge" points="655,410 655,475 190,475 190,421" marker-end="url(#dfs-color-states-arrow)"/><text x="480" y="510" font-size="20" text-anchor="middle" class="">回边 B → A：有向图有环</text><text x="480" y="595" font-size="22" text-anchor="middle" class="s-note">指向黑色顶点不必构成环；无向图要排除返回父结点的树边。</text></svg>
