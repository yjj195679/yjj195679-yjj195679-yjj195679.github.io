<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 725" role="img" aria-labelledby="dhcp-states-title dhcp-states-desc"><title id="dhcp-states-title">DHCP：报文流与租约状态分开记</title><desc id="dhcp-states-desc">主路径 INIT、SELECTING、REQUESTING、BOUND；报文为 Discover、Offer、Request、Ack。租期达到 T1 通常单播续租，达到 T2 通常广播重绑定。成功续租回到 BOUND。</desc><style>.s-bg{fill:var(--diagram-bg,#fff)}.s-node{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.s-edge{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.2}.s-guide{stroke:var(--diagram-line,#58677a);stroke-width:1;stroke-dasharray:5 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif",SimSun,serif}.s-note{fill:var(--diagram-muted,#46566b)}.s-head{font-weight:700}</style><defs><marker id="dhcp-states-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="s-bg" width="960" height="725" rx="12"/><text x="35" y="44" font-size="28" text-anchor="start" class="s-head">DHCP：报文流与租约状态分开记</text><rect class="s-node" x="45" y="110" width="230" height="76" rx="12"/><text x="160.0" y="141.5" font-size="22" text-anchor="middle" class="">INIT</text><text x="160.0" y="168.5" font-size="22" text-anchor="middle" class="">初始化</text><rect class="s-node" x="365" y="110" width="230" height="76" rx="12"/><text x="480.0" y="141.5" font-size="22" text-anchor="middle" class="">SELECTING</text><text x="480.0" y="168.5" font-size="22" text-anchor="middle" class="">选择</text><rect class="s-node" x="685" y="110" width="230" height="76" rx="12"/><text x="800.0" y="141.5" font-size="22" text-anchor="middle" class="">REQUESTING</text><text x="800.0" y="168.5" font-size="22" text-anchor="middle" class="">请求</text><polyline class="s-edge" points="275,148 365,148" marker-end="url(#dhcp-states-arrow)"/><text x="320" y="125" font-size="20" text-anchor="middle" class="">Discover</text><polyline class="s-edge" points="595,148 685,148" marker-end="url(#dhcp-states-arrow)"/><text x="640" y="125" font-size="20" text-anchor="middle" class="">Offer 后</text><polyline class="s-edge" points="800,186 800,245 480,245 480,300" marker-end="url(#dhcp-states-arrow)"/><text x="630" y="228" font-size="20" text-anchor="middle" class="">Request / Ack</text><rect class="s-node" x="365" y="300" width="230" height="76" rx="12"/><text x="480.0" y="331.5" font-size="22" text-anchor="middle" class="">BOUND</text><text x="480.0" y="358.5" font-size="22" text-anchor="middle" class="">使用租约</text><rect class="s-node" x="45" y="475" width="230" height="76" rx="12"/><text x="160.0" y="506.5" font-size="22" text-anchor="middle" class="">RENEWING</text><text x="160.0" y="533.5" font-size="22" text-anchor="middle" class="">单播原服务器</text><rect class="s-node" x="685" y="475" width="230" height="76" rx="12"/><text x="800.0" y="506.5" font-size="22" text-anchor="middle" class="">REBINDING</text><text x="800.0" y="533.5" font-size="22" text-anchor="middle" class="">广播续租</text><polyline class="s-edge" points="365,338 160,338 160,475" marker-end="url(#dhcp-states-arrow)"/><text x="260" y="317" font-size="20" text-anchor="middle" class="">T1 到期</text><polyline class="s-edge" points="275,513 685,513" marker-end="url(#dhcp-states-arrow)"/><text x="480" y="488" font-size="20" text-anchor="middle" class="">T2 到期仍未续上</text><polyline class="s-edge" points="160,551 160,610 480,610 480,376" marker-end="url(#dhcp-states-arrow)" stroke-dasharray="7 6"/><text x="330" y="595" font-size="20" text-anchor="middle" class="">收到有效 ACK：更新租约</text><polyline class="s-edge" points="800,551 800,610 480,610" marker-end="url(#dhcp-states-arrow)" stroke-dasharray="7 6"/><text x="480" y="685" font-size="22" text-anchor="middle" class="s-note">默认 T1 = 50% 租期，T2 = 87.5%；到期未续上则停用地址、重新初始化。</text></svg>
