<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="dijkstra-relax-example-title dijkstra-relax-example-desc"><title id="dijkstra-relax-example-title">Dijkstra：松弛不是立刻确定最短路</title><desc id="dijkstra-relax-example-desc">非负边A到B为2，A到C为5，B到C为1。从A出发，先确定B，再把C的暂定距离由5改为3，最后确定C。</desc><style>.dg-bg{fill:var(--diagram-bg,#fff)}.dg-box{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.dg-arrow{fill:none;stroke:var(--diagram-line,#356493);stroke-width:2.5}.dg-text{fill:var(--diagram-text,#17212f);font-family:SimSun,serif}.dg-accent{fill:var(--diagram-line,#356493)}</style><defs><marker id="dijkstra-relax-example-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-accent" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="dg-bg" width="960" height="520" rx="12"/><text class="dg-text" x="480" y="42" text-anchor="middle" font-size="28">Dijkstra：松弛不是立刻确定最短路</text><rect class="dg-box" x="90" y="120" width="120" height="70" rx="12"/><text class="dg-text" x="150.0" y="163.0" text-anchor="middle" font-size="22">A</text><rect class="dg-box" x="410" y="120" width="120" height="70" rx="12"/><text class="dg-text" x="470.0" y="163.0" text-anchor="middle" font-size="22">B</text><rect class="dg-box" x="730" y="120" width="120" height="70" rx="12"/><text class="dg-text" x="790.0" y="163.0" text-anchor="middle" font-size="22">C</text><path class="dg-arrow" d="M215 155 L405 155" marker-end="url(#dijkstra-relax-example-arrow)"/><text class="dg-text" x="310" y="130" text-anchor="middle" font-size="22">2</text><path class="dg-arrow" d="M535 155 L725 155" marker-end="url(#dijkstra-relax-example-arrow)"/><text class="dg-text" x="630" y="130" text-anchor="middle" font-size="22">1</text><path class="dg-arrow" d="M150 195 Q480 320 790 195" marker-end="url(#dijkstra-relax-example-arrow)"/><text class="dg-text" x="480" y="270" text-anchor="middle" font-size="22">直接边：5</text><rect class="dg-box" x="55" y="335" width="260" height="100" rx="12"/><text class="dg-text" x="185.0" y="378.0" text-anchor="middle" font-size="22">确定 A</text><text class="dg-text" x="185.0" y="408.0" text-anchor="middle" font-size="22">d(B)=2，d(C)=5</text><rect class="dg-box" x="350" y="335" width="260" height="100" rx="12"/><text class="dg-text" x="480.0" y="378.0" text-anchor="middle" font-size="22">确定 B</text><text class="dg-text" x="480.0" y="408.0" text-anchor="middle" font-size="22">d(C)=min(5,2+1)=3</text><rect class="dg-box" x="665" y="335" width="260" height="100" rx="12"/><text class="dg-text" x="795.0" y="378.0" text-anchor="middle" font-size="22">确定 C</text><text class="dg-text" x="795.0" y="408.0" text-anchor="middle" font-size="22">最终距离：0、2、3</text><path class="dg-arrow" d="M315 385 L345 385" marker-end="url(#dijkstra-relax-example-arrow)"/><path class="dg-arrow" d="M610 385 L660 385" marker-end="url(#dijkstra-relax-example-arrow)"/><text class="dg-text" x="480" y="495" text-anchor="middle" font-size="20">每轮选择未确定顶点中距离最小者；不能将本规则用于任意负权图。</text></svg>
