<svg class="hw-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="divider-register-path-title divider-register-path-desc"><title id="divider-register-path-title">恢复余数除法器：左移、试减、恢复</title><desc id="divider-register-path-desc">A保留n加一位试减结果，Q逐轮产生商，M扩展到相同宽度。</desc><style>.hw-diagram .hw-bg{fill:var(--diagram-bg,#fff)}.hw-diagram text{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:21px}.hw-diagram .hw-title{font-size:28px;font-weight:bold}.hw-diagram .hw-small{font-size:18px}.hw-diagram .hw-box{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#315d87);stroke-width:2}.hw-diagram .hw-blue{stroke:#387cb5}.hw-diagram .hw-green{stroke:#39846c}.hw-diagram .hw-purple{stroke:#9164ad}.hw-diagram .hw-red{stroke:#c45b64}.hw-diagram .hw-line{fill:none;stroke:var(--diagram-line,#315d87);stroke-width:2.5}.hw-diagram .hw-dash{stroke-dasharray:7 5}</style><defs><marker id="divider-register-path-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--diagram-line,#315d87)"/></marker></defs><rect class="hw-bg" width="960" height="680" rx="12"/><text x="35" y="45" text-anchor="start" class="hw-title">恢复余数除法器：左移、试减、恢复</text><rect x="45" y="110" width="230" height="80" rx="10" class="hw-box hw-blue"/><text x="160.0" y="143.0" text-anchor="middle" class="">M：除数 &gt; 0</text><text x="160.0" y="171.0" text-anchor="middle" class="">零扩展为 n+1 位</text><rect x="365" y="110" width="230" height="80" rx="10" class="hw-box hw-blue"/><text x="480.0" y="143.0" text-anchor="middle" class="">加 / 减法器</text><text x="480.0" y="171.0" text-anchor="middle" class="">A−M 或 A+M</text><rect x="690" y="110" width="230" height="80" rx="10" class="hw-box hw-purple"/><text x="805.0" y="143.0" text-anchor="middle" class="">控制器判 A 的符号</text><text x="805.0" y="171.0" text-anchor="middle" class="">控制恢复、写商位</text><rect x="80" y="300" width="370" height="90" rx="10" class="hw-box hw-green"/><text x="265.0" y="338.0" text-anchor="middle" class="">A：部分余数，n+1 位</text><text x="265.0" y="366.0" text-anchor="middle" class="">初始 0；末态为余数</text><rect x="490" y="300" width="390" height="90" rx="10" class="hw-box hw-green"/><text x="685.0" y="338.0" text-anchor="middle" class="">Q：n 位</text><text x="685.0" y="366.0" text-anchor="middle" class="">被除数 → 商</text><polyline points="275,150 365,150" class="hw-line" marker-end="url(#divider-register-path-arrow)"/><polyline points="480,190 480,245 265,245 265,300" class="hw-line" marker-end="url(#divider-register-path-arrow)"/><polyline points="150,300 150,225 400,225 400,190" class="hw-line" marker-end="url(#divider-register-path-arrow)"/><polyline points="595,150 690,150" class="hw-line hw-dash" marker-end="url(#divider-register-path-arrow)"/><polyline points="800,190 800,300" class="hw-line hw-dash" marker-end="url(#divider-register-path-arrow)"/><text x="480" y="440" text-anchor="middle" class="">每轮先把 A:Q 联合左移，再计算 A ← A−M</text><rect x="45" y="475" width="410" height="80" rx="10" class="hw-box hw-red"/><text x="250.0" y="508.0" text-anchor="middle" class="">试减为负：A ← A+M</text><text x="250.0" y="536.0" text-anchor="middle" class="">恢复后 Q0 ← 0</text><rect x="505" y="475" width="410" height="80" rx="10" class="hw-box hw-green"/><text x="710.0" y="508.0" text-anchor="middle" class="">试减非负：保留 A</text><text x="710.0" y="536.0" text-anchor="middle" class="">Q0 ← 1</text><text x="480" y="600" text-anchor="middle" class="">执行 n 轮：Q 为商，A 为余数；0 ≤ A &lt; M</text><text x="480" y="645" text-anchor="middle" class="hw-small">边界：除数为 0 必须先处理；此模型限定 n 位无符号被除数。</text></svg>