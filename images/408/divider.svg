<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 695" role="img" aria-labelledby="divider-title divider-desc"><title id="divider-title">除法器：左移 → 试减 → 判商位</title><desc id="divider-desc">Q 从被除数逐轮变成商，A 从零成为余数。每轮左移后减 M，负则恢复余数并置商位零，非负置一。结束核对等式和余数范围。</desc><style>.d-bg{fill:var(--diagram-bg,#fff)}.d-box{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.d-arrow{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.5}.d-control{stroke-dasharray:8 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif","Songti SC",STSong,SimSun,"Times New Roman",serif}.d-muted{fill:var(--diagram-muted,#46566b)}.d-emphasis{font-weight:700}.d-band{fill:var(--diagram-fill,#f1f4f8)}</style><defs><marker id="divider-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="d-bg" width="960" height="695" rx="12"/><text x="40" y="45" text-anchor="start" font-size="30" class="d-emphasis">除法器：左移 → 试减 → 判商位</text><text x="40" y="82" text-anchor="start" font-size="22" class="d-muted">无符号恢复余数模型 · M &gt; 0 · A 留额外试减位</text><rect class="d-box" x="230" y="110" width="500" height="75" rx="12"/><text x="480.0" y="155.5" text-anchor="middle" font-size="24" class="">初始 A = 0，Q = 被除数，M = 除数</text><rect class="d-box" x="230" y="225" width="500" height="80" rx="12"/><text x="480.0" y="258.0" text-anchor="middle" font-size="24" class="">A:Q 左移一位</text><text x="480.0" y="288.0" text-anchor="middle" font-size="24" class="">试减 A ← A - M</text><polyline class="d-arrow " points="480,185 480,225" marker-end="url(#divider-arrow)"/><rect class="d-box" x="65" y="375" width="365" height="100" rx="12"/><text x="247.5" y="403.0" text-anchor="middle" font-size="24" class="">试减后 A &lt; 0</text><text x="247.5" y="433.0" text-anchor="middle" font-size="24" class="">A ← A + M（恢复）</text><text x="247.5" y="463.0" text-anchor="middle" font-size="24" class="">Q0 ← 0</text><rect class="d-box" x="530" y="375" width="365" height="100" rx="12"/><text x="712.5" y="403.0" text-anchor="middle" font-size="24" class="">试减后 A &gt;= 0</text><text x="712.5" y="433.0" text-anchor="middle" font-size="24" class="">保留试减结果</text><text x="712.5" y="463.0" text-anchor="middle" font-size="24" class="">Q0 ← 1</text><polyline class="d-arrow " points="480,305 480,340 247,340 247,375" marker-end="url(#divider-arrow)"/><polyline class="d-arrow " points="480,305 480,340 712,340 712,375" marker-end="url(#divider-arrow)"/><rect class="d-box" x="200" y="535" width="560" height="75" rx="12"/><text x="480.0" y="580.5" text-anchor="middle" font-size="24" class="">循环 n 轮：Q 为商，A 为余数</text><polyline class="d-arrow " points="247,475 247,505 480,505 480,535" marker-end="url(#divider-arrow)"/><polyline class="d-arrow " points="712,475 712,505 480,505 480,535" marker-end="url(#divider-arrow)"/><text x="480" y="655" text-anchor="middle" font-size="24" class="d-emphasis">核对：被除数 = M × Q + A，且 0 &lt;= A &lt; M</text></svg>
