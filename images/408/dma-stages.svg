<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 710" role="img" aria-labelledby="dma-stages-title dma-stages-desc"><title id="dma-stages-title">DMA：CPU 负责前后，控制器负责搬运</title><desc id="dma-stages-desc">CPU 先配置并启动 DMA，DMA 控制器按总线授权搬运数据，完成或异常时通常中断 CPU 进行后处理。</desc><style>.s-bg{fill:var(--diagram-bg,#fff)}.s-node{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.s-edge{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.2}.s-guide{stroke:var(--diagram-line,#58677a);stroke-width:1;stroke-dasharray:5 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif",SimSun,serif}.s-note{fill:var(--diagram-muted,#46566b)}.s-head{font-weight:700}</style><defs><marker id="dma-stages-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="s-bg" width="960" height="710" rx="12"/><text x="35" y="44" font-size="28" text-anchor="start" class="s-head">DMA：CPU 负责前后，控制器负责搬运</text><rect class="s-node" x="75" y="150" width="810" height="100" rx="12"/><text x="480.0" y="193.5" font-size="22" text-anchor="middle" class="">CPU：预处理</text><text x="480.0" y="220.5" font-size="22" text-anchor="middle" class="">配置方向、地址、计数，启动 DMA</text><polyline class="s-edge" points="480,250 480,320" marker-end="url(#dma-stages-arrow)"/><rect class="s-node" x="75" y="320" width="810" height="100" rx="12"/><text x="480.0" y="363.5" font-size="22" text-anchor="middle" class="">DMA 控制器：数据传送</text><text x="480.0" y="390.5" font-size="22" text-anchor="middle" class="">按总线授权搬运；CPU 可并行做其他工作</text><polyline class="s-edge" points="480,420 480,490" marker-end="url(#dma-stages-arrow)"/><text x="480" y="462" font-size="20" text-anchor="middle" class="">完成/异常通知（通常中断）</text><rect class="s-node" x="75" y="490" width="810" height="100" rx="12"/><text x="480.0" y="533.5" font-size="22" text-anchor="middle" class="">CPU：后处理</text><text x="480.0" y="560.5" font-size="22" text-anchor="middle" class="">检查结果并安排后续工作</text><text x="480" y="665" font-size="22" text-anchor="middle" class="s-note">周期挪用、成组传送、透明 DMA 是传送方式，不是这三个先后阶段。</text></svg>
