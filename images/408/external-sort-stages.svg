<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 810" role="img" aria-labelledby="external-sort-stages-title external-sort-stages-desc"><title id="external-sort-stages-title">外部排序：先生成段，再逐趟归并</title><desc id="external-sort-stages-desc">以九个初始有序段做三路归并为例，第一趟合并为三个段，第二趟合并为一个最终有序文件。初始归并段生成与后续两趟归并分开计数。</desc><style>.s-bg{fill:var(--diagram-bg,#fff)}.s-node{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.s-edge{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.2}.s-guide{stroke:var(--diagram-line,#58677a);stroke-width:1;stroke-dasharray:5 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif",SimSun,serif}.s-note{fill:var(--diagram-muted,#46566b)}.s-head{font-weight:700}</style><defs><marker id="external-sort-stages-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="s-bg" width="960" height="810" rx="12"/><text x="35" y="44" font-size="28" text-anchor="start" class="s-head">外部排序：先生成段，再逐趟归并</text><rect class="s-node" x="160" y="100" width="640" height="76" rx="12"/><text x="480.0" y="131.5" font-size="22" text-anchor="middle" class="">输入记录 → 初始段生成</text><text x="480.0" y="158.5" font-size="22" text-anchor="middle" class="">内排序 / 置换选择</text><rect class="s-node" x="40" y="260" width="80" height="60" rx="12"/><text x="80.0" y="297.0" font-size="22" text-anchor="middle" class="">R1</text><rect class="s-node" x="140" y="260" width="80" height="60" rx="12"/><text x="180.0" y="297.0" font-size="22" text-anchor="middle" class="">R2</text><rect class="s-node" x="240" y="260" width="80" height="60" rx="12"/><text x="280.0" y="297.0" font-size="22" text-anchor="middle" class="">R3</text><rect class="s-node" x="340" y="260" width="80" height="60" rx="12"/><text x="380.0" y="297.0" font-size="22" text-anchor="middle" class="">R4</text><rect class="s-node" x="440" y="260" width="80" height="60" rx="12"/><text x="480.0" y="297.0" font-size="22" text-anchor="middle" class="">R5</text><rect class="s-node" x="540" y="260" width="80" height="60" rx="12"/><text x="580.0" y="297.0" font-size="22" text-anchor="middle" class="">R6</text><rect class="s-node" x="640" y="260" width="80" height="60" rx="12"/><text x="680.0" y="297.0" font-size="22" text-anchor="middle" class="">R7</text><rect class="s-node" x="740" y="260" width="80" height="60" rx="12"/><text x="780.0" y="297.0" font-size="22" text-anchor="middle" class="">R8</text><rect class="s-node" x="840" y="260" width="80" height="60" rx="12"/><text x="880.0" y="297.0" font-size="22" text-anchor="middle" class="">R9</text><polyline class="s-edge" points="480,176 480,260" marker-end="url(#external-sort-stages-arrow)"/><text x="480" y="225" font-size="20" text-anchor="middle" class="">示例：得到 9 个初始有序段</text><rect class="s-node" x="80" y="440" width="160" height="65" rx="12"/><text x="160.0" y="479.5" font-size="22" text-anchor="middle" class="">归并段 1</text><polyline class="s-edge" points="80,320 80,375 160,375 160,440" marker-end="url(#external-sort-stages-arrow)"/><polyline class="s-edge" points="180,320 180,375 160,375 160,440" marker-end="url(#external-sort-stages-arrow)"/><polyline class="s-edge" points="280,320 280,375 160,375 160,440" marker-end="url(#external-sort-stages-arrow)"/><rect class="s-node" x="400" y="440" width="160" height="65" rx="12"/><text x="480.0" y="479.5" font-size="22" text-anchor="middle" class="">归并段 2</text><polyline class="s-edge" points="380,320 380,375 480,375 480,440" marker-end="url(#external-sort-stages-arrow)"/><polyline class="s-edge" points="480,320 480,375 480,375 480,440" marker-end="url(#external-sort-stages-arrow)"/><polyline class="s-edge" points="580,320 580,375 480,375 480,440" marker-end="url(#external-sort-stages-arrow)"/><rect class="s-node" x="720" y="440" width="160" height="65" rx="12"/><text x="800.0" y="479.5" font-size="22" text-anchor="middle" class="">归并段 3</text><polyline class="s-edge" points="680,320 680,375 800,375 800,440" marker-end="url(#external-sort-stages-arrow)"/><polyline class="s-edge" points="780,320 780,375 800,375 800,440" marker-end="url(#external-sort-stages-arrow)"/><polyline class="s-edge" points="880,320 880,375 800,375 800,440" marker-end="url(#external-sort-stages-arrow)"/><rect class="s-node" x="320" y="625" width="320" height="70" rx="12"/><text x="480.0" y="667.0" font-size="22" text-anchor="middle" class="">最终有序文件</text><polyline class="s-edge" points="160,505 160,565 480,565 480,625" marker-end="url(#external-sort-stages-arrow)"/><polyline class="s-edge" points="480,505 480,565 480,565 480,625" marker-end="url(#external-sort-stages-arrow)"/><polyline class="s-edge" points="800,505 800,565 480,565 480,625" marker-end="url(#external-sort-stages-arrow)"/><text x="480" y="415" font-size="21" text-anchor="middle" class="">第 1 趟：3 路归并，9 段 → 3 段</text><text x="480" y="605" font-size="21" text-anchor="middle" class="">第 2 趟：3 段 → 1 段</text><text x="480" y="765" font-size="22" text-anchor="middle" class="s-note">初始段生成另计；败者树可用于归并的候选记录选择，也可用于置换选择。</text></svg>
