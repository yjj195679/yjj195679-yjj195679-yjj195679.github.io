<svg class="hw-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="fork-cow-pages-title fork-cow-pages-desc"><title id="fork-cow-pages-title">fork 写时复制：独立地址空间，共享物理页</title><desc id="fork-cow-pages-desc">fork之后父子页表可映射同一个受写保护物理页；子进程写入触发复制后只修改自己的新页。</desc><style>.hw-diagram .hw-bg{fill:var(--diagram-bg,#fff)}.hw-diagram text{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:21px}.hw-diagram .hw-title{font-size:28px;font-weight:bold}.hw-diagram .hw-small{font-size:18px}.hw-diagram .hw-box{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#315d87);stroke-width:2}.hw-diagram .hw-blue{stroke:#387cb5}.hw-diagram .hw-green{stroke:#39846c}.hw-diagram .hw-purple{stroke:#9164ad}.hw-diagram .hw-red{stroke:#c45b64}.hw-diagram .hw-line{fill:none;stroke:var(--diagram-line,#315d87);stroke-width:2.5}.hw-diagram .hw-dash{stroke-dasharray:7 5}</style><defs><marker id="fork-cow-pages-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--diagram-line,#315d87)"/></marker></defs><rect class="hw-bg" width="960" height="600" rx="12"/><text x="35" y="45" text-anchor="start" class="hw-title">fork 写时复制：独立地址空间，共享物理页</text><text x="480" y="90" text-anchor="middle" class="">以一个可写私有匿名页为例；页表保护位暂时禁止直接写入</text><rect x="45" y="140" width="230" height="70" rx="10" class="hw-box hw-blue"/><text x="160.0" y="182.0" text-anchor="middle" class="">父进程：虚拟页 v</text><rect x="45" y="270" width="230" height="70" rx="10" class="hw-box hw-blue"/><text x="160.0" y="312.0" text-anchor="middle" class="">子进程：虚拟页 v</text><rect x="430" y="195" width="260" height="90" rx="10" class="hw-box hw-green"/><text x="560.0" y="233.0" text-anchor="middle" class="">原物理页 P</text><text x="560.0" y="261.0" text-anchor="middle" class="">内容：10</text><polyline points="275,175 360,175 360,225 430,225" class="hw-line" marker-end="url(#fork-cow-pages-arrow)"/><polyline points="275,305 360,305 360,255 430,255" class="hw-line" marker-end="url(#fork-cow-pages-arrow)"/><text x="810" y="245" text-anchor="middle" class="hw-small">写入前共享</text><text x="480" y="390" text-anchor="middle" class="">子进程尝试把 10 写成 20：保护异常 → 分配新页 → 复制 → 改映射</text><rect x="45" y="445" width="230" height="65" rx="10" class="hw-box hw-blue"/><text x="160.0" y="484.5" text-anchor="middle" class="">父：v → 原页 P</text><rect x="355" y="445" width="230" height="65" rx="10" class="hw-box hw-green"/><text x="470.0" y="484.5" text-anchor="middle" class="">原页 P：10</text><rect x="655" y="445" width="260" height="65" rx="10" class="hw-box hw-purple"/><text x="785.0" y="484.5" text-anchor="middle" class="">子：v → 新页 P′：20</text><polyline points="275,477 355,477" class="hw-line" marker-end="url(#fork-cow-pages-arrow)"/><text x="480" y="555" text-anchor="middle" class="hw-small">父子 PID 与页表独立；共享的是物理页，不是同一个逻辑地址空间。</text></svg>