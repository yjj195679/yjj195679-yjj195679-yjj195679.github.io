<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="foundation-array-order-title foundation-array-order-desc"><title id="foundation-array-order-title">二维数组：行优先与列优先怎样映射到内存</title><desc id="foundation-array-order-desc">行优先偏移4B，地址1004；列优先偏移8B，地址1008。布局差异用这个位置看得更清楚。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="foundation-array-order-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">二维数组：行优先与列优先怎样映射到内存</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="80" y="60" width="220" height="100" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="190.0" y="104.0">A[0][0]</text><text class="vt" font-size="19" text-anchor="middle" x="190.0" y="130.0">地址1000</text></g><g class="active"><rect class="vb" x="330" y="60" width="220" height="100" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="440.0" y="104.0">A[0][1]</text><text class="vt" font-size="19" text-anchor="middle" x="440.0" y="130.0">地址1008</text></g><g class="base"><rect class="vb" x="580" y="60" width="220" height="100" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="690.0" y="104.0">A[0][2]</text><text class="vt" font-size="19" text-anchor="middle" x="690.0" y="130.0">地址1016</text></g><g class="base"><rect class="vb" x="80" y="215" width="220" height="100" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="190.0" y="259.0">A[1][0]</text><text class="vt" font-size="19" text-anchor="middle" x="190.0" y="285.0">地址1004</text></g><g class="base"><rect class="vb" x="330" y="215" width="220" height="100" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="440.0" y="259.0">A[1][1]</text><text class="vt" font-size="19" text-anchor="middle" x="440.0" y="285.0">地址1012</text></g><g class="base"><rect class="vb" x="580" y="215" width="220" height="100" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="690.0" y="259.0">A[1][2]</text><text class="vt" font-size="19" text-anchor="middle" x="690.0" y="285.0">地址1020</text></g></g></svg>