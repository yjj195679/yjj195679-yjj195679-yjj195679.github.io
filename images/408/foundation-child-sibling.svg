<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="foundation-child-sibling-title foundation-child-sibling-desc"><title id="foundation-child-sibling-title">孩子兄弟转换：为什么右链接连的是兄弟</title><desc id="foundation-child-sibling-desc">把firstchild看作左孩子、nextsibling看作右孩子，便得到二叉树表示。原树先根顺序A,B,C,D对应此二叉树先序。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="foundation-child-sibling-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">孩子兄弟转换：为什么右链接连的是兄弟</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#foundation-child-sibling-arrow)" d="M150.0,86.0 L150.0,142.0"/><text class="vt vl" font-size="18" x="150.0" y="104.0" text-anchor="middle">左</text><path class="ve" marker-end="url(#foundation-child-sibling-arrow)" d="M204.0,181.0 L382.0,181.0"/><text class="vt vl" font-size="18" x="295.0" y="169.0" text-anchor="middle">右</text><path class="ve" marker-end="url(#foundation-child-sibling-arrow)" d="M494.0,181.0 L672.0,181.0"/><text class="vt vl" font-size="18" x="585.0" y="169.0" text-anchor="middle">右</text><g class="base"><rect class="vb" x="100" y="20" width="100" height="62" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="150.0" y="58.0">A</text></g><g class="base"><rect class="vb" x="100" y="150" width="100" height="62" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="150.0" y="188.0">B</text></g><g class="base"><rect class="vb" x="390" y="150" width="100" height="62" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="440.0" y="188.0">C</text></g><g class="base"><rect class="vb" x="680" y="150" width="100" height="62" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="730.0" y="188.0">D</text></g></g></svg>