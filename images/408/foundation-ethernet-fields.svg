<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="foundation-ethernet-fields-title foundation-ethernet-fields-desc"><title id="foundation-ethernet-fields-title">以太网最短帧：64B中哪些字段占了多少字节</title><desc id="foundation-ethernet-fields-desc">在本例无VLAN标签、普通以太网格式下，需补26B，使数据加填充达到46B；再计算FCS。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="foundation-ethernet-fields-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">以太网最短帧：64B中哪些字段占了多少字节</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="25" y="30" width="280" height="90" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="165.0" y="69.0">前导7B+SFD1B</text><text class="vt" font-size="19" text-anchor="middle" x="165.0" y="95.0">不计入下方64B</text></g><g class="base"><rect class="vb" x="25" y="210" width="157" height="95" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="103.5" y="251.5">目的MAC</text><text class="vt" font-size="19" text-anchor="middle" x="103.5" y="277.5">6B</text></g><g class="base"><rect class="vb" x="190" y="210" width="157" height="95" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="268.5" y="251.5">源MAC</text><text class="vt" font-size="19" text-anchor="middle" x="268.5" y="277.5">6B</text></g><g class="base"><rect class="vb" x="355" y="210" width="102" height="95" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="406.0" y="251.5">类型</text><text class="vt" font-size="19" text-anchor="middle" x="406.0" y="277.5">2B</text></g><g class="active"><rect class="vb" x="465" y="210" width="257" height="95" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="593.5" y="251.5">数据+填充</text><text class="vt" font-size="19" text-anchor="middle" x="593.5" y="277.5">46B</text></g><g class="base"><rect class="vb" x="730" y="210" width="122" height="95" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="791.0" y="251.5">FCS</text><text class="vt" font-size="19" text-anchor="middle" x="791.0" y="277.5">4B</text></g></g></svg>