<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="foundation-mar-mdr-title foundation-mar-mdr-desc"><title id="foundation-mar-mdr-title">读主存：MAR传地址，MDR接内容</title><desc id="foundation-mar-mdr-desc">把MDR中的操作数转送到目标通用寄存器；取指时则可转送到IR。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="foundation-mar-mdr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">读主存：MAR传地址，MDR接内容</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#foundation-mar-mdr-arrow)" d="M254.0,95.0 L342.0,95.0"/><text class="vt vl" font-size="18" x="300.0" y="83.0" text-anchor="middle">地址</text><path class="ve" marker-end="url(#foundation-mar-mdr-arrow)" d="M574.0,95.0 L642.0,95.0"/><text class="vt vl" font-size="18" x="610.0" y="83.0" text-anchor="middle">数据</text><path class="ve" marker-end="url(#foundation-mar-mdr-arrow)" d="M760.0,144.0 L760.0,277.0"/><text class="vt vl" font-size="18" x="760.0" y="198.0" text-anchor="middle">传送</text><g class="base"><rect class="vb" x="30" y="50" width="220" height="90" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="140.0" y="102.0">MAR：地址</text></g><g class="base"><rect class="vb" x="350" y="50" width="220" height="90" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="460.0" y="89.0">主存</text><text class="vt" font-size="19" text-anchor="middle" x="460.0" y="115.0">按地址选单元</text></g><g class="base"><rect class="vb" x="650" y="50" width="220" height="90" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="760.0" y="102.0">MDR：数据</text></g><g class="active"><rect class="vb" x="650" y="285" width="220" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="760.0" y="332.0">目标寄存器</text></g></g></svg>