<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="foundation-packet-pipeline-title foundation-packet-pipeline-desc"><title id="foundation-packet-pipeline-title">分组存储转发：3包通过2条链路为什么只用4ms</title><desc id="foundation-packet-pipeline-desc">每包必须完整到达中间路由器后，才能在下一条链路发送；不同包在不同链路上可重叠。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="foundation-packet-pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">分组存储转发：3包通过2条链路为什么只用4ms</text><g transform="translate(0 55)"><g class="done"><rect class="vb" x="140" y="50" width="155" height="95" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="217.5" y="91.5">包1</text><text class="vt" font-size="19" text-anchor="middle" x="217.5" y="117.5">[0,1)ms</text></g><g class="done"><rect class="vb" x="310" y="50" width="155" height="95" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="387.5" y="91.5">包2</text><text class="vt" font-size="19" text-anchor="middle" x="387.5" y="117.5">[1,2)ms</text></g><g class="done"><rect class="vb" x="480" y="50" width="155" height="95" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="557.5" y="91.5">包3</text><text class="vt" font-size="19" text-anchor="middle" x="557.5" y="117.5">[2,3)ms</text></g><g class="base"><rect class="vb" x="15" y="65" width="100" height="60" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="65.0" y="102.0">链路1</text></g><g class="done"><rect class="vb" x="310" y="200" width="155" height="95" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="387.5" y="241.5">包1</text><text class="vt" font-size="19" text-anchor="middle" x="387.5" y="267.5">[1,2)ms</text></g><g class="done"><rect class="vb" x="480" y="200" width="155" height="95" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="557.5" y="241.5">包2</text><text class="vt" font-size="19" text-anchor="middle" x="557.5" y="267.5">[2,3)ms</text></g><g class="active"><rect class="vb" x="650" y="200" width="155" height="95" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="727.5" y="241.5">包3</text><text class="vt" font-size="19" text-anchor="middle" x="727.5" y="267.5">[3,4)ms</text></g><g class="base"><rect class="vb" x="15" y="215" width="100" height="60" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="65.0" y="252.0">链路2</text></g></g></svg>