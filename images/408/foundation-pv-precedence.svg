<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="foundation-pv-precedence-title foundation-pv-precedence-desc"><title id="foundation-pv-precedence-title">前驱图PV：A完成后同时允许B和C推进</title><desc id="foundation-pv-precedence-desc">两条通知彼此独立。被唤醒与真正获得CPU是两回事，但两者不再需要相互等待。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="foundation-pv-precedence-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">前驱图PV：A完成后同时允许B和C推进</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#foundation-pv-precedence-arrow)" d="M391.25,104.0 L243.75,222.0"/><path class="ve" marker-end="url(#foundation-pv-precedence-arrow)" d="M488.75,104.0 L636.25,222.0"/><g class="base"><rect class="vb" x="350" y="30" width="180" height="70" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="440.0" y="72.0">任务A</text></g><g class="base"><rect class="vb" x="100" y="230" width="180" height="70" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="190.0" y="272.0">任务B</text></g><g class="base"><rect class="vb" x="600" y="230" width="180" height="70" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="690.0" y="272.0">任务C</text></g></g></svg>