<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="foundation-rebuild-tree-title foundation-rebuild-tree-desc"><title id="foundation-rebuild-tree-title">先序加中序：左右子树的范围怎样一步步划分</title><desc id="foundation-rebuild-tree-desc">重建后先序A B D E C，中序D B E A C，与输入一致；本例所有关键字互不相同。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="foundation-rebuild-tree-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">先序加中序：左右子树的范围怎样一步步划分</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#foundation-rebuild-tree-arrow)" d="M385.1923076923077,86.0 L305.5,142.0"/><path class="ve" marker-end="url(#foundation-rebuild-tree-arrow)" d="M499.0,84.9591836734694 L612.0,144.91836734693877"/><path class="ve" marker-end="url(#foundation-rebuild-tree-arrow)" d="M213.7037037037037,216.0 L150.44444444444446,277.0"/><path class="ve" marker-end="url(#foundation-rebuild-tree-arrow)" d="M283.7037037037037,216.0 L342.44444444444446,277.0"/><g class="done"><rect class="vb" x="375" y="20" width="120" height="62" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="435.0" y="58.0">A</text></g><g class="done"><rect class="v