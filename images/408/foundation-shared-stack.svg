<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="foundation-shared-stack-title foundation-shared-stack-desc"><title id="foundation-shared-stack-title">共享栈：两边向中间生长怎样判满</title><desc id="foundation-shared-stack-desc">top2从4变5，下标4释放；此时任意一侧都可以继续利用该空槽。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="foundation-shared-stack-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">共享栈：两边向中间生长怎样判满</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="40.0" y="100" width="123.66666666666666" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="101.83333333333333" y="147.0">0:A</text></g><g class="base"><rect class="vb" x="171.66666666666666" y="100" width="123.66666666666666" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="233.5" y="147.0">1:B</text></g><g class="base"><rect class="vb" x="303.3333333333333" y="100" width="123.66666666666666" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="365.16666666666663" y="147.0">2:C</text></g><g class="active"><rect class="vb" x="435.0" y="100" width="123.66666666666666" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="496.8333333333333" y="147.0">3:D</text></g><g class="base"><rect class="vb" x="566.6666666666666" y="100" width="123.66666666666666" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="628.5" y="147.0">4:空</text></g><g class="active"><rect class="vb" x="698.3333333333333" y="100" width="123.66666666666666" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="760.1666666666666" y="147.0">5:X</text></g></g></svg>