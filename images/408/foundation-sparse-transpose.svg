<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="foundation-sparse-transpose-title foundation-sparse-transpose-desc"><title id="foundation-sparse-transpose-title">稀疏矩阵转置：交换行列后为何还要重排</title><desc id="foundation-sparse-transpose-desc">快速转置可用原列的非零项数定位新行的起始位置，避免对每一列反复扫描整个三元组表。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="foundation-sparse-transpose-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">稀疏矩阵转置：交换行列后为何还要重排</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="40" y="100" width="252" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="166.0" y="147.0">原第0列有1项，第2列1项</text></g><g class="base"><rect class="vb" x="300" y="100" width="252" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="426.0" y="147.0">第3列1项，第1列0项</text></g><g class="active"><rect class="vb" x="560" y="100" width="252" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="686.0" y="147.0">用计数前缀和确定写入起点</text></g></g></svg>