<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="foundation-threaded-links-title foundation-threaded-links-desc"><title id="foundation-threaded-links-title">中序线索：真实孩子与前驱后继怎样区分</title><desc id="foundation-threaded-links-desc">C的ltag=1，左链接指向中序前驱B；根B本来有左右孩子，仍保留真实孩子链接。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="foundation-threaded-links-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">中序线索：真实孩子与前驱后继怎样区分</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#foundation-threaded-links-arrow)" d="M382.75,86.0 L212.65,212.0"/><path class="ve" marker-end="url(#foundation-threaded-links-arrow)" d="M477.25,86.0 L647.35,212.0"/><path class="ve" stroke-dasharray="6 5" marker-end="url(#foundation-threaded-links-arrow)" d="M100,251 L40,251 L40,110 L410,110 L410,82"/><path class="ve" stroke-dasharray="6 5" marker-end="url(#foundation-threaded-links-arrow)" d="M760,251 L850,251 L850,110 L450,110 L450,82"/><g class="base"><rect class="vb" x="370" y="20" width="120" height="62" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="430.0" y="58.0">B</text></g><g class="base"><rect class="vb" x="100" y="220" width="120" height="62" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="160.0" y="258.0">A</text></g><g class="base"><rect class="vb" x="640" y="220" width="120" height="62" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="700.0" y="258.0">C</text></g><g class="base"><rect class="vb" x="40" y="335" width="350" height="60" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="215.0" y="372.0">A：rtag=1，right=B</text></g><g class="base"><rect class="vb" x="500" y="335" width="350" height="60" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="675.0" y="372.0">C：ltag=1，left=B</text></g></g></svg>