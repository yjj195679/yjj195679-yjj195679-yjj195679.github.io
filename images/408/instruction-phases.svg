<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 905" role="img" aria-labelledby="instruction-phases-title instruction-phases-desc"><title id="instruction-phases-title">指令周期：有些阶段按条件出现</title><desc id="instruction-phases-desc">取指后可选间址，再执行。执行完成后若有满足响应条件的中断进入中断周期，否则取下一条指令。中断响应转入服务程序，服务程序也正常逐条执行。</desc><style>.s-bg{fill:var(--diagram-bg,#fff)}.s-node{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.s-edge{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.2}.s-guide{stroke:var(--diagram-line,#58677a);stroke-width:1;stroke-dasharray:5 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif",SimSun,serif}.s-note{fill:var(--diagram-muted,#46566b)}.s-head{font-weight:700}</style><defs><marker id="instruction-phases-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="s-bg" width="960" height="905" rx="12"/><text x="35" y="44" font-size="28" text-anchor="start" class="s-head">指令周期：有些阶段按条件出现</text><rect class="s-node" x="285" y="110" width="390" height="76" rx="12"/><text x="480.0" y="141.5" font-size="22" text-anchor="middle" class="">取指 Fetch</text><text x="480.0" y="168.5" font-size="22" text-anchor="middle" class="">取出指令</text><rect class="s-node" x="285" y="290" width="390" height="76" rx="12"/><text x="480.0" y="321.5" font-size="22" text-anchor="middle" class="">间址 Indirect</text><text x="480.0" y="348.5" font-size="22" text-anchor="middle" class="">需要时取得有效地址</text><rect class="s-node" x="285" y="470" width="390" height="76" rx="12"/><text x="480.0" y="501.5" font-size="22" text-anchor="middle" class="">执行 Execute</text><text x="480.0" y="528.5" font-size="22" text-anchor="middle" class="">完成规定操作</text><rect class="s-node" x="285" y="650" width="390" height="76" rx="12"/><text x="480.0" y="681.5" font-size="22" text-anchor="middle" class="">中断 Interrupt</text><text x="480.0" y="708.5" font-size="22" text-anchor="middle" class="">满足条件时硬件响应</text><polyline class="s-edge" points="480,186 480,290" marker-end="url(#instruction-phases-arrow)"/><text x="570" y="243" font-size="20" text-anchor="middle" class="">需要间址</text><polyline class="s-edge" points="480,366 480,470" marker-end="url(#instruction-phases-arrow)"/><polyline class="s-edge" points="480,546 480,650" marker-end="url(#instruction-phases-arrow)"/><text x="590" y="602" font-size="20" text-anchor="middle" class="">有可响应中断</text><polyline class="s-edge" points="285,148 170,148 170,508 285,508" marker-end="url(#instruction-phases-arrow)" stroke-dasharray="7 6"/><text x="165" y="335" font-size="20" text-anchor="middle" class="">无需间址</text><polyline class="s-edge" points="675,508 840,508 840,80 480,80 480,110" marker-end="url(#instruction-phases-arrow)" stroke-dasharray="7 6"/><text x="815" y="335" font-size="20" text-anchor="middle" class="">无可响应中断</text><polyline class="s-edge" points="285,688 85,688 85,80 480,80" marker-end="url(#instruction-phases-arrow)"/><text x="180" y="780" font-size="22" text-anchor="start" class="">响应后转入服务程序，仍逐条取指执行</text><text x="480" y="860" font-size="22" text-anchor="middle" class="s-note">图示为教材指令周期模型；并非每条指令都经历间址和中断阶段。</text></svg>
