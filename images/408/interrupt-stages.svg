<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 715" role="img" aria-labelledby="interrupt-stages-title interrupt-stages-desc"><title id="interrupt-stages-title">中断处理：请求 → 响应 → 服务 → 返回</title><desc id="interrupt-stages-desc">设备请求后经判优并满足响应条件才进入硬件响应。硬件响应转向入口；服务程序处理事务及现场，最后中断返回。</desc><style>.s-bg{fill:var(--diagram-bg,#fff)}.s-node{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.s-edge{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.2}.s-guide{stroke:var(--diagram-line,#58677a);stroke-width:1;stroke-dasharray:5 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif",SimSun,serif}.s-note{fill:var(--diagram-muted,#46566b)}.s-head{font-weight:700}</style><defs><marker id="interrupt-stages-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="s-bg" width="960" height="715" rx="12"/><text x="35" y="44" font-size="28" text-anchor="start" class="s-head">中断处理：请求 → 响应 → 服务 → 返回</text><rect class="s-node" x="75" y="115" width="330" height="76" rx="12"/><text x="240.0" y="146.5" font-size="22" text-anchor="middle" class="">1. 中断请求</text><text x="240.0" y="173.5" font-size="22" text-anchor="middle" class="">设备等提出请求</text><rect class="s-node" x="555" y="115" width="330" height="76" rx="12"/><text x="720.0" y="146.5" font-size="22" text-anchor="middle" class="">2. 判优与条件检查</text><text x="720.0" y="173.5" font-size="22" text-anchor="middle" class="">决定是否受理</text><polyline class="s-edge" points="405,153 555,153" marker-end="url(#interrupt-stages-arrow)"/><rect class="s-node" x="555" y="320" width="330" height="76" rx="12"/><text x="720.0" y="351.5" font-size="22" text-anchor="middle" class="">3. 硬件响应</text><text x="720.0" y="378.5" font-size="22" text-anchor="middle" class="">保存断点、转向入口等</text><polyline class="s-edge" points="720,191 720,320" marker-end="url(#interrupt-stages-arrow)"/><rect class="s-node" x="75" y="320" width="330" height="76" rx="12"/><text x="240.0" y="351.5" font-size="22" text-anchor="middle" class="">4. 中断服务</text><text x="240.0" y="378.5" font-size="22" text-anchor="middle" class="">软件处理、保护/恢复现场</text><polyline class="s-edge" points="555,358 405,358" marker-end="url(#interrupt-stages-arrow)"/><rect class="s-node" x="75" y="525" width="330" height="76" rx="12"/><text x="240.0" y="556.5" font-size="22" text-anchor="middle" class="">5. 中断返回</text><text x="240.0" y="583.5" font-size="22" text-anchor="middle" class="">恢复被中断的执行</text><polyline class="s-edge" points="240,396 240,525" marker-end="url(#interrupt-stages-arrow)"/><text x="480" y="670" font-size="22" text-anchor="middle" class="s-note">请求到达 ≠ 已响应；响应 ≠ 完整服务程序；硬件/软件分工以体系结构为准。</text></svg>
