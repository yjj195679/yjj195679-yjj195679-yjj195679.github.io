<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="kmp-fallback-example-title kmp-fallback-example-desc"><title id="kmp-fallback-example-title">KMP：主串位置不退，模式匹配长度回退</title><desc id="kmp-fallback-example-desc">模式ababaca前缀函数为0、0、1、2、3、0、1。已匹配ababa长度5，下一字符失配，先回退到长度3，再按比较决定是否继续回退。</desc><style>.dg-bg{fill:var(--diagram-bg,#fff)}.dg-box{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.dg-arrow{fill:none;stroke:var(--diagram-line,#356493);stroke-width:2.5}.dg-text{fill:var(--diagram-text,#17212f);font-family:SimSun,serif}.dg-accent{fill:var(--diagram-line,#356493)}</style><defs><marker id="kmp-fallback-example-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-accent" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="dg-bg" width="960" height="520" rx="12"/><text class="dg-text" x="480" y="42" text-anchor="middle" font-size="28">KMP：主串位置不退，模式匹配长度回退</text><text class="dg-text" x="480" y="95" text-anchor="middle" font-size="22">模式 P = a b a b a c a</text><rect class="dg-box" x="90" y="130" width="780" height="70" rx="12"/><text class="dg-text" x="480.0" y="173.0" text-anchor="middle" font-size="22">前缀函数 π = [0, 0, 1, 2, 3, 0, 1]</text><rect class="dg-box" x="55" y="260" width="250" height="90" rx="12"/><text class="dg-text" x="180.0" y="298.0" text-anchor="middle" font-size="22">已匹配长度 j=5</text><text class="dg-text" x="180.0" y="328.0" text-anchor="middle" font-size="22">下一字符比较失败</text><rect class="dg-box" x="355" y="260" width="250" height="90" rx="12"/><text class="dg-text" x="480.0" y="298.0" text-anchor="middle" font-size="22">j ← π[4] = 3</text><text class="dg-text" x="480.0" y="328.0" text-anchor="middle" font-size="22">比较 P[3] 与当前字符</text><rect class="dg-box" x="655" y="260" width="250" height="90" rx="12"/><text class="dg-text" x="780.0" y="298.0" text-anchor="middle" font-size="22">若仍失败：j ← π[2]=1</text><text class="dg-text" x="780.0" y="328.0" text-anchor="middle" font-size="22">继续比较，不退主串 i</text><path class="dg-arrow" d="M305 305 L350 305" marker-end="url(#kmp-fallback-example-arrow)"/><path class="dg-arrow" d="M605 305 L650 305" marker-end="url(#kmp-fallback-example-arrow)"/><text class="dg-text" x="480" y="415" text-anchor="middle" font-size="21">此图使用 0 起始前缀函数 π；不要直接混用 1 起始 next 数组。</text><text class="dg-text" x="480" y="460" text-anchor="middle" font-size="21">匹配成功后，主串位置和已匹配长度各前进一位。</text></svg>
