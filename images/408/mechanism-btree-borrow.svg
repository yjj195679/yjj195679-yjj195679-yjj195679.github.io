<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="mechanism-btree-borrow-title mechanism-btree-borrow-desc"><title id="mechanism-btree-borrow-title">B树删除：经父结点向右兄弟借位</title><desc id="mechanism-btree-borrow-desc">20下移到左叶，右兄弟30上移替换父键，右叶留下40；范围顺序仍成立。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="mechanism-btree-borrow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">B树删除：经父结点向右兄弟借位</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#mechanism-btree-borrow-arrow)" d="M419.8675496688742,96.0 L294.17218543046357,242.0"/><path class="ve" marker-end="url(#mechanism-btree-borrow-arrow)" d="M489.4039735099338,96.0 L653.774834437086,242.0"/><g class="base"><rect class="vb" x="375" y="30" width="150" height="62" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="450.0" y="68.0">30</text></g><g class="active"><rect class="vb" x="150" y="250" width="210" height="75" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="255.0" y="294.5">20</text></g><g class="base"><rect class="vb" x="600" y="250" width="210" height="75" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="705.0" y="294.5">40</text></g></g></svg>