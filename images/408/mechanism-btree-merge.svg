<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="mechanism-btree-merge-title mechanism-btree-merge-desc"><title id="mechanism-btree-merge-title">B树删除：兄弟不能借时合并与根收缩</title><desc id="mechanism-btree-merge-desc">把空左叶、父键20、右叶30合成[20,30]。旧根变空且仅余一个孩子，因此该孩子提升为新根，高度减1。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="mechanism-btree-merge-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">B树删除：兄弟不能借时合并与根收缩</text><g transform="translate(0 55)"><g class="done"><rect class="vb" x="325" y="100" width="250" height="90" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="450.0" y="152.0">20 | 30</text></g></g></svg>