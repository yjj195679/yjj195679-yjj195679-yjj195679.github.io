<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="mechanism-buddy-coalesce-title mechanism-buddy-coalesce-desc"><title id="mechanism-buddy-coalesce-title">伙伴系统：13KiB为何要分配16KiB</title><desc id="mechanism-buddy-coalesce-desc">两个16伙伴合为[0,32)，再与空闲伙伴[32,64)合为64KiB。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="mechanism-buddy-coalesce-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">伙伴系统：13KiB为何要分配16KiB</text><g transform="translate(0 55)"><g class="done"><rect class="vb" x="40" y="110" width="760" height="125" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="420.0" y="166.5">空闲64</text><text class="vt" font-size="19" text-anchor="middle" x="420.0" y="192.5">[0,64)KiB</text></g></g></svg>