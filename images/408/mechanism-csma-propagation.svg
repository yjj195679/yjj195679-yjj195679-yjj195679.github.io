<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="mechanism-csma-propagation-title mechanism-csma-propagation-desc"><title id="mechanism-csma-propagation-title">CSMA/CD时空图：争用期为何是2τ</title><desc id="mechanism-csma-propagation-desc">要确保A尚未发完时能检测到最远端碰撞，最短帧发送时间必须至少2τ。此为共享半双工CSMA/CD模型。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="mechanism-csma-propagation-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">CSMA/CD时空图：争用期为何是2τ</text><g transform="translate(0 55)"><path class="ve" stroke-width="4" d="M95,85 L95,310"/><path class="ve" stroke-width="4" d="M795,85 L795,310"/><path class="ve" stroke-width="4" d="M95,95 L795,195"/><path class="ve" stroke-width="4" d="M795,195 L95,295"/><g class="base"><rect class="vb" x="20" y="25" width="150" height="55" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="95.0" y="59.5">发送端A</text></g><g class="base"><rect class="vb" x="720" y="25" width="150" height="55" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="795.0" y="59.5">发送端B</text></g><g class="base"><rect class="vb" x="160" y="330" width="580" height="65" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="450.0" y="369.5">时间向下；横向表示链路空间；τ是单程传播时延</text></g></g></svg>