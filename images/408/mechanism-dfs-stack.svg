<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="mechanism-dfs-stack-title mechanism-dfs-stack-desc"><title id="mechanism-dfs-stack-title">DFS：深入与回退时递归栈怎样变化</title><desc id="mechanism-dfs-stack-desc">A结束，递归栈清空；DFS发现顺序A、B、D、C。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="mechanism-dfs-stack-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">DFS：深入与回退时递归栈怎样变化</text><g transform="translate(0 55)"><path class="ve" d="M159.0,72.5 L292.0,72.5"/><path class="ve" d="M107.5,109.0 L107.5,237.0"/><path class="ve" d="M347.5,109.0 L347.5,237.0"/><path class="ve" d="M159.0,277.5 L292.0,277.5"/><g class="done"><rect class="vb" x="60" y="40" width="95" height="65" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="107.5" y="79.5">A</text></g><g class="done"><rect class="vb" x="300" y="40" width="95" height="65" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="347.5" y="79.5">B</text></g><g class="done"><rect class="vb" x="60" y="245" width="95" height="65" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="107.5" y="284.5">C</text></g><g class="done"><rect class="vb" x="300" y="245" width="95" height="65" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="347.5" y="284.5">D</text></g><g class="base"><rect class="vb" x="550" y="65" width="310" height="120" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="705.0" y="119.0">递归栈（右端为栈顶）</text><text class="vt" font-size="19" text-anchor="middle" x="705.0" y="145.0"></text></g><g class="base"><rect class="vb" x="550" y="265" width="310" height="85" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="705.0" y="301.5">发现顺序</text><text class="vt" font-size="19" text-anchor="middle" x="705.0" y="327.5">A → B → D → C</text></g></g></svg>