<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="mechanism-dining-order-title mechanism-dining-order-desc"><title id="mechanism-dining-order-title">哲学家进餐：循环等待怎样被统一顺序打破</title><desc id="mechanism-dining-order-desc">统一先申请编号小的筷子，再申请编号大的筷子。原来的持有分配不会同时形成，消除循环等待。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="mechanism-dining-order-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">哲学家进餐：循环等待怎样被统一顺序打破</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="50" y="40" width="190" height="62" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="145.0" y="78.0">P0先C0后C1</text></g><g class="base"><rect class="vb" x="650" y="40" width="190" height="62" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="745.0" y="78.0">P1先C1后C2</text></g><g class="base"><rect class="vb" x="350" y="290" width="190" height="62" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="445.0" y="328.0">P2先C0后C2</text></g></g></svg>