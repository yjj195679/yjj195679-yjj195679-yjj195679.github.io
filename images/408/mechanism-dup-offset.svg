<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="mechanism-dup-offset-title mechanism-dup-offset-desc"><title id="mechanism-dup-offset-title">dup与再次open：文件偏移到底是否共享</title><desc id="mechanism-dup-offset-desc">新open创建另一个打开实例，偏移从0开始，仍可引用同一inode。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="mechanism-dup-offset-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">dup与再次open：文件偏移到底是否共享</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#mechanism-dup-offset-arrow)" d="M254.0,115.0 L342.0,115.0"/><path class="ve" marker-end="url(#mechanism-dup-offset-arrow)" d="M574.2054794520548,164.0 L700.2876712328767,242.0"/><path class="ve" marker-end="url(#mechanism-dup-offset-arrow)" d="M254.0,318.3529411764706 L342.0,320.94117647058823"/><path class="ve" marker-end="url(#mechanism-dup-offset-arrow)" d="M614.0,313.11290322580646 L692.0,306.19354838709677"/><g class="base"><rect class="vb" x="30" y="70" width="220" height="90" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="140.0" y="122.0">fd3 与 fd4</text></g><g class="active"><rect class="vb" x="350" y="70" width="290" height="90" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="495.0" y="109.0">打开实例A</text><text class="vt" font-size="19" text-anchor="middle" x="495.0" y="135.0">偏移=100</text></g><g class="base"><rect class="vb" x="700" y="250" width="180" height="95" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="790.0" y="291.5">同一个inode</text><text class="vt" font-size="19" text-anchor="middle" x="790.0" y="317.5">文件数据</text></g><g class="base"><rect class="vb" x="30" y="280" width="220" height="70" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="140.0" y="322.0">fd5</text></g><g class="base"><rect class="vb" x="350" y="280" width="260" height="90" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="480.0" y="319.0">独立打开实例</text><text class="vt" font-size="19" text-anchor="middle" x="480.0" y="345.0">偏移=0</text></g></g></svg>