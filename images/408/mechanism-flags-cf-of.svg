<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="mechanism-flags-cf-of-title mechanism-flags-cf-of-desc"><title id="mechanism-flags-cf-of-title">同一加法器：CF和OF为何可能不相同</title><desc id="mechanism-flags-cf-of-desc">无符号解释：3+2=5；4位有符号解释：3+2=5。CF看最高位进位，OF看有符号真值是否超出[−8,7]。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="mechanism-flags-cf-of-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">同一加法器：CF和OF为何可能不相同</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="40" y="100" width="252" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="166.0" y="147.0">A=0011</text></g><g class="base"><rect class="vb" x="300" y="100" width="252" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="426.0" y="147.0">B=0010</text></g><g class="active"><rect class="vb" x="560" y="100" width="252" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="686.0" y="147.0">结果=0101</text></g><g class="base"><rect class="vb" x="40.0" y="270" width="189.5" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="134.75" y="317.0">CF=0</text></g><g class="base"><rect class="vb" x="237.5" y="270" width="189.5" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="332.25" y="317.0">OF=0</text></g><g class="base"><rect class="vb" x="435.0" y="270" width="189.5" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="529.75" y="317.0">SF=0</text></g><g class="base"><rect class="vb" x="632.5" y="270" width="189.5" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="727.25" y="317.0">ZF=0</text></g></g></svg>