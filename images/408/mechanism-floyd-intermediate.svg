<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="mechanism-floyd-intermediate-title mechanism-floyd-intermediate-desc"><title id="mechanism-floyd-intermediate-title">Floyd：距离矩阵为何要把k放在最外层</title><desc id="mechanism-floyd-intermediate-desc">检查D[i][k]+D[k][j]，本轮没有更短路径。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="mechanism-floyd-intermediate-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">Floyd：距离矩阵为何要把k放在最外层</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="40" y="50" width="65" height="70" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="72.5" y="92.0">A</text></g><g class="base"><rect class="vb" x="150" y="50" width="130" height="70" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="215.0" y="92.0">0</text></g><g class="base"><rect class="vb" x="300" y="50" width="130" height="70" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="365.0" y="92.0">3</text></g><g class="base"><rect class="vb" x="450" y="50" width="130" height="70" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="515.0" y="92.0">5</text></g><g c