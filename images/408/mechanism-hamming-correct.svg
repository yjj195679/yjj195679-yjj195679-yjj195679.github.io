<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="mechanism-hamming-correct-title mechanism-hamming-correct-desc"><title id="mechanism-hamming-correct-title">海明(7,4)码：校验组与综合征怎样定位错位</title><desc id="mechanism-hamming-correct-desc">把第6位从0改回1，重新检验各组均为偶校验，得到码字0110011。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="mechanism-hamming-correct-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">海明(7,4)码：校验组与综合征怎样定位错位</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="40.0" y="100" width="104.85714285714286" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="92.42857142857143" y="147.0">1:0</text></g><g class="base"><rect class="vb" x="152.85714285714286" y="100" width="104.85714285714286" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="205.28571428571428" y="147.0">2:1</text></g><g class="base"><rect class="vb" x="265.7142857142857" y="100" width="104.85714285714286" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="318.14285714285717" y="147.0">3:1</text></g><g class="base"><rect class="vb" x="378.57142