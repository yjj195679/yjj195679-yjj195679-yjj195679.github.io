<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="mechanism-manchester-wave-title mechanism-manchester-wave-desc"><title id="mechanism-manchester-wave-title">曼彻斯特波形：把1010画成电平跳变</title><desc id="mechanism-manchester-wave-desc">本例沿用正文约定：0在位中间低→高，1在位中间高→低。每位中间必有跳变，可提取时钟；位边界是否跳变取决于相邻位。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="mechanism-manchester-wave-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">曼彻斯特波形：把1010画成电平跳变</text><g transform="translate(0 55)"><path class="ve" stroke-width="4" d="M100,150 L185,150 L185,260 L270,260 L270,260 L355,260 L355,150 L440,150 L440,150 L525,150 L525,260 L610,260 L610,260 L695,260 L695,150 L780,150"/><g class="base"><rect class="vb" x="100" y="30" width="160" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="180.0" y="77.0">bit0=1</text></g><g class="base"><rect class="vb" x="270" y="30" width="160" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="350.0" y="77.0">bit1=0</text></g><g class="base"><rect class="vb" x="440" y="30" width="160" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="520.0" y="77.0">bit2=1</text></g><g class="active"><rect class="vb" x="610" y="30" width="160" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="690.0" y="77.0">bit3=0</text></g><g class="base"><rect class="vb" x="15" y="135" width="55" height="35" rx="10"/><text class="vt" font-size="17.692307692307693" text-anchor="middle" x="42.5" y="159.5">高</text></g><g class="base"><rect class="vb" x="15" y="245" width="55" height="35" rx="10"/><text class="vt" font-size="17.692307692307693" text-anchor="middle" x="42.5" y="269.5">低</text></g></g></svg>