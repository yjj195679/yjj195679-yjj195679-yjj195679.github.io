<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="mechanism-rbt-red-uncle-title mechanism-rbt-red-uncle-desc"><title id="mechanism-rbt-red-uncle-title">红黑树插入：红叔叔时为何先变色</title><desc id="mechanism-rbt-red-uncle-desc">20恰好是根，最后把根改黑。所有根到NIL路径具有相同黑高；本次不需旋转。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="mechanism-rbt-red-uncle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">红黑树插入：红叔叔时为何先变色</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#mechanism-rbt-red-uncle-arrow)" d="M403.32,84.0 L322.76,137.0"/><path class="ve" marker-end="url(#mechanism-rbt-red-uncle-arrow)" d="M514.84,84.0 L608.12,137.0"/><path class="ve" marker-end="url(#mechanism-rbt-red-uncle-arrow)" d="M229.69230769230768,209.0 L169.46153846153845,267.0"/><g class="done rb-black"><rect class="vb" x="390" y="20" width="130" height="60" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="455.0" y="57.0">20 · 黑</text></g><g class="done rb-black"><rect class="vb" x="200" y="145" width="130" height="60" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="265.0" y="182.0">10 · 黑</text></g><g class="done rb-black"><rect class="vb" x="610" y="145" width="130" height="60" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="675.0" y="182.0">30 · 黑</text></g><g class="base rb-red"><rect class="vb" x="65" y="275" width="130" height="60" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="130.0" y="312.0">5 · 红</text></g></g></svg>