<svg class="hw-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="multiplier-register-path-title multiplier-register-path-desc"><title id="multiplier-register-path-title">无符号乘法器：判位、相加、联合右移</title><desc id="multiplier-register-path-desc">M为被乘数，Q最低位决定是否相加，C保存加法进位，C A Q联合逻辑右移。</desc><style>.hw-diagram .hw-bg{fill:var(--diagram-bg,#fff)}.hw-diagram text{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:21px}.hw-diagram .hw-title{font-size:28px;font-weight:bold}.hw-diagram .hw-small{font-size:18px}.hw-diagram .hw-box{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#315d87);stroke-width:2}.hw-diagram .hw-blue{stroke:#387cb5}.hw-diagram .hw-green{stroke:#39846c}.hw-diagram .hw-purple{stroke:#9164ad}.hw-diagram .hw-red{stroke:#c45b64}.hw-diagram .hw-line{fill:none;stroke:var(--diagram-line,#315d87);stroke-width:2.5}.hw-diagram .hw-dash{stroke-dasharray:7 5}</style><defs><marker id="multiplier-register-path-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--diagram-line,#315d87)"/></marker></defs><rect class="hw-bg" width="960" height="580" rx="12"/><text x="35" y="45" text-anchor="start" class="hw-title">无符号乘法器：判位、相加、联合右移</text><rect x="45" y="115" width="210" height="75" rx="10" class="hw-box hw-blue"/><text x="150.0" y="145.5" text-anchor="middle" class="">M：被乘数</text><text x="150.0" y="173.5" text-anchor="middle" class="">n 位，保持不变</text><rect x="365" y="115" width="220" height="75" rx="10" class="hw-box hw-blue"/><text x="475.0" y="145.5" text-anchor="middle" class="">n 位加法器</text><text x="475.0" y="173.5" text-anchor="middle" class="">A + M → C:A</text><rect x="685" y="115" width="230" height="75" rx="10" class="hw-box hw-purple"/><text x="800.0" y="145.5" text-anchor="middle" class="">控制器读取 Q0</text><text x="800.0" y="173.5" text-anchor="middle" class="">1 加 M；0 不加</text><rect x="45" y="295" width="100" height="90" rx="10" class="hw-box hw-blue"/><text x="95.0" y="333.0" text-anchor="middle" class="">C</text><text x="95.0" y="361.0" text-anchor="middle" class="">1 位</text><rect x="150" y="295" width="340" height="90" rx="10" class="hw-box hw-green"/><text x="320.0" y="333.0" text-anchor="middle" class="">A：高半部分积</text><text x="320.0" y="361.0" text-anchor="middle" class="">n 位，初始全 0</text><rect x="495" y="295" width="420" height="90" rx="10" class="hw-box hw-green"/><text x="705.0" y="333.0" text-anchor="middle" class="">Q：乘数 → 低半积</text><text x="705.0" y="361.0" text-anchor="middle" class="">n 位，初始装入乘数</text><polyline points="255,152 365,152" class="hw-line" marker-end="url(#multiplier-register-path-arrow)"/><polyline points="475,190 475,245 95,245 95,295" class="hw-line" marker-end="url(#multiplier-register-path-arrow)"/><polyline points="475,245 320,245 320,295" class="hw-line" marker-end="url(#multiplier-register-path-arrow)"/><polyline points="230,295 230,220 405,220 405,190" class="hw-line" marker-end="url(#multiplier-register-path-arrow)"/><text x="260" y="215" text-anchor="middle" class="hw-small">A 反馈</text><polyline points="840,295 840,190" class="hw-line hw-dash" marker-end="url(#multiplier-register-path-arrow)"/><polyline points="685,152 585,152" class="hw-line hw-dash" marker-end="url(#multiplier-register-path-arrow)"/><text x="480" y="440" text-anchor="middle" class="">每轮：读 Q0 → 必要时相加 → C:A:Q 联合逻辑右移</text><text x="480" y="480" text-anchor="middle" class="">右移方向：C → A 的最高位；A 的最低位 → Q 的最高位</text><text x="480" y="520" text-anchor="middle" class="">完整执行 n 轮，最终 A:Q 是 2n 位乘积</text><text x="480" y="555" text-anchor="middle" class="hw-small">此图是无符号算法；补码 Booth 的判位与算术右移规则不同。</text></svg>