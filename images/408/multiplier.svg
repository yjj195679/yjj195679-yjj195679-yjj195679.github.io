<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 565" role="img" aria-labelledby="multiplier-title multiplier-desc"><title id="multiplier-title">串行乘法器：判位 → 加法 → 联合右移</title><desc id="multiplier-desc">M 输入加法器，A 反馈到加法器，结果写入 C 和 A。Q 的最低位控制是否相加；C A Q 一起右移，进行 n 轮后 A Q 是乘积。</desc><style>.d-bg{fill:var(--diagram-bg,#fff)}.d-box{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.d-arrow{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.5}.d-control{stroke-dasharray:8 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif","Songti SC",STSong,SimSun,"Times New Roman",serif}.d-muted{fill:var(--diagram-muted,#46566b)}.d-emphasis{font-weight:700}.d-band{fill:var(--diagram-fill,#f1f4f8)}</style><defs><marker id="multiplier-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="d-bg" width="960" height="565" rx="12"/><text x="40" y="45" text-anchor="start" font-size="30" class="d-emphasis">串行乘法器：判位 → 加法 → 联合右移</text><text x="40" y="82" text-anchor="start" font-size="22" class="d-muted">无符号 n 位操作数 · C:A:Q 组合右移模型</text><rect class="d-box" x="60" y="120" width="240" height="80" rx="12"/><text x="180.0" y="153.0" text-anchor="middle" font-size="24" class="">M：被乘数</text><text x="180.0" y="183.0" text-anchor="middle" font-size="24" class="">n 位，保持不变</text><rect class="d-box" x="360" y="120" width="220" height="80" rx="12"/><text x="470.0" y="153.0" text-anchor="middle" font-size="24" class="">n 位加法器</text><text x="470.0" y="183.0" text-anchor="middle" font-size="24" class="">A + M → C:A</text><rect class="d-box" x="670" y="120" width="240" height="80" rx="12"/><text x="790.0" y="153.0" text-anchor="middle" font-size="24" class="">控制器读取 Q0</text><text x="790.0" y="183.0" text-anchor="middle" font-size="24" class="">1：加 M；0：保持</text><polyline class="d-arrow " points="300,160 360,160" marker-end="url(#multiplier-arrow)"/><polyline class="d-arrow " points="470,200 470,285" marker-end="url(#multiplier-arrow)"/><polyline class="d-arrow " points="245,285 245,235 395,235 395,200" marker-end="url(#multiplier-arrow)"/><text x="155" y="240" text-anchor="middle" font-size="22" class="">A 反馈</text><polyline class="d-arrow d-control" points="790,285 790,200" marker-end="url(#multiplier-arrow)"/><polyline class="d-arrow d-control" points="670,160 580,160" marker-end="url(#multiplier-arrow)"/><rect class="d-box" x="60" y="285" width="90" height="85" rx="12"/><text x="105.0" y="320.5" text-anchor="middle" font-size="24" class="">C</text><text x="105.0" y="350.5" text-anchor="middle" font-size="24" class="">进位</text><rect class="d-box" x="155" y="285" width="355" height="85" rx="12"/><text x="332.5" y="320.5" text-anchor="middle" font-size="24" class="">A：高半部分积</text><text x="332.5" y="350.5" text-anchor="middle" font-size="24" class="">n 位，初始为 0</text><rect class="d-box" x="515" y="285" width="395" height="85" rx="12"/><text x="712.5" y="320.5" text-anchor="middle" font-size="24" class="">Q：低半积 / 乘数</text><text x="712.5" y="350.5" text-anchor="middle" font-size="24" class="">n 位，初始装乘数</text><polyline class="d-arrow " points="85,425 875,425" marker-end="url(#multiplier-arrow)"/><text x="480" y="409" text-anchor="middle" font-size="25" class="">每轮将 C:A:Q 联合逻辑右移一位</text><text x="480" y="474" text-anchor="middle" font-size="24" class="">加法进位先保留，右移时最高位补 0</text><text x="480" y="525" text-anchor="middle" font-size="27" class="d-emphasis">重复 n 轮：最终 A:Q 为 2n 位乘积</text></svg>
