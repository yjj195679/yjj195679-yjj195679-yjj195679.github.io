<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="network-timers-title network-timers-desc"><title id="network-timers-title">网络层相关时间机制：TTL / 重组 / RIP</title><desc id="network-timers-desc">TTL 是逐跳递减字段，IP 重组端维护分片等待超时。RIP 周期更新约三十秒，路由无更新一百八十秒失效，再经一百二十秒垃圾收集删除。</desc><style>.d-bg{fill:var(--diagram-bg,#fff)}.d-box{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.d-arrow{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.5}.d-control{stroke-dasharray:8 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif","Songti SC",STSong,SimSun,"Times New Roman",serif}.d-muted{fill:var(--diagram-muted,#46566b)}.d-emphasis{font-weight:700}.d-band{fill:var(--diagram-fill,#f1f4f8)}</style><defs><marker id="network-timers-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="d-bg" width="960" height="620" rx="12"/><text x="40" y="45" text-anchor="start" font-size="30" class="d-emphasis">网络层相关时间机制：TTL / 重组 / RIP</text><text x="40" y="82" text-anchor="start" font-size="23" class="d-muted">字段、重组等待、路由老化：先辨机制，再记数值</text><rect class="d-box" x="45" y="125" width="400" height="100" rx="12"/><text x="245.0" y="168.0" text-anchor="middle" font-size="24" class="">IPv4 首部 TTL</text><text x="245.0" y="198.0" text-anchor="middle" font-size="24" class="">转发时递减；归零丢弃</text><rect class="d-box" x="515" y="125" width="400" height="100" rx="12"/><text x="715.0" y="168.0" text-anchor="middle" font-size="24" class="">目的端的 IP 重组超时</text><text x="715.0" y="198.0" text-anchor="middle" font-size="24" class="">分片不全到期后丢弃</text><text x="245" y="267" text-anchor="middle" font-size="24" class="">TTL 不是 TCP 重传计时器</text><text x="715" y="267" text-anchor="middle" font-size="24" class="">IP 不自动按缺片重传</text><text x="40" y="340" text-anchor="start" font-size="27" class="d-emphasis">RIP 的典型标准参数</text><rect class="d-box" x="45" y="385" width="250" height="95" rx="12"/><text x="170.0" y="425.5" text-anchor="middle" font-size="24" class="">周期更新</text><text x="170.0" y="455.5" text-anchor="middle" font-size="24" class="">约 30 s</text><rect class="d-box" x="355" y="385" width="250" height="95" rx="12"/><text x="480.0" y="425.5" text-anchor="middle" font-size="24" class="">最后更新后 180 s</text><text x="480.0" y="455.5" text-anchor="middle" font-size="24" class="">路由失效，度量 = 16</text><rect class="d-box" x="665" y="385" width="250" height="95" rx="12"/><text x="790.0" y="425.5" text-anchor="middle" font-size="24" class="">失效后再 120 s</text><text x="790.0" y="455.5" text-anchor="middle" font-size="24" class="">垃圾收集删除</text><polyline class="d-arrow " points="605,432 665,432" marker-end="url(#network-timers-arrow)"/><text x="480" y="533" text-anchor="middle" font-size="22" class="d-muted">RIP：左框是周期事件；中→右是无更新时的失效流程</text><text x="480" y="580" text-anchor="middle" font-size="23" class="">协议参数/实现配置以题设为准，不套用成所有网络的秒数</text></svg>
