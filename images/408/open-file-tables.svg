<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1290" role="img" aria-labelledby="open-file-tables-title open-file-tables-desc"><title id="open-file-tables-title">打开文件表的关系与字段归属</title><desc id="open-file-tables-desc">上半部分为教材二表模型：P 与 Q 各自保存读写指针和访问方式，均指向系统表第 7 项，公共信息共享。下半部分为 UNIX/Linux：父进程 fd3、由 dup 产生的 fd4，以及在复制前仅有 fd3 时 fork 出的子进程 fd3，都引用同一打开文件描述 X，共享偏移量和打开方式；另一次 open 得到打开文件描述 Y，位置独立，X 与 Y 最终引用同一 inode。</desc><style>.of-bg{fill:var(--diagram-bg,#fff)}.of-node{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.of-arrow{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.3}.of-separator{stroke:var(--diagram-line,#58677a);stroke-width:1;stroke-dasharray:6 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif",SimSun,serif}</style><defs><marker id="open-file-tables-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="of-bg" width="960" height="1290" rx="12"/><text x="480" y="45" text-anchor="middle" font-size="29">打开文件表：先区分模型，再判断字段位置</text><text x="480" y="100" text-anchor="middle" font-size="26">A · 408 常见教材二表模型</text><rect class="of-node" x="40" y="135" width="390" height="145" rx="12"/><text x="235.0" y="186.5" text-anchor="middle" font-size="22">进程 P：fd = 3</text><text x="235.0" y="215.5" text-anchor="middle" font-size="22">读写指针 = 20；本次只读</text><text x="235.0" y="244.5" text-anchor="middle" font-size="22">系统表索引 = 7</text><rect class="of-node" x="530" y="135" width="390" height="145" rx="12"/><text x="725.0" y="186.5" text-anchor="middle" font-size="22">进程 Q：fd = 4</text><text x="725.0" y="215.5" text-anchor="middle" font-size="22">读写指针 = 80；本次读写</text><text x="725.0" y="244.5" text-anchor="middle" font-size="22">系统表索引 = 7</text><polyline class="of-arrow" points="235,280 235,315 350,315 350,355" marker-end="url(#open-file-tables-arrow)"/><polyline class="of-arrow" points="725,280 725,315 610,315 610,355" marker-end="url(#open-file-tables-arrow)"/><rect class="of-node" x="215" y="355" width="530" height="150" rx="12"/><text x="480.0" y="394.5" text-anchor="middle" font-size="22">系统打开文件表：第 7 项</text><text x="480.0" y="423.5" text-anchor="middle" font-size="22">公共文件位置/大小/时间等信息或引用</text><text x="480.0" y="452.5" text-anchor="middle" font-size="22">打开计数 = 2（图示：两个进程各打开一次）</text><text x="480.0" y="481.5" text-anchor="middle" font-size="22">可引用 FCB / inode</text><text x="480" y="550" text-anchor="middle" font-size="22">共享公共文件信息，不要求两个进程使用相同位置或相同访问方式。</text><line class="of-separator" x1="40" y1="585" x2="920" y2="585"/><text x="480" y="635" text-anchor="middle" font-size="25">B · UNIX/Linux 三层模型：fd 表 → 打开文件描述 → inode</text><text x="160" y="680" text-anchor="middle" font-size="23">进程 fd 表</text><text x="485" y="680" text-anchor="middle" font-size="23">系统级打开实例</text><text x="810" y="680" text-anchor="middle" font-size="23">公共文件元数据</text><rect class="of-node" x="30" y="715" width="260" height="110" rx="12"/><text x="160.0" y="749.0" text-anchor="middle" font-size="22">P：fd3、fd4=dup(fd3)</text><text x="160.0" y="778.0" text-anchor="middle" font-size="22">各自有描述符标志</text><text x="160.0" y="807.0" text-anchor="middle" font-size="22">如 FD_CLOEXEC</text><rect class="of-node" x="350" y="715" width="270" height="140" rx="12"/><text x="485.0" y="749.5" text-anchor="middle" font-size="22">打开文件描述 X</text><text x="485.0" y="778.5" text-anchor="middle" font-size="22">偏移量 = 20；读写方式</text><text x="485.0" y="807.5" text-anchor="middle" font-size="22">状态标志，如 O_APPEND</text><text x="485.0" y="836.5" text-anchor="middle" font-size="22">图示 fd 引用 = 3</text><polyline class="of-arrow" points="290,745 350,745" marker-end="url(#open-file-tables-arrow)"/><polyline class="of-arrow" points="290,790 350,790" marker-end="url(#open-file-tables-arrow)"/><rect class="of-node" x="30" y="890" width="260" height="85" rx="12"/><text x="160.0" y="926.0" text-anchor="middle" font-size="22">子进程 Q：继承 fd3</text><text x="160.0" y="955.0" text-anchor="middle" font-size="22">由仅有 fd3 时 fork 得到</text><polyline class="of-arrow" points="290,932 320,932 320,830 350,830" marker-end="url(#open-file-tables-arrow)" stroke-dasharray="7 6"/><rect class="of-node" x="30" y="1040" width="260" height="100" rx="12"/><text x="160.0" y="1083.5" text-anchor="middle" font-size="22">P：fd5 = 独立 open</text><text x="160.0" y="1112.5" text-anchor="middle" font-size="22">再次打开同一文件</text><rect class="of-node" x="350" y="1040" width="270" height="110" rx="12"/><text x="485.0" y="1074.0" text-anchor="middle" font-size="22">打开文件描述 Y</text><text x="485.0" y="1103.0" text-anchor="middle" font-size="22">偏移量 = 0；只读方式</text><text x="485.0" y="1132.0" text-anchor="middle" font-size="22">图示 fd 引用 = 1</text><polyline class="of-arrow" points="290,1090 350,1090" marker-end="url(#open-file-tables-arrow)"/><rect class="of-node" x="700" y="850" width="230" height="220" rx="12"/><text x="815.0" y="895.5" text-anchor="middle" font-size="22">同一 inode</text><text x="815.0" y="924.5" text-anchor="middle" font-size="22">所有者 / 组</text><text x="815.0" y="953.5" text-anchor="middle" font-size="22">文件权限位等</text><text x="815.0" y="982.5" text-anchor="middle" font-size="22">文件大小、时间</text><text x="815.0" y="1011.5" text-anchor="middle" font-size="22">数据块定位信息</text><text x="815.0" y="1040.5" text-anchor="middle" font-size="22">不保存本次偏移量</text><polyline class="of-arrow" points="620,785 655,785 655,920 700,920" marker-end="url(#open-file-tables-arrow)"/><polyline class="of-arrow" points="620,1095 655,1095 655,1015 700,1015" marker-end="url(#open-file-tables-arrow)"/><text x="480" y="1205" text-anchor="middle" font-size="22">fd3、fd4、继承的 fd3 共享 X 的位置；fd5 的 Y 独立，仍指向同一 inode。</text><text x="480" y="1245" text-anchor="middle" font-size="22">本次打开方式不同于文件自身 rwx/ACL；两种模型的“系统表项”粒度不同。</text></svg>
