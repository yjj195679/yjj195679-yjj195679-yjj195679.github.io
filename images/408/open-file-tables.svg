<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="open-file-tables-title open-file-tables-desc"><title id="open-file-tables-title">打开文件表的关系与字段归属</title><desc id="open-file-tables-desc">教材二表模型：进程 P、Q 的 fd 分别索引各自进程表项，各自记录读写位置和本次访问权限；二者引用系统表同一项，共享外存位置、大小等公共信息。图示两进程各打开一次，打开计数为二。</desc><style>.of-bg{fill:var(--diagram-bg,#fff)}.of-node{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.of-arrow{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.3}.of-separator{stroke:var(--diagram-line,#58677a);stroke-width:1;stroke-dasharray:6 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif",SimSun,serif}</style><defs><marker id="open-file-tables-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="of-bg" width="960" height="580" rx="12"/><text x="480" y="45" text-anchor="middle" font-size="29">打开文件表：进程记用法，系统记公共信息</text><text x="480" y="90" text-anchor="middle" font-size="22">408 常见教材二表模型</text><rect class="of-node" x="40" y="130" width="390" height="130" rx="12"/><text x="235.0" y="174.0" text-anchor="middle" font-size="22">进程 P：fd = 3</text><text x="235.0" y="203.0" text-anchor="middle" font-size="22">读写位置 = 20；本次只读</text><text x="235.0" y="232.0" text-anchor="middle" font-size="22">系统表索引 = 7</text><rect class="of-node" x="530" y="130" width="390" height="130" rx="12"/><text x="725.0" y="174.0" text-anchor="middle" font-size="22">进程 Q：fd = 4</text><text x="725.0" y="203.0" text-anchor="middle" font-size="22">读写位置 = 80；本次读写</text><text x="725.0" y="232.0" text-anchor="middle" font-size="22">系统表索引 = 7</text><polyline class="of-arrow" points="235,260 235,300 350,300 350,345" marker-end="url(#open-file-tables-arrow)"/><polyline class="of-arrow" points="725,260 725,300 610,300 610,345" marker-end="url(#open-file-tables-arrow)"/><rect class="of-node" x="215" y="345" width="530" height="130" rx="12"/><text x="480.0" y="389.0" text-anchor="middle" font-size="22">系统打开文件表：第 7 项</text><text x="480.0" y="418.0" text-anchor="middle" font-size="22">外存位置、大小等公共信息或引用</text><text x="480.0" y="447.0" text-anchor="middle" font-size="22">打开计数 = 2（两进程各打开一次）</text><text x="480" y="535" text-anchor="middle" font-size="22">fd → 进程表项 → 系统表项；同一文件，使用位置和权限可不同。</text></svg>
