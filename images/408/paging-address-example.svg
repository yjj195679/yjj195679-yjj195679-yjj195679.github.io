<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="paging-address-example-title paging-address-example-desc"><title id="paging-address-example-title">分页地址变换：页号查表，偏移原样保留</title><desc id="paging-address-example-desc">4KiB页面，虚拟地址0x12345，页号0x12、偏移0x345，页表映射到页框0x2A，物理地址0x2A345。</desc><style>.dg-bg{fill:var(--diagram-bg,#fff)}.dg-box{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.dg-arrow{fill:none;stroke:var(--diagram-line,#356493);stroke-width:2.5}.dg-text{fill:var(--diagram-text,#17212f);font-family:SimSun,serif}.dg-accent{fill:var(--diagram-line,#356493)}</style><defs><marker id="paging-address-example-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-accent" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="dg-bg" width="960" height="540" rx="12"/><text class="dg-text" x="480" y="42" text-anchor="middle" font-size="28">分页地址变换：页号查表，偏移原样保留</text><text class="dg-text" x="480" y="92" text-anchor="middle" font-size="22">页大小 4 KiB = 2¹² B；虚拟地址 0x12345</text><rect class="dg-box" x="70" y="130" width="340" height="85" rx="12"/><text class="dg-text" x="240.0" y="180.5" text-anchor="middle" font-size="22">虚拟页号 0x12</text><rect class="dg-box" x="550" y="130" width="340" height="85" rx="12"/><text class="dg-text" x="720.0" y="180.5" text-anchor="middle" font-size="22">页内偏移 0x345</text><path class="dg-arrow" d="M240 215 L240 270" marker-end="url(#paging-address-example-arrow)"/><rect class="dg-box" x="70" y="275" width="340" height="85" rx="12"/><text class="dg-text" x="240.0" y="310.5" text-anchor="middle" font-size="22">查页表：页号 → 页框号</text><text class="dg-text" x="240.0" y="340.5" text-anchor="middle" font-size="22">有效且驻留时得到 0x2A</text><path class="dg-arrow" d="M240 360 L240 405" marker-end="url(#paging-address-example-arrow)"/><path class="dg-arrow" d="M720 215 L720 405" marker-end="url(#paging-address-example-arrow)"/><rect class="dg-box" x="70" y="410" width="820" height="70" rx="12"/><text class="dg-text" x="480.0" y="453.0" text-anchor="middle" font-size="22">物理地址 = 0x2A × 0x1000 + 0x345 = 0x2A345</text><text class="dg-text" x="480" y="510" text-anchor="middle" font-size="20">未驻留须先处理缺页；地址越界或权限错误不能当作普通命中。</text></svg>
