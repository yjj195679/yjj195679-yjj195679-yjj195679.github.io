<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="pipeline-stages-title pipeline-stages-desc"><title id="pipeline-stages-title">五级流水：阶段名称与时间重叠</title><desc id="pipeline-stages-desc">上方列出 IF 取指、ID 译码读寄存器、EX 运算算地址、MEM 数据访存、WB 写回。下方以三条无停顿指令展示各阶段逐拍重叠；实际数据相关和资源冲突可能引入停顿。</desc><style>.s-bg{fill:var(--diagram-bg,#fff)}.s-node{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.s-edge{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.2}.s-guide{stroke:var(--diagram-line,#58677a);stroke-width:1;stroke-dasharray:5 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif",SimSun,serif}.s-note{fill:var(--diagram-muted,#46566b)}.s-head{font-weight:700}</style><defs><marker id="pipeline-stages-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="s-bg" width="960" height="650" rx="12"/><text x="35" y="44" font-size="28" text-anchor="start" class="s-head">五级流水：阶段名称与时间重叠</text><text x="480" y="95" font-size="22" text-anchor="middle" class="s-note">经典五级教学模型：下表按无停顿、每级 1 拍示意</text><rect class="s-node" x="35" y="130" width="165" height="95" rx="12"/><text x="117.5" y="171.0" font-size="22" text-anchor="middle" class="">IF</text><text x="117.5" y="198.0" font-size="22" text-anchor="middle" class="">取指</text><polyline class="s-edge" points="200,177 219,177" marker-end="url(#pipeline-stages-arrow)"/><rect class="s-node" x="219" y="130" width="165" height="95" rx="12"/><text x="301.5" y="171.0" font-size="22" text-anchor="middle" class="">ID</text><text x="301.5" y="198.0" font-size="22" text-anchor="middle" class="">译码/读寄存器</text><polyline class="s-edge" points="384,177 403,177" marker-end="url(#pipeline-stages-arrow)"/><rect class="s-node" x="403" y="130" width="165" height="95" rx="12"/><text x="485.5" y="171.0" font-size="22" text-anchor="middle" class="">EX</text><text x="485.5" y="198.0" font-size="22" text-anchor="middle" class="">运算/算地址</text><polyline class="s-edge" points="568,177 587,177" marker-end="url(#pipeline-stages-arrow)"/><rect class="s-node" x="587" y="130" width="165" height="95" rx="12"/><text x="669.5" y="171.0" font-size="22" text-anchor="middle" class="">MEM</text><text x="669.5" y="198.0" font-size="22" text-anchor="middle" class="">数据访存</text><polyline class="s-edge" points="752,177 771,177" marker-end="url(#pipeline-stages-arrow)"/><rect class="s-node" x="771" y="130" width="165" height="95" rx="12"/><text x="853.5" y="171.0" font-size="22" text-anchor="middle" class="">WB</text><text x="853.5" y="198.0" font-size="22" text-anchor="middle" class="">写回</text><text x="200" y="285" font-size="21" text-anchor="middle" class="">T1</text><text x="305" y="285" font-size="21" text-anchor="middle" class="">T2</text><text x="410" y="285" font-size="21" text-anchor="middle" class="">T3</text><text x="515" y="285" font-size="21" text-anchor="middle" class="">T4</text><text x="620" y="285" font-size="21" text-anchor="middle" class="">T5</text><text x="725" y="285" font-size="21" text-anchor="middle" class="">T6</text><text x="830" y="285" font-size="21" text-anchor="middle" class="">T7</text><text x="60" y="340" font-size="23" text-anchor="middle" class="">I1</text><rect class="s-node" x="155" y="305" width="95" height="52" rx="12"/><text x="202.5" y="338.0" font-size="22" text-anchor="middle" class="">IF</text><rect class="s-node" x="260" y="305" width="95" height="52" rx="12"/><text x="307.5" y="338.0" font-size="22" text-anchor="middle" class="">ID</text><rect class="s-node" x="365" y="305" width="95" height="52" rx="12"/><text x="412.5" y="338.0" font-size="22" text-anchor="middle" class="">EX</text><rect class="s-node" x="470" y="305" width="95" height="52" rx="12"/><text x="517.5" y="338.0" font-size="22" text-anchor="middle" class="">MEM</text><rect class="s-node" x="575" y="305" width="95" height="52" rx="12"/><text x="622.5" y="338.0" font-size="22" text-anchor="middle" class="">WB</text><text x="60" y="408" font-size="23" text-anchor="middle" class="">I2</text><rect class="s-node" x="260" y="373" width="95" height="52" rx="12"/><text x="307.5" y="406.0" font-size="22" text-anchor="middle" class="">IF</text><rect class="s-node" x="365" y="373" width="95" height="52" rx="12"/><text x="412.5" y="406.0" font-size="22" text-anchor="middle" class="">ID</text><rect class="s-node" x="470" y="373" width="95" height="52" rx="12"/><text x="517.5" y="406.0" font-size="22" text-anchor="middle" class="">EX</text><rect class="s-node" x="575" y="373" width="95" height="52" rx="12"/><text x="622.5" y="406.0" font-size="22" text-anchor="middle" class="">MEM</text><rect class="s-node" x="680" y="373" width="95" height="52" rx="12"/><text x="727.5" y="406.0" font-size="22" text-anchor="middle" class="">WB</text><text x="60" y="476" font-size="23" text-anchor="middle" class="">I3</text><rect class="s-node" x="365" y="441" width="95" height="52" rx="12"/><text x="412.5" y="474.0" font-size="22" text-anchor="middle" class="">IF</text><rect class="s-node" x="470" y="441" width="95" height="52" rx="12"/><text x="517.5" y="474.0" font-size="22" text-anchor="middle" class="">ID</text><rect class="s-node" x="575" y="441" width="95" height="52" rx="12"/><text x="622.5" y="474.0" font-size="22" text-anchor="middle" class="">EX</text><rect class="s-node" x="680" y="441" width="95" height="52" rx="12"/><text x="727.5" y="474.0" font-size="22" text-anchor="middle" class="">MEM</text><rect class="s-node" x="785" y="441" width="95" height="52" rx="12"/><text x="832.5" y="474.0" font-size="22" text-anchor="middle" class="">WB</text><text x="480" y="565" font-size="22" text-anchor="middle" class="s-note">同一拍各指令可处于不同阶段；并非各级都实际访存或写寄存器。</text><text x="480" y="605" font-size="22" text-anchor="middle" class="s-note">load：EX 算地址 → MEM 读数据 → WB 写回；store 通常不写回寄存器。</text></svg>
