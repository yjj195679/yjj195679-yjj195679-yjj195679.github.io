<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 685" role="img" aria-labelledby="ppp-phases-title ppp-phases-desc"><title id="ppp-phases-title">PPP：LCP 建链，NCP 配网络层</title><desc id="ppp-phases-desc">PPP 主流程为静止、建立、可选认证、网络层协议、终止。无需认证可从建立直接到网络层协议阶段。网络层协议阶段先由 NCP 配置，成功后交换相应数据。</desc><style>.s-bg{fill:var(--diagram-bg,#fff)}.s-node{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.s-edge{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.2}.s-guide{stroke:var(--diagram-line,#58677a);stroke-width:1;stroke-dasharray:5 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif",SimSun,serif}.s-note{fill:var(--diagram-muted,#46566b)}.s-head{font-weight:700}</style><defs><marker id="ppp-phases-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="s-bg" width="960" height="685" rx="12"/><text x="35" y="44" font-size="28" text-anchor="start" class="s-head">PPP：LCP 建链，NCP 配网络层</text><rect class="s-node" x="70" y="110" width="330" height="76" rx="12"/><text x="235.0" y="141.5" font-size="22" text-anchor="middle" class="">Dead</text><text x="235.0" y="168.5" font-size="22" text-anchor="middle" class="">链路静止</text><rect class="s-node" x="560" y="110" width="330" height="76" rx="12"/><text x="725.0" y="141.5" font-size="22" text-anchor="middle" class="">Establish</text><text x="725.0" y="168.5" font-size="22" text-anchor="middle" class="">LCP 建立</text><polyline class="s-edge" points="400,148 560,148" marker-end="url(#ppp-phases-arrow)"/><text x="480" y="124" font-size="20" text-anchor="middle" class="">物理层就绪</text><rect class="s-node" x="560" y="300" width="330" height="76" rx="12"/><text x="725.0" y="331.5" font-size="22" text-anchor="middle" class="">Authenticate</text><text x="725.0" y="358.5" font-size="22" text-anchor="middle" class="">可选认证</text><polyline class="s-edge" points="725,186 725,300" marker-end="url(#ppp-phases-arrow)"/><text x="815" y="250" font-size="20" text-anchor="middle" class="">需要认证</text><rect class="s-node" x="70" y="300" width="330" height="76" rx="12"/><text x="235.0" y="331.5" font-size="22" text-anchor="middle" class="">Network</text><text x="235.0" y="358.5" font-size="22" text-anchor="middle" class="">NCP 配置 → 数据交换</text><polyline class="s-edge" points="560,338 400,338" marker-end="url(#ppp-phases-arrow)"/><text x="480" y="314" font-size="20" text-anchor="middle" class="">认证成功</text><polyline class="s-edge" points="560,168 480,168 480,260 235,260 235,300" marker-end="url(#ppp-phases-arrow)" stroke-dasharray="7 6"/><text x="360" y="245" font-size="20" text-anchor="middle" class="">无需认证</text><rect class="s-node" x="70" y="505" width="330" height="76" rx="12"/><text x="235.0" y="536.5" font-size="22" text-anchor="middle" class="">Terminate</text><text x="235.0" y="563.5" font-size="22" text-anchor="middle" class="">链路终止</text><polyline class="s-edge" points="235,376 235,505" marker-end="url(#ppp-phases-arrow)"/><text x="320" y="450" font-size="20" text-anchor="middle" class="">关闭链路</text><polyline class="s-edge" points="70,543 30,543 30,148 70,148" marker-end="url(#ppp-phases-arrow)"/><text x="480" y="645" font-size="22" text-anchor="middle" class="s-note">认证可跳过；任意阶段发生失败或断链可终止，图中只画主路径。</text></svg>
