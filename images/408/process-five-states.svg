<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 695" role="img" aria-labelledby="process-five-states-title process-five-states-desc"><title id="process-five-states-title">进程五状态：箭头由事件决定</title><desc id="process-five-states-desc">新建被接纳后就绪，就绪由调度分派进入运行。运行被抢占回就绪，等待事件进入阻塞，结束进入终止。阻塞事件完成后先回就绪。</desc><style>.s-bg{fill:var(--diagram-bg,#fff)}.s-node{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.s-edge{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.2}.s-guide{stroke:var(--diagram-line,#58677a);stroke-width:1;stroke-dasharray:5 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif",SimSun,serif}.s-note{fill:var(--diagram-muted,#46566b)}.s-head{font-weight:700}</style><defs><marker id="process-five-states-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="s-bg" width="960" height="695" rx="12"/><text x="35" y="44" font-size="28" text-anchor="start" class="s-head">进程五状态：箭头由事件决定</text><rect class="s-node" x="75" y="110" width="250" height="76" rx="12"/><text x="200.0" y="155.0" font-size="22" text-anchor="middle" class="">New 新建</text><rect class="s-node" x="355" y="300" width="250" height="76" rx="12"/><text x="480.0" y="345.0" font-size="22" text-anchor="middle" class="">Ready 就绪</text><rect class="s-node" x="655" y="110" width="250" height="76" rx="12"/><text x="780.0" y="155.0" font-size="22" text-anchor="middle" class="">Running 运行</text><rect class="s-node" x="655" y="490" width="250" height="76" rx="12"/><text x="780.0" y="535.0" font-size="22" text-anchor="middle" class="">Blocked 阻塞</text><rect class="s-node" x="355" y="110" width="250" height="76" rx="12"/><text x="480.0" y="155.0" font-size="22" text-anchor="middle" class="">Terminated 终止</text><polyline class="s-edge" points="200,186 200,338 355,338" marker-end="url(#process-five-states-arrow)"/><text x="260" y="315" font-size="20" text-anchor="middle" class="">接纳</text><polyline class="s-edge" points="605,320 780,320 780,186" marker-end="url(#process-five-states-arrow)"/><text x="690" y="293" font-size="20" text-anchor="middle" class="">调度分派</text><polyline class="s-edge" points="655,153 625,153 625,385 480,385 480,376" marker-end="url(#process-five-states-arrow)"/><text x="530" y="425" font-size="20" text-anchor="middle" class="">抢占/时间片到</text><polyline class="s-edge" points="780,186 925,186 925,528 905,528" marker-end="url(#process-five-states-arrow)"/><text x="845" y="380" font-size="20" text-anchor="middle" class="">等待事件</text><polyline class="s-edge" points="655,528 480,528 480,376" marker-end="url(#process-five-states-arrow)"/><text x="410" y="570" font-size="20" text-anchor="middle" class="">事件完成：先就绪</text><polyline class="s-edge" points="655,140 605,140" marker-end="url(#process-five-states-arrow)"/><text x="630" y="120" font-size="20" text-anchor="middle" class="">结束</text><text x="480" y="650" font-size="22" text-anchor="middle" class="s-note">基本五状态模型：就绪只缺 CPU；阻塞还缺事件，不存在“唤醒即运行”。</text></svg>
