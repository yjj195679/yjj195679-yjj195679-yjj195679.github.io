<svg class="hw-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 775" role="img" aria-labelledby="process-memory-image-title process-memory-image-desc"><title id="process-memory-image-title">进程内存映像：各区域存什么</title><desc id="process-memory-image-desc">高地址在上，代码和静态数据在低处，堆通常向上栈通常向下。PCB是内核控制结构，虚拟连续不代表物理连续。</desc><style>.hw-diagram .hw-bg{fill:var(--diagram-bg,#fff)}.hw-diagram text{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:21px}.hw-diagram .hw-title{font-size:28px;font-weight:bold}.hw-diagram .hw-small{font-size:18px}.hw-diagram .hw-box{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#315d87);stroke-width:2}.hw-diagram .hw-blue{stroke:#387cb5}.hw-diagram .hw-green{stroke:#39846c}.hw-diagram .hw-purple{stroke:#9164ad}.hw-diagram .hw-red{stroke:#c45b64}.hw-diagram .hw-line{fill:none;stroke:var(--diagram-line,#315d87);stroke-width:2.5}.hw-diagram .hw-dash{stroke-dasharray:7 5}</style><defs><marker id="process-memory-image-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--diagram-line,#315d87)"/></marker></defs><rect class="hw-bg" width="960" height="775" rx="12"/><text x="35" y="45" text-anchor="start" class="hw-title">进程内存映像：各区域存什么</text><text x="260" y="100" text-anchor="middle" class="">典型用户虚拟地址空间（示意）</text><text x="85" y="145" text-anchor="middle" class="hw-small">高地址</text><rect x="110" y="160" width="550" height="80" rx="10" class="hw-box hw-purple"/><text x="385.0" y="193.0" text-anchor="middle" class="">栈：调用帧、返回信息、局部数据</text><text x="385.0" y="221.0" text-anchor="middle" class="">典型布局向低地址增长 ↓</text><rect x="110" y="265" width="550" height="65" rx="10" class="hw-box hw-blue"/><text x="385.0" y="290.5" text-anchor="middle" class="">映射区域：共享库 / mmap</text><text x="385.0" y="318.5" text-anchor="middle" class="">布局由操作系统与 ABI 决定</text><rect x="110" y="355" width="550" height="80" rx="10" class="hw-box hw-green"/><text x="385.0" y="388.0" text-anchor="middle" class="">堆：动态分配</text><text x="385.0" y="416.0" text-anchor="middle" class="">典型布局向高地址增长 ↑</text><rect x="110" y="450" width="550" height="60" rx="10" class="hw-box hw-blue"/><text x="385.0" y="487.0" text-anchor="middle" class="">BSS：零初始化 / 未显式初始化静态数据</text><rect x="110" y="520" width="550" height="60" rx="10" class="hw-box hw-blue"/><text x="385.0" y="557.0" text-anchor="middle" class="">data：已初始化静态数据</text><rect x="110" y="590" width="550" height="60" rx="10" class="hw-box hw-blue"/><text x="385.0" y="627.0" text-anchor="middle" class="">text / rodata：指令 / 只读常量</text><text x="75" y="640" text-anchor="middle" class="hw-small">低地址</text><rect x="710" y="180" width="210" height="105" rx="10" class="hw-box hw-red"/><text x="815.0" y="211.5" text-anchor="middle" class="">PCB / 内核栈</text><text x="815.0" y="239.5" text-anchor="middle" class="">由内核管理</text><text x="815.0" y="267.5" text-anchor="middle" class="">不放在用户堆栈中</text><rect x="710" y="365" width="210" height="120" rx="10" class="hw-box hw-blue"/><text x="815.0" y="404.0" text-anchor="middle" class="">虚拟页 → 页表</text><text x="815.0" y="432.0" text-anchor="middle" class="">→ 物理页框</text><text x="815.0" y="460.0" text-anchor="middle" class="">不要求物理连续</text><text x="480" y="700" text-anchor="middle" class="hw-small">示意不代表固定地址；ASLR、线程、平台与实现会改变实际布局。</text><text x="480" y="740" text-anchor="middle" class="hw-small">BSS 通常不在可执行文件中存放等量零字节，装载时建立零初始化区域。</text></svg>