<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 655" role="img" aria-labelledby="process-suspend-states-title process-suspend-states-desc"><title id="process-suspend-states-title">挂起与阻塞：内存位置、等待事件两条轴</title><desc id="process-suspend-states-desc">活动与静止区分是否在内存等管理因素；就绪与阻塞区分是否等待事件。挂起及激活横向切换，事件完成从阻塞向就绪切换。静止阻塞事件完成后是静止就绪。</desc><style>.s-bg{fill:var(--diagram-bg,#fff)}.s-node{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.s-edge{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.2}.s-guide{stroke:var(--diagram-line,#58677a);stroke-width:1;stroke-dasharray:5 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif",SimSun,serif}.s-note{fill:var(--diagram-muted,#46566b)}.s-head{font-weight:700}</style><defs><marker id="process-suspend-states-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="s-bg" width="960" height="655" rx="12"/><text x="35" y="44" font-size="28" text-anchor="start" class="s-head">挂起与阻塞：内存位置、等待事件两条轴</text><text x="250" y="95" font-size="25" text-anchor="middle" class="">活动：通常在内存</text><text x="720" y="95" font-size="25" text-anchor="middle" class="">静止：通常已调出</text><rect class="s-node" x="70" y="150" width="330" height="76" rx="12"/><text x="235.0" y="181.5" font-size="22" text-anchor="middle" class="">活动就绪</text><text x="235.0" y="208.5" font-size="22" text-anchor="middle" class="">Ready</text><rect class="s-node" x="555" y="150" width="330" height="76" rx="12"/><text x="720.0" y="181.5" font-size="22" text-anchor="middle" class="">静止就绪</text><text x="720.0" y="208.5" font-size="22" text-anchor="middle" class="">Ready Suspended</text><rect class="s-node" x="70" y="410" width="330" height="76" rx="12"/><text x="235.0" y="441.5" font-size="22" text-anchor="middle" class="">活动阻塞</text><text x="235.0" y="468.5" font-size="22" text-anchor="middle" class="">Blocked</text><rect class="s-node" x="555" y="410" width="330" height="76" rx="12"/><text x="720.0" y="441.5" font-size="22" text-anchor="middle" class="">静止阻塞</text><text x="720.0" y="468.5" font-size="22" text-anchor="middle" class="">Blocked Suspended</text><polyline class="s-edge" points="400,172 555,172" marker-end="url(#process-suspend-states-arrow)"/><text x="480" y="152" font-size="20" text-anchor="middle" class="">挂起/换出</text><polyline class="s-edge" points="555,210 400,210" marker-end="url(#process-suspend-states-arrow)"/><text x="480" y="250" font-size="20" text-anchor="middle" class="">激活/换入</text><polyline class="s-edge" points="400,432 555,432" marker-end="url(#process-suspend-states-arrow)"/><text x="480" y="412" font-size="20" text-anchor="middle" class="">挂起/换出</text><polyline class="s-edge" points="555,470 400,470" marker-end="url(#process-suspend-states-arrow)"/><text x="480" y="510" font-size="20" text-anchor="middle" class="">激活/换入</text><polyline class="s-edge" points="235,410 235,226" marker-end="url(#process-suspend-states-arrow)"/><text x="320" y="330" font-size="20" text-anchor="middle" class="">事件完成</text><polyline class="s-edge" points="720,410 720,226" marker-end="url(#process-suspend-states-arrow)"/><text x="805" y="330" font-size="20" text-anchor="middle" class="">事件完成</text><text x="480" y="610" font-size="22" text-anchor="middle" class="s-note">静止阻塞的事件完成：变静止就绪；并不自动换入，更不直接运行。</text></svg>
