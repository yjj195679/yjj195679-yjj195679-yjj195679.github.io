<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="producer-consumer-order-title producer-consumer-order-desc"><title id="producer-consumer-order-title">生产者—消费者：先等资源，再进临界区</title><desc id="producer-consumer-order-desc">容量N，empty=N full=0 mutex=1。生产者P(empty) P(mutex)放入 V(mutex) V(full)。消费者P(full) P(mutex)取出 V(mutex) V(empty)。</desc><style>.dg-bg{fill:var(--diagram-bg,#fff)}.dg-box{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.dg-arrow{fill:none;stroke:var(--diagram-line,#356493);stroke-width:2.5}.dg-text{fill:var(--diagram-text,#17212f);font-family:SimSun,serif}.dg-accent{fill:var(--diagram-line,#356493)}</style><defs><marker id="producer-consumer-order-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-accent" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="dg-bg" width="960" height="520" rx="12"/><text class="dg-text" x="480" y="42" text-anchor="middle" font-size="28">生产者—消费者：先等资源，再进临界区</text><text class="dg-text" x="480" y="90" text-anchor="middle" font-size="22">初值：empty=N，full=0，mutex=1</text><rect class="dg-box" x="35" y="135" width="260" height="100" rx="12"/><text class="dg-text" x="165.0" y="178.0" text-anchor="middle" font-size="22">生产者</text><text class="dg-text" x="165.0" y="208.0" text-anchor="middle" font-size="22">P(empty)：等空位</text><rect class="dg-box" x="350" y="135" width="260" height="100" rx="12"/><text class="dg-text" x="480.0" y="178.0" text-anchor="middle" font-size="22">P(mutex) → 放入</text><text class="dg-text" x="480.0" y="208.0" text-anchor="middle" font-size="22">V(mutex)：解锁</text><rect class="dg-box" x="665" y="135" width="260" height="100" rx="12"/><text class="dg-text" x="795.0" y="178.0" text-anchor="middle" font-size="22">V(full)</text><text class="dg-text" x="795.0" y="208.0" text-anchor="middle" font-size="22">增加可取产品</text><path class="dg-arrow" d="M295 185 L345 185" marker-end="url(#producer-consumer-order-arrow)"/><path class="dg-arrow" d="M610 185 L660 185" marker-end="url(#producer-consumer-order-arrow)"/><rect class="dg-box" x="35" y="295" width="260" height="100" rx="12"/><text class="dg-text" x="165.0" y="338.0" text-anchor="middle" font-size="22">消费者</text><text class="dg-text" x="165.0" y="368.0" text-anchor="middle" font-size="22">P(full)：等产品</text><rect class="dg-box" x="350" y="295" width="260" height="100" rx="12"/><text class="dg-text" x="480.0" y="338.0" text-anchor="middle" font-size="22">P(mutex) → 取出</text><text class="dg-text" x="480.0" y="368.0" text-anchor="middle" font-size="22">V(mutex)：解锁</text><rect class="dg-box" x="665" y="295" width="260" height="100" rx="12"/><text class="dg-text" x="795.0" y="338.0" text-anchor="middle" font-size="22">V(empty)</text><text class="dg-text" x="795.0" y="368.0" text-anchor="middle" font-size="22">归还空位</text><path class="dg-arrow" d="M295 345 L345 345" marker-end="url(#producer-consumer-order-arrow)"/><path class="dg-arrow" d="M610 345 L660 345" marker-end="url(#producer-consumer-order-arrow)"/><text class="dg-text" x="480" y="455" text-anchor="middle" font-size="22">不要持有 mutex 再等待 empty/full：可能阻止对方改变资源计数。</text><text class="dg-text" x="480" y="495" text-anchor="middle" font-size="20">缓冲区指针和共享数据的修改在互斥区内完成。</text></svg>
