<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 695" role="img" aria-labelledby="quicksort-stages-title quicksort-stages-desc"><title id="quicksort-stages-title">快排：划分后递归，区间必须缩小</title><desc id="quicksort-stages-desc">区间至少两个元素时先划分，再递归处理两侧子区间。图中边界仅用于返回枢轴最终位置 p 的划分方案；空区间和单元素直接返回。</desc><style>.s-bg{fill:var(--diagram-bg,#fff)}.s-node{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.s-edge{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.2}.s-guide{stroke:var(--diagram-line,#58677a);stroke-width:1;stroke-dasharray:5 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif",SimSun,serif}.s-note{fill:var(--diagram-muted,#46566b)}.s-head{font-weight:700}</style><defs><marker id="quicksort-stages-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="s-bg" width="960" height="695" rx="12"/><text x="35" y="44" font-size="28" text-anchor="start" class="s-head">快排：划分后递归，区间必须缩小</text><rect class="s-node" x="195" y="110" width="570" height="76" rx="12"/><text x="480.0" y="155.0" font-size="22" text-anchor="middle" class="">处理区间 [low, high]</text><rect class="s-node" x="195" y="270" width="570" height="76" rx="12"/><text x="480.0" y="301.5" font-size="22" text-anchor="middle" class="">Partition：划分区间</text><text x="480.0" y="328.5" font-size="22" text-anchor="middle" class="">仅建立分区关系，不保证两侧内部有序</text><polyline class="s-edge" points="480,186 480,270" marker-end="url(#quicksort-stages-arrow)"/><text x="575" y="233" font-size="20" text-anchor="middle" class="">low &lt; high</text><rect class="s-node" x="40" y="465" width="400" height="76" rx="12"/><text x="240.0" y="496.5" font-size="22" text-anchor="middle" class="">递归左区间</text><text x="240.0" y="523.5" font-size="22" text-anchor="middle" class="">若 p 为最终枢轴位：[low,p−1]</text><rect class="s-node" x="520" y="465" width="400" height="76" rx="12"/><text x="720.0" y="496.5" font-size="22" text-anchor="middle" class="">递归右区间</text><text x="720.0" y="523.5" font-size="22" text-anchor="middle" class="">若 p 为最终枢轴位：[p+1,high]</text><polyline class="s-edge" points="480,346 480,400 240,400 240,465" marker-end="url(#quicksort-stages-arrow)"/><polyline class="s-edge" points="480,400 720,400 720,465" marker-end="url(#quicksort-stages-arrow)"/><text x="480" y="600" font-size="23" text-anchor="middle" class="">low ≥ high：空区间或单元素，直接返回</text><text x="480" y="650" font-size="22" text-anchor="middle" class="s-note">递归边界由划分返回值的语义决定；Hoare 分界方案不能机械套用。</text></svg>
