<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 635" role="img" aria-labelledby="resource-safety-states-title resource-safety-states-desc"><title id="resource-safety-states-title">资源安全：死锁是不安全状态的子集</title><desc id="resource-safety-states-desc">所有状态划分为安全与不安全。安全存在安全序列；死锁属于不安全，但不安全并不一定已经死锁。此处是系统资源分配状态，不是进程五状态。</desc><style>.s-bg{fill:var(--diagram-bg,#fff)}.s-node{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.s-edge{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.2}.s-guide{stroke:var(--diagram-line,#58677a);stroke-width:1;stroke-dasharray:5 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif",SimSun,serif}.s-note{fill:var(--diagram-muted,#46566b)}.s-head{font-weight:700}</style><defs><marker id="resource-safety-states-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="s-bg" width="960" height="635" rx="12"/><text x="35" y="44" font-size="28" text-anchor="start" class="s-head">资源安全：死锁是不安全状态的子集</text><rect class="s-node" x="60" y="125" width="840" height="395" rx="20"/><text x="480" y="170" font-size="26" text-anchor="middle" class="">所有资源分配状态</text><rect class="s-node" x="470" y="220" width="390" height="260" rx="18"/><text x="665" y="260" font-size="26" text-anchor="middle" class="">不安全状态</text><rect class="s-node" x="560" y="325" width="250" height="110" rx="16"/><text x="685" y="370" font-size="26" text-anchor="middle" class="">死锁状态</text><text x="685" y="405" font-size="22" text-anchor="middle" class="">已发生僵局</text><text x="255" y="285" font-size="26" text-anchor="middle" class="">安全状态</text><text x="255" y="325" font-size="23" text-anchor="middle" class="">存在安全序列</text><text x="665" y="295" font-size="21" text-anchor="middle" class="">无法保证安全完成</text><text x="480" y="590" font-size="22" text-anchor="middle" class="s-note">银行家算法适用模型：死锁 ⇒ 不安全；不安全 ⇏ 已死锁。</text></svg>
