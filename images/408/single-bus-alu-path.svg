<svg class="hw-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="single-bus-alu-path-title single-bus-alu-path-desc"><title id="single-bus-alu-path-title">单总线数据通路：为什么需要 Y 和 Z</title><desc id="single-bus-alu-path-desc">Y暂存第一个操作数，第二个从总线进入ALU，Z锁存结果后再驱动总线。</desc><style>.hw-diagram .hw-bg{fill:var(--diagram-bg,#fff)}.hw-diagram text{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:21px}.hw-diagram .hw-title{font-size:28px;font-weight:bold}.hw-diagram .hw-small{font-size:18px}.hw-diagram .hw-box{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#315d87);stroke-width:2}.hw-diagram .hw-blue{stroke:#387cb5}.hw-diagram .hw-green{stroke:#39846c}.hw-diagram .hw-purple{stroke:#9164ad}.hw-diagram .hw-red{stroke:#c45b64}.hw-diagram .hw-line{fill:none;stroke:var(--diagram-line,#315d87);stroke-width:2.5}.hw-diagram .hw-dash{stroke-dasharray:7 5}</style><defs><marker id="single-bus-alu-path-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--diagram-line,#315d87)"/></marker></defs><rect class="hw-bg" width="960" height="570" rx="12"/><text x="35" y="45" text-anchor="start" class="hw-title">单总线数据通路：为什么需要 Y 和 Z</text><rect x="50" y="115" width="180" height="70" rx="10" class="hw-box hw-blue"/><text x="140.0" y="157.0" text-anchor="middle" class="">R1 / R2 / R3</text><rect x="335" y="115" width="170" height="70" rx="10" class="hw-box hw-green"/><text x="420.0" y="157.0" text-anchor="middle" class="">Y 暂存器</text><rect x="655" y="115" width="200" height="70" rx="10" class="hw-box hw-purple"/><text x="755.0" y="157.0" text-anchor="middle" class="">Z 暂存器</text><rect x="365" y="310" width="210" height="85" rx="10" class="hw-box hw-blue"/><text x="470.0" y="345.5" text-anchor="middle" class="">ALU</text><text x="470.0" y="373.5" text-anchor="middle" class="">Y + 总线输入</text><polyline points="140,185 140,245" class="hw-line" marker-end="url(#single-bus-alu-path-arrow)"/><polyline points="140,245 335,245 335,150" class="hw-line" marker-end="url(#single-bus-alu-path-arrow)"/><polyline points="420,185 420,310" class="hw-line" marker-end="url(#single-bus-alu-path-arrow)"/><polyline points="250,245 560,245 560,310" class="hw-line" marker-end="url(#single-bus-alu-path-arrow)"/><polyline points="575,350 755,350 755,185" class="hw-line" marker-end="url(#single-bus-alu-path-arrow)"/><polyline points="855,150 915,150 915,245 520,245" class="hw-line" marker-end="url(#single-bus-alu-path-arrow)"/><text x="720" y="275" text-anchor="middle" class="hw-small">Zout 回总线</text><text x="205" y="277" text-anchor="middle" class="hw-small">共享总线</text><text x="480" y="435" text-anchor="middle" class="">① R1out，Yin：第一个操作数先存入 Y</text><text x="480" y="480" text-anchor="middle" class="">② R2out，ADD，Zin：相加并把结果存入 Z</text><text x="480" y="525" text-anchor="middle" class="">③ Zout，R3in：结果经总线写回 R3</text></svg>