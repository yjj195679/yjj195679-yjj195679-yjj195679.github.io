<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="systems-bottom-up-heap-title systems-bottom-up-heap-desc"><title id="systems-bottom-up-heap-title">线性建堆：为何从最后一个非叶结点往前调整</title><desc id="systems-bottom-up-heap-desc">0起数组，从最后非叶结点floor(n/2)−1=2倒序处理，先保证孩子子树是堆，再修复父结点。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="systems-bottom-up-heap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">线性建堆：为何从最后一个非叶结点往前调整</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#systems-bottom-up-heap-arrow)" d="M366.0,69.16666666666667 L258.0,133.45238095238096"/><path class="ve" marker-end="url(#systems-bottom-up-heap-arrow)" d="M464.0,69.16666666666667 L572.0,133.45238095238096"/><path class="ve" marker-end="url(#systems-bottom-up-heap-arrow)" d="M178.28571428571428,199.0 L124.85714285714286,267.0"/><path class="ve" marker-end="url(#systems-bottom-up-heap-arrow)" d="M231.71428571428572,199.0 L285.14285714285717,267.0"/><path class="ve" marker-end="url(#systems-bottom-up-heap-arrow)" d="M608.0,199.0 L574.0,267.0"/><g class="active"><rect class="vb" x="370" y="10" width="90" height="60" rx="10"/><text 