<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="systems-complete-index-title systems-complete-index-desc"><title id="systems-complete-index-title">完全二叉树编号：双亲、孩子与叶子区间</title><desc id="systems-complete-index-desc">总数n=7，叶子编号floor(n/2)+1～n，即4～7；前3个结点是分支结点。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="systems-complete-index-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">完全二叉树编号：双亲、孩子与叶子区间</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#systems-complete-index-arrow)" d="M274.0,135.83333333333334 L382.0,71.54761904761905"/><path class="ve" marker-end="url(#systems-complete-index-arrow)" d="M596.0,135.83333333333334 L488.0,71.54761904761905"/><path class="ve" marker-end="url(#systems-complete-index-arrow)" d="M138.96296296296296,266.0 L192.62962962962962,203.0"/><path class="ve" marker-end="url(#systems-complete-index-arrow)" d="M303.55555555555554,266.0 L254.55555555555554,203.0"/><path class="ve" marker-end="url(#systems-complete-index-arrow)" d="M573.9259259259259,266.0 L618.2592592592592,203.0"/><path class="ve" marker-end="url(#systems-complete-index-arrow)" d="M738.5185185185185,266.0 L680.1851851851852,203.0"/><g class="base"><rect class="vb" x="390" y="10" width="90" height="60" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="435.0" y="47.0">1</text></g><g class="base"><rect class="vb" x="180" y="135" width="90" height="60" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="225.0" y="172.0">2</text></g><g class="base"><rect class="vb" x="600" y="135" width="90" height="60" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="645.0" y="172.0">3</text></g><g class="active"><rect class="vb" x="65" y="270" width="90" height="60" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="110.0" y="307.0">4</text></g><g class="active"><rect class="vb" x="285" y="270" width="90" height="60" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="330.0" y="307.0">5</text></g><g class="active"><rect class="vb" x="505" y="270" width="90" height="60" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="550.0" y="307.0">6</text></g><g class="active"><rect class="vb" x="725" y="270" width="90" height="60" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="770.0" y="307.0">7</text></g></g></svg>