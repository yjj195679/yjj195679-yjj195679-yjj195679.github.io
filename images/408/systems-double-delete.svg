<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="systems-double-delete-title systems-double-delete-desc"><title id="systems-double-delete-title">双链表删除：两条链接都必须绕过p</title><desc id="systems-double-delete-desc">执行p.next.prev=p.prev，即B.prev=A；两个方向都已绕过p，随后才能安全释放结点p。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="systems-double-delete-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">双链表删除：两条链接都必须绕过p</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#systems-double-delete-arrow)" d="M204.0,131.0 L642.0,131.0"/><g class="base"><rect class="vb" x="50" y="100" width="150" height="62" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="125.0" y="138.0">A</text></g><g class="base"><rect class="vb" x="650" y="100" width="150" height="62" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="725.0" y="138.0">B</text></g><g class="base"><rect class="vb" x="160" y="330" width="580" height="70" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="450.0" y="359.0">正向：next；反向：prev</text><text class="vt" font-size="19" text-anchor="middle" x="450.0" y="385.0">空指针与哨兵边界按具体实现单独处理</text></g></g></svg>