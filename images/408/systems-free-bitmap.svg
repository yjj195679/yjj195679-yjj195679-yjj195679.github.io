<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="systems-free-bitmap-title systems-free-bitmap-desc"><title id="systems-free-bitmap-title">空闲块位图：分配与释放到底修改哪几位</title><desc id="systems-free-bitmap-desc">把块4的分配位清为0，返回空闲集合。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="systems-free-bitmap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">空闲块位图：分配与释放到底修改哪几位</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="40.0" y="100" width="90.75" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="85.375" y="147.0">0:1</text></g><g class="base"><rect class="vb" x="138.75" y="100" width="90.75" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="184.125" y="147.0">1:1</text></g><g class="base"><rect class="vb" x="237.5" y="100" width="90.75" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="282.875" y="147.0">2:1</text></g><g class="base"><rect class="vb" x="336.25" y="100" width="90.75" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="381.625" y="147.0">3:0</text></g><g class="active"><rect class="vb" x="435.0" y="100" width="90.75" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="480.375" y="147.0">4:0</text></g><g class="base"><rect class="vb" x="533.75" y="100" width="90.75" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="579.125" y="147.0">5:1</text></g><g class="base"><rect class="vb" x="632.5" y="100" width="90.75" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="677.875" y="147.0">6:0</text></g><g class="base"><rect class="vb" x="731.25" y="100" width="90.75" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="776.625" y="147.0">7:1</text></g></g></svg>