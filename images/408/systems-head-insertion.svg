<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="systems-head-insertion-title systems-head-insertion-desc"><title id="systems-head-insertion-title">头插建表：为什么输入顺序会反过来</title><desc id="systems-head-insertion-desc">执行head.next=S，得到S→A→B。对输入1,2,3连续头插时，最终数据次序会是3,2,1。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="systems-head-insertion-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">头插建表：为什么输入顺序会反过来</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#systems-head-insertion-arrow)" d="M154.0,131.0 L232.0,131.0"/><path class="ve" marker-end="url(#systems-head-insertion-arrow)" d="M374.0,131.0 L452.0,131.0"/><path class="ve" marker-end="url(#systems-head-insertion-arrow)" d="M594.0,131.0 L672.0,131.0"/><g class="base"><rect class="vb" x="20" y="100" width="130" height="62" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="85.0" y="138.0">头结点</text></g><g class="active"><rect class="vb" x="240" y="100" width="130" height="62" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="305.0" y="138.0">S</text></g><g class="base"><rect class="vb" x="460" y="100" width="130" height="62" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="525.0" y="138.0">A</text></g><g class="base"><rect class="vb" x="680" y="100" width="130" height="62" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="745.0" y="138.0">B</text></g></g></svg>