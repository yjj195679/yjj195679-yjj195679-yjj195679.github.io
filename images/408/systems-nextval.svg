<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="systems-nextval-title systems-nextval-desc"><title id="systems-nextval-title">nextval逐项推导：相同字符为什么要继续跳</title><desc id="systems-nextval-desc">P[8]=c与P[2]=b不同，保留普通next值2。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="systems-nextval-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">nextval逐项推导：相同字符为什么要继续跳</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="40.0" y="35" width="90.75" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="85.375" y="82.0">1:a</text></g><g class="base"><rect class="vb" x="138.75" y="35" width="90.75" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="184.125" y="82.0">2:b</text></g><g class="base"><rect class="vb" x="237.5" y="35" width="90.75" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="282.875" y="82.0">3:a</text></g><g class="base"><rect class="vb" x="336.25" y="35" width="90.75" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="381.625" y="82.0">4:a</text></g><g class="base"><rect class="vb" x="435.0" y="35" width="90.75" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="480.375" y="82.0">5:b</text></g><g class="base"><rect class="vb" x="533.75" y="35" width="90.75" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="579.125" y="82.0">6:c</text></g><g class="base"><rect class="vb" x="632.5" y="35" width="90.75" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="677.875" y="82.0">7:a</text></g><g class="active"><rect class="vb" x="731.25" y="35" width="90.75" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="776.625" y="82.0">8:c</text></g><g class="base"><rect class="vb" x="60" y="200" width="780" height="70" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="450.0" y="242.0">普通next：0,1,1,2,2,3,1,2</text></g><g class="active"><rect class="vb" x="60" y="310" width="780" height="70" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="450.0" y="352.0">已算nextval：0,1,0,2,1,3,0,2</text></g></g></svg>