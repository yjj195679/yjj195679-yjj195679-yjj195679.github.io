<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="systems-path-walk-title systems-path-walk-desc"><title id="systems-path-walk-title">路径解析：每一级目录究竟帮忙查了什么</title><desc id="systems-path-walk-desc">目录项a.txt给出相应文件对象标识，再依据inode等元数据定位文件数据。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="systems-path-walk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">路径解析：每一级目录究竟帮忙查了什么</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#systems-path-walk-arrow)" d="M445.0,84.0 L445.0,137.0"/><path class="ve" marker-end="url(#systems-path-walk-arrow)" d="M445.0,219.0 L445.0,272.0"/><path class="ve" marker-end="url(#systems-path-walk-arrow)" d="M544.0,315.0 L642.0,315.0"/><g class="base"><rect class="vb" x="350" y="10" width="190" height="70" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="445.0" y="52.0">根目录 /</text></g><g class="base"><rect class="vb" x="350" y="145" width="190" height="70" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="445.0" y="187.0">目录home</text></g><g class="base"><rect class="vb" x="350" y="280" width="190" height="70" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="445.0" y="322.0">目录u</text></g><g class="active"><rect class="vb" x="650" y="280" width="200" height="70" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="750.0" y="322.0">文件a.txt</text></g></g></svg>