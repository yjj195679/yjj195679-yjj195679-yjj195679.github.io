<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="systems-shell-gaps-title systems-shell-gaps-desc"><title id="systems-shell-gaps-title">希尔排序：增量4、2、1怎样改变数组</title><desc id="systems-shell-gaps-desc">本趟结果：1,3,4,5,6,7,8,9。当gap&gt;1时，跨组元素仍可能整体无序。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="systems-shell-gaps-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">希尔排序：增量4、2、1怎样改变数组</text><g transform="translate(0 55)"><g class="active"><rect class="vb" x="40.0" y="100" width="90.75" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="85.375" y="147.0">1</text></g><g class="active"><rect class="vb" x="138.75" y="100" width="90.75" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="184.125" y="147.0">3</text></g><g class="active"><rect class="vb" x="237.5" y="100" width="90.75" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="282.875" y="147.0">4</text></g><g class="active"><rect class="vb" x="336.25" y="100" width="90.75" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="381.625" y="147.0">5</text></g><g class="active"><rect class="vb" x="435.0" y="100" width="90.75" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="480.375" y="147.0">6</text></g><g class="active"><rect class="vb" x="533.75" y="100" width="90.75" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="579.125" y="147.0">7</text></g><g class="active"><rect class="vb" x="632.5" y="100" width="90.75" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="677.875" y="147.0">8</text></g><g class="active"><rect class="vb" x="731.25" y="100" width="90.75" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="776.625" y="147.0">9</text></g></g></svg>