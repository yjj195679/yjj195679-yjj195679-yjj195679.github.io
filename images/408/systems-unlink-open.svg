<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="systems-unlink-open-title systems-unlink-open-desc"><title id="systems-unlink-open-title">删除文件名后：为什么已打开的进程还能读</title><desc id="systems-unlink-open-desc">回收时点和实现可能受延迟分配、缓存等影响；判断题的关键是同时区分链接计数与打开引用。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4}.done .vb{stroke:var(--hand-memory,#237352);stroke-width:3}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}.rb-red .vb{stroke:var(--hand-key,#ac2537)}.rb-red .vt{fill:var(--hand-key,#ac2537)}.rb-black .vb{stroke:var(--diagram-text,#17212f);stroke-width:3}</style><defs><marker id="systems-unlink-open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" font-size="24" text-anchor="middle" x="450" y="35">删除文件名后：为什么已打开的进程还能读</text><g transform="translate(0 55)"><g class="active"><rect class="vb" x="40" y="100" width="252" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="166.0" y="147.0">无目录链接也无打开引用</text></g><g class="active"><rect class="vb" x="300" y="100" width="252" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="426.0" y="147.0">系统可回收inode与数据块</text></g><g class="base"><rect class="vb" x="560" y="100" width="252" height="80" rx="10"/><text class="vt" font-size="19" text-anchor="middle" x="686.0" y="147.0">释放条件终于满足</text></g></g></svg>