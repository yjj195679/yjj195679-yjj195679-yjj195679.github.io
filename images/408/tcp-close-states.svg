<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1015" role="img" aria-labelledby="tcp-close-states-title tcp-close-states-desc"><title id="tcp-close-states-title">TCP 释放：谁在等 ACK，谁在等 FIN？</title><desc id="tcp-close-states-desc">A 先发 FIN 进入 FIN-WAIT-1，收到其确认后进入 FIN-WAIT-2。B 收到 FIN 进入 CLOSE-WAIT，本地关闭后发送 FIN 进入 LAST-ACK。A 收到 B 的 FIN 并确认，进入 TIME-WAIT，等待 2MSL 后关闭；B 收到最后 ACK 即关闭。</desc><style>.s-bg{fill:var(--diagram-bg,#fff)}.s-node{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.s-edge{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.2}.s-guide{stroke:var(--diagram-line,#58677a);stroke-width:1;stroke-dasharray:5 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif",SimSun,serif}.s-note{fill:var(--diagram-muted,#46566b)}.s-head{font-weight:700}</style><defs><marker id="tcp-close-states-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="s-bg" width="960" height="1015" rx="12"/><text x="35" y="44" font-size="28" text-anchor="start" class="s-head">TCP 释放：谁在等 ACK，谁在等 FIN？</text><text x="235" y="90" font-size="26" text-anchor="middle" class="">主动关闭方 A</text><text x="725" y="90" font-size="26" text-anchor="middle" class="">被动关闭方 B</text><line class="s-guide" x1="235" y1="112" x2="235" y2="865"/><line class="s-guide" x1="725" y1="112" x2="725" y2="865"/><rect class="s-node" x="115" y="110" width="240" height="76" rx="12"/><text x="235.0" y="155.0" font-size="22" text-anchor="middle" class="">ESTABLISHED</text><rect class="s-node" x="605" y="110" width="240" height="76" rx="12"/><text x="725.0" y="155.0" font-size="22" text-anchor="middle" class="">ESTABLISHED</text><rect class="s-node" x="115" y="210" width="240" height="76" rx="12"/><text x="235.0" y="255.0" font-size="22" text-anchor="middle" class="">FIN-WAIT-1</text><polyline class="s-edge" points="355,235 605,285" marker-end="url(#tcp-close-states-arrow)"/><text x="480" y="236" font-size="20" text-anchor="middle" class="">1. FIN</text><rect class="s-node" x="605" y="295" width="240" height="76" rx="12"/><text x="725.0" y="340.0" font-size="22" text-anchor="middle" class="">CLOSE-WAIT</text><polyline class="s-edge" points="605,395 355,445" marker-end="url(#tcp-close-states-arrow)"/><text x="480" y="397" font-size="20" text-anchor="middle" class="">2. ACK</text><rect class="s-node" x="115" y="455" width="240" height="76" rx="12"/><text x="235.0" y="500.0" font-size="22" text-anchor="middle" class="">FIN-WAIT-2</text><text x="725" y="432" font-size="20" text-anchor="middle" class="">等待本地应用关闭</text><text x="725" y="460" font-size="20" text-anchor="middle" class="">仍可发剩余数据</text><rect class="s-node" x="605" y="535" width="240" height="76" rx="12"/><text x="725.0" y="580.0" font-size="22" text-anchor="middle" class="">LAST-ACK</text><polyline class="s-edge" points="605,565 355,615" marker-end="url(#tcp-close-states-arrow)"/><text x="480" y="565" font-size="20" text-anchor="middle" class="">3. FIN</text><rect class="s-node" x="115" y="625" width="240" height="76" rx="12"/><text x="235.0" y="670.0" font-size="22" text-anchor="middle" class="">TIME-WAIT</text><polyline class="s-edge" points="355,725 605,775" marker-end="url(#tcp-close-states-arrow)"/><text x="480" y="726" font-size="20" text-anchor="middle" class="">4. ACK</text><rect class="s-node" x="605" y="785" width="240" height="76" rx="12"/><text x="725.0" y="830.0" font-size="22" text-anchor="middle" class="">CLOSED</text><polyline class="s-edge" points="235,701 235,850" marker-end="url(#tcp-close-states-arrow)"/><rect class="s-node" x="115" y="855" width="240" height="76" rx="12"/><text x="235.0" y="900.0" font-size="22" text-anchor="middle" class="">CLOSED</text><text x="100" y="805" font-size="20" text-anchor="middle" class="">等 2MSL</text><text x="480" y="980" font-size="22" text-anchor="middle" class="s-note">典型四报文过程；ACK 与 FIN 可合并，特殊分支见下一图。</text></svg>
