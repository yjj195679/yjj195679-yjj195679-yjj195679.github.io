<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 595" role="img" aria-labelledby="tcp-congestion-stages-title tcp-congestion-stages-desc"><title id="tcp-congestion-stages-title">拥塞控制：增长阶段与丢包处理</title><desc id="tcp-congestion-stages-desc">慢开始通常呈每 RTT 指数增长，接近门限转拥塞避免的线性增长。三次重复 ACK 触发快重传，经典 Reno 配合快恢复后恢复拥塞避免；重传超时通常重新慢开始。</desc><style>.s-bg{fill:var(--diagram-bg,#fff)}.s-node{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.s-edge{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.2}.s-guide{stroke:var(--diagram-line,#58677a);stroke-width:1;stroke-dasharray:5 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif",SimSun,serif}.s-note{fill:var(--diagram-muted,#46566b)}.s-head{font-weight:700}</style><defs><marker id="tcp-congestion-stages-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="s-bg" width="960" height="595" rx="12"/><text x="35" y="44" font-size="28" text-anchor="start" class="s-head">拥塞控制：增长阶段与丢包处理</text><rect class="s-node" x="70" y="115" width="330" height="76" rx="12"/><text x="235.0" y="146.5" font-size="22" text-anchor="middle" class="">慢开始</text><text x="235.0" y="173.5" font-size="22" text-anchor="middle" class="">Slow Start</text><rect class="s-node" x="560" y="115" width="330" height="76" rx="12"/><text x="725.0" y="146.5" font-size="22" text-anchor="middle" class="">拥塞避免</text><text x="725.0" y="173.5" font-size="22" text-anchor="middle" class="">Congestion Avoidance</text><polyline class="s-edge" points="400,153 560,153" marker-end="url(#tcp-congestion-stages-arrow)"/><text x="480" y="128" font-size="20" text-anchor="middle" class="">达到门限附近</text><text x="235" y="230" font-size="22" text-anchor="middle" class="">理想：每 RTT 约翻倍</text><text x="725" y="230" font-size="22" text-anchor="middle" class="">理想：每 RTT 约加 1 MSS</text><rect class="s-node" x="70" y="325" width="330" height="76" rx="12"/><text x="235.0" y="356.5" font-size="22" text-anchor="middle" class="">三次重复 ACK</text><text x="235.0" y="383.5" font-size="22" text-anchor="middle" class="">快重传缺失段</text><rect class="s-node" x="560" y="325" width="330" height="76" rx="12"/><text x="725.0" y="356.5" font-size="22" text-anchor="middle" class="">快恢复</text><text x="725.0" y="383.5" font-size="22" text-anchor="middle" class="">Fast Recovery</text><polyline class="s-edge" points="400,363 560,363" marker-end="url(#tcp-congestion-stages-arrow)"/><text x="480" y="340" font-size="20" text-anchor="middle" class="">经典 Reno</text><polyline class="s-edge" points="890,363 925,363 925,153 890,153" marker-end="url(#tcp-congestion-stages-arrow)" stroke-dasharray="7 6"/><text x="775" y="280" font-size="20" text-anchor="middle" class="">按算法恢复</text><text x="480" y="550" font-size="22" text-anchor="middle" class="s-note">重传超时：经典模型重新慢开始；窗口数值与门限规则以题设为准。</text></svg>
