<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 755" role="img" aria-labelledby="tcp-open-states-title tcp-open-states-desc"><title id="tcp-open-states-title">TCP 建立：分别观察两端状态</title><desc id="tcp-open-states-desc">典型主动/被动打开，时间向下。A 发送 SYN 后为 SYN-SENT；B 收到后为 SYN-RCVD。A 处理 SYN+ACK 并发送 ACK 时为 ESTABLISHED；B 收到该 ACK 后才为 ESTABLISHED。</desc><style>.s-bg{fill:var(--diagram-bg,#fff)}.s-node{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.s-edge{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.2}.s-guide{stroke:var(--diagram-line,#58677a);stroke-width:1;stroke-dasharray:5 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif",SimSun,serif}.s-note{fill:var(--diagram-muted,#46566b)}.s-head{font-weight:700}</style><defs><marker id="tcp-open-states-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="s-bg" width="960" height="755" rx="12"/><text x="35" y="44" font-size="28" text-anchor="start" class="s-head">TCP 建立：分别观察两端状态</text><text x="235" y="90" font-size="26" text-anchor="middle" class="">主动打开方 A</text><text x="725" y="90" font-size="26" text-anchor="middle" class="">被动打开方 B</text><line class="s-guide" x1="235" y1="115" x2="235" y2="635"/><line class="s-guide" x1="725" y1="115" x2="725" y2="635"/><rect class="s-node" x="115" y="115" width="240" height="76" rx="12"/><text x="235.0" y="160.0" font-size="22" text-anchor="middle" class="">CLOSED</text><rect class="s-node" x="605" y="115" width="240" height="76" rx="12"/><text x="725.0" y="160.0" font-size="22" text-anchor="middle" class="">LISTEN</text><polyline class="s-edge" points="355,215 605,270" marker-end="url(#tcp-open-states-arrow)"/><text x="480" y="220" font-size="20" text-anchor="middle" class="">1. SYN</text><rect class="s-node" x="115" y="195" width="240" height="76" rx="12"/><text x="235.0" y="240.0" font-size="22" text-anchor="middle" class="">SYN-SENT</text><rect class="s-node" x="605" y="275" width="240" height="76" rx="12"/><text x="725.0" y="320.0" font-size="22" text-anchor="middle" class="">SYN-RCVD</text><polyline class="s-edge" points="605,375 355,430" marker-end="url(#tcp-open-states-arrow)"/><text x="480" y="375" font-size="20" text-anchor="middle" class="">2. SYN + ACK</text><rect class="s-node" x="115" y="435" width="240" height="76" rx="12"/><text x="235.0" y="480.0" font-size="22" text-anchor="middle" class="">ESTABLISHED</text><polyline class="s-edge" points="355,535 605,590" marker-end="url(#tcp-open-states-arrow)"/><text x="480" y="535" font-size="20" text-anchor="middle" class="">3. ACK（可带数据）</text><rect class="s-node" x="605" y="595" width="240" height="76" rx="12"/><text x="725.0" y="640.0" font-size="22" text-anchor="middle" class="">ESTABLISHED</text><text x="725" y="445" font-size="20" text-anchor="middle" class="">第三次 ACK 未到达时</text><text x="725" y="474" font-size="20" text-anchor="middle" class="">仍是 SYN-RCVD</text><text x="480" y="718" font-size="22" text-anchor="middle" class="s-note">时间向下：A 发出第三次 ACK 时已建立；B 收到有效 ACK 后才建立。</text></svg>
