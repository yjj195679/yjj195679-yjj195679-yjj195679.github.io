<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="tcp-send-credit-example-title tcp-send-credit-example-desc"><title id="tcp-send-credit-example-title">TCP 发送额度：窗口上限减去在途数据</title><desc id="tcp-send-credit-example-desc">SND.UNA=1000，SND.NXT=1600，cwnd1200，rwnd1800，无回绕。有效窗口1200，在途600，还能发600字节。</desc><style>.dg-bg{fill:var(--diagram-bg,#fff)}.dg-box{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.dg-arrow{fill:none;stroke:var(--diagram-line,#356493);stroke-width:2.5}.dg-text{fill:var(--diagram-text,#17212f);font-family:SimSun,serif}.dg-accent{fill:var(--diagram-line,#356493)}</style><defs><marker id="tcp-send-credit-example-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-accent" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="dg-bg" width="960" height="540" rx="12"/><text class="dg-text" x="480" y="42" text-anchor="middle" font-size="28">TCP 发送额度：窗口上限减去在途数据</text><text class="dg-text" x="480" y="92" text-anchor="middle" font-size="22">cwnd=1200 B，rwnd=1800 B；有效窗口 min=1200 B</text><rect class="dg-box" x="60" y="155" width="260" height="95" rx="12"/><text class="dg-text" x="190.0" y="195.5" text-anchor="middle" font-size="22">已确认区域</text><text class="dg-text" x="190.0" y="225.5" text-anchor="middle" font-size="22">序号 &lt; 1000</text><rect class="dg-box" x="320" y="155" width="280" height="95" rx="12"/><text class="dg-text" x="460.0" y="195.5" text-anchor="middle" font-size="22">已发未确认：600 B</text><text class="dg-text" x="460.0" y="225.5" text-anchor="middle" font-size="22">[1000,1600)</text><rect class="dg-box" x="600" y="155" width="300" height="95" rx="12"/><text class="dg-text" x="750.0" y="195.5" text-anchor="middle" font-size="22">尚可发送：600 B</text><text class="dg-text" x="750.0" y="225.5" text-anchor="middle" font-size="22">[1600,2200)</text><text class="dg-text" x="320" y="295" text-anchor="middle" font-size="21">SND.UNA = 1000</text><text class="dg-text" x="610" y="330" text-anchor="middle" font-size="21">SND.NXT = 1600</text><rect class="dg-box" x="80" y="385" width="800" height="75" rx="12"/><text class="dg-text" x="480.0" y="430.5" text-anchor="middle" font-size="22">可发送量 = max(0, min(cwnd,rwnd) − 在途数据) = 600 B</text><text class="dg-text" x="480" y="510" text-anchor="middle" font-size="20">示例忽略序号回绕；不能把窗口上限直接当作本次还能发送的数量。</text></svg>
