<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="tcp-special-states-title tcp-special-states-desc"><title id="tcp-special-states-title">TCP 特殊分支：CLOSING 与同时打开</title><desc id="tcp-special-states-desc">FIN-WAIT-1 收到未确认本端 FIN 的对端 FIN，进入 CLOSING；随后本端 FIN 获确认进入 TIME-WAIT。若 FIN 与本端 FIN 的确认一起到达，可直接进入 TIME-WAIT。同时打开可从 SYN-SENT 到 SYN-RECEIVED。</desc><style>.s-bg{fill:var(--diagram-bg,#fff)}.s-node{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.s-edge{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.2}.s-guide{stroke:var(--diagram-line,#58677a);stroke-width:1;stroke-dasharray:5 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif",SimSun,serif}.s-note{fill:var(--diagram-muted,#46566b)}.s-head{font-weight:700}</style><defs><marker id="tcp-special-states-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="s-bg" width="960" height="680" rx="12"/><text x="35" y="44" font-size="28" text-anchor="start" class="s-head">TCP 特殊分支：CLOSING 与同时打开</text><rect class="s-node" x="330" y="100" width="300" height="76" rx="12"/><text x="480.0" y="145.0" font-size="22" text-anchor="middle" class="">FIN-WAIT-1</text><rect class="s-node" x="35" y="300" width="330" height="76" rx="12"/><text x="200.0" y="345.0" font-size="22" text-anchor="middle" class="">CLOSING</text><rect class="s-node" x="595" y="300" width="330" height="76" rx="12"/><text x="760.0" y="345.0" font-size="22" text-anchor="middle" class="">TIME-WAIT</text><polyline class="s-edge" points="330,150 200,150 200,300" marker-end="url(#tcp-special-states-arrow)"/><text x="180" y="210" font-size="20" text-anchor="middle" class="">收到对端 FIN</text><text x="180" y="240" font-size="20" text-anchor="middle" class="">本端 FIN 未获确认</text><polyline class="s-edge" points="630,150 760,150 760,300" marker-end="url(#tcp-special-states-arrow)"/><text x="775" y="210" font-size="20" text-anchor="middle" class="">收到 FIN，且 ACK</text><text x="775" y="240" font-size="20" text-anchor="middle" class="">同时确认本端 FIN</text><polyline class="s-edge" points="365,338 595,338" marker-end="url(#tcp-special-states-arrow)"/><text x="480" y="317" font-size="20" text-anchor="middle" class="">本端 FIN 获确认</text><text x="480" y="452" font-size="22" text-anchor="middle" class="s-note">同时关闭：双方都可能经 CLOSING，最终都进入 TIME-WAIT。</text><rect class="s-node" x="90" y="510" width="300" height="76" rx="12"/><text x="240.0" y="555.0" font-size="22" text-anchor="middle" class="">SYN-SENT</text><rect class="s-node" x="570" y="510" width="300" height="76" rx="12"/><text x="720.0" y="555.0" font-size="22" text-anchor="middle" class="">SYN-RECEIVED</text><polyline class="s-edge" points="390,548 570,548" marker-end="url(#tcp-special-states-arrow)"/><text x="480" y="526" font-size="20" text-anchor="middle" class="">收到 SYN</text><text x="480" y="640" font-size="22" text-anchor="middle" class="s-note">同时打开：主动打开方也可进入 SYN-RECEIVED；该状态不专属于服务器。</text></svg>
