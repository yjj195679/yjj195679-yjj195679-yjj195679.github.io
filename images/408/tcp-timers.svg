<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="tcp-timers-title tcp-timers-desc"><title id="tcp-timers-title">TCP 计时器：四种场景对照</title><desc id="tcp-timers-desc">从未确认数据、零窗口、长时间空闲和主动关闭四种场景，分别对应重传、持续、保活和时间等待机制。</desc><style>.d-bg{fill:var(--diagram-bg,#fff)}.d-box{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#58677a);stroke-width:2}.d-arrow{fill:none;stroke:var(--diagram-line,#58677a);stroke-width:2.5}.d-control{stroke-dasharray:8 6}text{fill:var(--diagram-text,#17212f);font-family:"TPM Serif","Songti SC",STSong,SimSun,"Times New Roman",serif}.d-muted{fill:var(--diagram-muted,#46566b)}.d-emphasis{font-weight:700}.d-band{fill:var(--diagram-fill,#f1f4f8)}</style><defs><marker id="tcp-timers-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--diagram-line,#58677a)"/></marker></defs><rect class="d-bg" width="960" height="640" rx="12"/><text x="40" y="45" text-anchor="start" font-size="30" class="d-emphasis">TCP 计时器：四种场景对照</text><text x="40" y="82" text-anchor="start" font-size="23" class="d-muted">同属 TCP，但触发条件不同；不是一套固定的秒数</text><rect class="d-box" x="35" y="125" width="265" height="82" rx="12"/><text x="167.5" y="174.0" text-anchor="middle" font-size="24" class="">已发送数据未获确认</text><rect class="d-box" x="340" y="125" width="280" height="82" rx="12"/><text x="480.0" y="174.0" text-anchor="middle" font-size="24" class="">重传计时器 RTO</text><rect class="d-box" x="660" y="125" width="270" height="82" rx="12"/><text x="795.0" y="174.0" text-anchor="middle" font-size="24" class="">重传最早未确认数据</text><polyline class="d-arrow " points="300,166 340,166" marker-end="url(#tcp-timers-arrow)"/><polyline class="d-arrow " points="620,166 660,166" marker-end="url(#tcp-timers-arrow)"/><rect class="d-box" x="35" y="237" width="265" height="82" rx="12"/><text x="167.5" y="286.0" text-anchor="middle" font-size="24" class="">对端公告零窗口</text><rect class="d-box" x="340" y="237" width="280" height="82" rx="12"/><text x="480.0" y="286.0" text-anchor="middle" font-size="24" class="">持续计时器 Persist</text><rect class="d-box" x="660" y="237" width="270" height="82" rx="12"/><text x="795.0" y="286.0" text-anchor="middle" font-size="24" class="">探测接收窗口是否恢复</text><polyline class="d-arrow " points="300,278 340,278" marker-end="url(#tcp-timers-arrow)"/><polyline class="d-arrow " points="620,278 660,278" marker-end="url(#tcp-timers-arrow)"/><rect class="d-box" x="35" y="349" width="265" height="82" rx="12"/><text x="167.5" y="398.0" text-anchor="middle" font-size="24" class="">启用保活且长期空闲</text><rect class="d-box" x="340" y="349" width="280" height="82" rx="12"/><text x="480.0" y="398.0" text-anchor="middle" font-size="24" class="">保活计时器 Keepalive</text><rect class="d-box" x="660" y="349" width="270" height="82" rx="12"/><text x="795.0" y="398.0" text-anchor="middle" font-size="24" class="">探测对端存活状况</text><polyline class="d-arrow " points="300,390 340,390" marker-end="url(#tcp-timers-arrow)"/><polyline class="d-arrow " points="620,390 660,390" marker-end="url(#tcp-timers-arrow)"/><rect class="d-box" x="35" y="461" width="265" height="82" rx="12"/><text x="167.5" y="510.0" text-anchor="middle" font-size="24" class="">主动关闭进入等待状态</text><rect class="d-box" x="340" y="461" width="280" height="82" rx="12"/><text x="480.0" y="510.0" text-anchor="middle" font-size="24" class="">TIME_WAIT / 2MSL</text><rect class="d-box" x="660" y="461" width="270" height="82" rx="12"/><text x="795.0" y="495.0" text-anchor="middle" font-size="24" class="">防旧段混淆</text><text x="795.0" y="525.0" text-anchor="middle" font-size="24" class="">可补发最后 ACK</text><polyline class="d-arrow " points="300,502 340,502" marker-end="url(#tcp-timers-arrow)"/><polyline class="d-arrow " points="620,502 660,502" marker-end="url(#tcp-timers-arrow)"/><text x="480" y="600" text-anchor="middle" font-size="25" class="d-emphasis">“窗口更新丢失”想持续；“闲置连接”想保活</text></svg>
