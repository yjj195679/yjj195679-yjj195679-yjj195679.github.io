<svg class="hw-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" role="img" aria-labelledby="two-level-page-walk-title two-level-page-walk-desc"><title id="two-level-page-walk-title">两级页表：先找二级表，再找页框</title><desc id="two-level-page-walk-desc">32位虚拟地址、4KB页、4B页表项，两级索引各10位，页内偏移12位。</desc><style>.hw-diagram .hw-bg{fill:var(--diagram-bg,#fff)}.hw-diagram text{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:21px}.hw-diagram .hw-title{font-size:28px;font-weight:bold}.hw-diagram .hw-small{font-size:18px}.hw-diagram .hw-box{fill:var(--diagram-fill,#f1f4f8);stroke:var(--diagram-line,#315d87);stroke-width:2}.hw-diagram .hw-blue{stroke:#387cb5}.hw-diagram .hw-green{stroke:#39846c}.hw-diagram .hw-purple{stroke:#9164ad}.hw-diagram .hw-red{stroke:#c45b64}.hw-diagram .hw-line{fill:none;stroke:var(--diagram-line,#315d87);stroke-width:2.5}.hw-diagram .hw-dash{stroke-dasharray:7 5}</style><defs><marker id="two-level-page-walk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--diagram-line,#315d87)"/></marker></defs><rect class="hw-bg" width="960" height="550" rx="12"/><text x="35" y="45" text-anchor="start" class="hw-title">两级页表：先找二级表，再找页框</text><text x="480" y="90" text-anchor="middle" class="">假设：32 位虚拟地址；页大小 4 KiB；页表项大小 4 B</text><rect x="60" y="120" width="250" height="65" rx="10" class="hw-box hw-blue"/><text x="185.0" y="159.5" text-anchor="middle" class="">一级索引：10 位</text><rect x="310" y="120" width="250" height="65" rx="10" class="hw-box hw-purple"/><text x="435.0" y="159.5" text-anchor="middle" class="">二级索引：10 位</text><rect x="560" y="120" width="340" height="65" rx="10" class="hw-box hw-green"/><text x="730.0" y="159.5" text-anchor="middle" class="">页内偏移：12 位</text><rect x="50" y="260" width="240" height="90" rx="10" class="hw-box hw-blue"/><text x="170.0" y="298.0" text-anchor="middle" class="">页目录基址</text><text x="170.0" y="326.0" text-anchor="middle" class="">+ 一级索引 × 4</text><rect x="360" y="260" width="240" height="90" rx="10" class="hw-box hw-purple"/><text x="480.0" y="298.0" text-anchor="middle" class="">二级页表基址</text><text x="480.0" y="326.0" text-anchor="middle" class="">+ 二级索引 × 4</text><rect x="670" y="260" width="240" height="90" rx="10" class="hw-box hw-green"/><text x="790.0" y="298.0" text-anchor="middle" class="">页框号 PFN</text><text x="790.0" y="326.0" text-anchor="middle" class="">来自二级页表项</text><polyline points="290,305 360,305" class="hw-line" marker-end="url(#two-level-page-walk-arrow)"/><polyline points="600,305 670,305" class="hw-line" marker-end="url(#two-level-page-walk-arrow)"/><polyline points="185,185 185,260" class="hw-line" marker-end="url(#two-level-page-walk-arrow)"/><polyline points="435,185 480,220 480,260" class="hw-line" marker-end="url(#two-level-page-walk-arrow)"/><text x="480" y="415" text-anchor="middle" class="">物理地址 = 页框号 × 4096 + 原页内偏移</text><text x="480" y="460" text-anchor="middle" class="hw-small">表项有效性与访问权限需逐级检查；缺页不能继续当作有效页框访问。</text><text x="480" y="505" text-anchor="middle" class="hw-small">TLB 未命中且页表项均有效：两次查表 + 一次访问目标数据（本简化模型）。</text></svg>