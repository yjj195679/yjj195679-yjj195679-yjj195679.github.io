<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="visual-array-insert-title visual-array-insert-desc"><title id="visual-array-insert-title">顺序表插入：为什么从后往前搬</title><desc id="visual-array-insert-desc">写入3，长度增加为5；共搬移3个已有元素。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="visual-array-insert-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">顺序表插入：为什么从后往前搬</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="40.0" y="100" width="150.0" height="64" rx="10"/><text class="vt" style="font-size:19.0px" x="115.0" y="139.0" text-anchor="middle">2</text></g><g class="active"><rect class="vb" x="198.0" y="100" width="150.0" height="64" rx="10"/><text class="vt" style="font-size:19.0px" x="273.0" y="139.0" text-anchor="middle">3</text></g><g class="base"><rect class="vb" x="356.0" y="100" width="150.0" height="64" rx="10"/><text class="vt" style="font-size:19.0px" x="431.0" y="139.0" text-anchor="middle">4</text></g><g class="base"><rect class="vb" x="514.0" y="100" width="150.0" height="64" rx="10"/><text class="vt" style="font-size:19.0px" x="589.0" y="139.0" text-anchor="middle">6</text></g><g class="base"><rect class="vb" x="672.0" y="100" width="150.0" height="64" rx="10"/><text class="vt" sty