<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="visual-cache-write-back-title visual-cache-write-back-desc"><title id="visual-cache-write-back-title">写回Cache：脏块为什么要先写回</title><desc id="visual-cache-write-back-desc">本例新请求是读失效；新块装入后初始dirty=0。写失效是否装入另由写分配策略决定。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="visual-cache-write-back-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">写回Cache：脏块为什么要先写回</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#visual-cache-write-back-arrow)" d="M299.0,106.0 L342.0,106.0"/><path class="ve" marker-end="url(#visual-cache-write-back-arrow)" d="M584.0,106.0 L627.0,106.0"/><path class="ve" marker-end="url(#visual-cache-write-back-arrow)" d="M750.0,151.0 L750.0,207.0"/><g class="done"><rect class="vb" x="65" y="65" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="180.0" y="100.0" text-anchor="middle">写命中</text><text class="vt" style="font-size:19.0px" x="180.0" y="126.0" text-anchor="middle">更新Cache置脏位</text></g><g class="done"><rect class="vb" x="350" y="65" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="465.0" y="100.0" text-anchor="middle">另一主存块映射到本行</text><text class="vt" style="font-size:19.0px" x="465.0" y="126.0" text-anchor="middle">发生替换</text></g><g class="done"><rect class="vb" x="635" y="65" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="750.0" y="100.0" text-anchor="middle">检查旧行dirty=1</text><text class="vt" style="font-size:19.0px" x="750.0" y="126.0" text-anchor="middle">写回旧主存块</text></g><g class="active"><rect class="vb" x="635" y="215" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="750.0" y="250.0" text-anchor="middle">读入新块</text><text class="vt" style="font-size:19.0px" x="750.0" y="276.0" text-anchor="middle">更新标记清脏位</text></g></g></svg>