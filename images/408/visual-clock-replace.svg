<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="visual-clock-replace-title visual-clock-replace-desc"><title id="visual-clock-replace-title">Clock扫描：清访问位与选择牺牲页</title><desc id="visual-clock-replace-desc">页4装入原页2的页框，完成本次访问置R=1；指针移到下一个页框。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="visual-clock-replace-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">Clock扫描：清访问位与选择牺牲页</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="40" y="100" width="252" height="64" rx="10"/><text class="vt" style="font-size:19.0px" x="166.0" y="126.0" text-anchor="middle">页1</text><text class="vt" style="font-size:19.0px" x="166.0" y="152.0" text-anchor="middle">R=0</text></g><g class="base"><rect class="vb" x="300" y="100" width="252" height="64" rx="10"/><text class="vt" style="font-size:19.0px" x="426.0" y="126.0" text-anchor="middle">页4</text><text class="vt" style="font-size:19.0px" x="426.0" y="152.0" text-anchor="middle">R=1</text></g><g class="active"><rect class="vb" x="560" y="100" width="252" height="64" rx="10"/><text class="vt" style="font-size:19.0px" x="686.0" y="126.0" text-anchor="middle">页3</text><text class="vt" style="font-size:19.0px" x="686.0" y="152.0" text-anchor="middle">R=1</text></g></g></svg>