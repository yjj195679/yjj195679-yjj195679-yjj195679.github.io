<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="visual-disk-sstf-title visual-disk-sstf-desc"><title id="visual-disk-sstf-title">SSTF磁盘调度：每次重新找最近请求</title><desc id="visual-disk-sstf-desc">从当前磁头170选择最近请求190，移动20个柱面；累计208。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="visual-disk-sstf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">SSTF磁盘调度：每次重新找最近请求</text><g transform="translate(0 55)"><g class="done"><rect class="vb" x="99" y="160" width="44" height="55" rx="10"/><text class="vt" style="font-size:19.0px" x="121.0" y="194.5" text-anchor="middle">16</text></g><g class="done"><rect class="vb" x="131" y="160" width="44" height="55" rx="10"/><text class="vt" style="font-size:19.0px" x="153.0" y="194.5" text-anchor="middle">24</text></g><g class="done"><rect class="vb" x="207" y="160" width="44" height="55" rx="10"/><text class="vt" style="font-size:19.0px" x="229.0" y="194.5" text-anchor="middle">43</text></g><g class="done"><rect class="vb" x="235" y="160" width="44" height="55" rx="10"/><text class="vt" style="font-size:19.0px" x="257.0" y="194.5" text-anchor="middle">50</text></g><g class="done"><rect class="vb" x="363" y="160" width="44" height="55" rx="10"/><text class="vt" style="font-size:19.0px" x="385.0" y="194.5" text-anchor="middle">82</text></g><g class="done"><rect class="vb" x="595" y="160" width="44" height="55" rx="10"/><text class="vt" style="font-size:17.2px" x="617.0" y="194.5" text-anchor="middle">140</text></g><g class="done"><rect class="vb" x="715" y="160" width="44" height="55" rx="10"/><text class="vt" style="font-size:17.2px" x="737.0" y="194.5" text-anchor="middle">170</text></g><g class="active"><rect class="vb" x="795" y="160" width="44" height="55" rx="10"/><text class="vt" style="font-size:17.2px" x="817.0" y="194.5" text-anchor="middle">190</text></g></g></svg>