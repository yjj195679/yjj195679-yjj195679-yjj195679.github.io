<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="visual-dma-lifecycle-title visual-dma-lifecycle-desc"><title id="visual-dma-lifecycle-title">DMA整段传送：CPU何时参与</title><desc id="visual-dma-lifecycle-desc">控制器报告完成或错误；CPU在中断处理程序中收尾；DMA仍需要CPU初始化和结束处理。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="visual-dma-lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">DMA整段传送：CPU何时参与</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#visual-dma-lifecycle-arrow)" d="M299.0,106.0 L342.0,106.0"/><path class="ve" marker-end="url(#visual-dma-lifecycle-arrow)" d="M584.0,106.0 L627.0,106.0"/><path class="ve" marker-end="url(#visual-dma-lifecycle-arrow)" d="M750.0,151.0 L750.0,207.0"/><g class="done"><rect class="vb" x="65" y="65" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="180.0" y="100.0" text-anchor="middle">CPU设置DMA</text><text class="vt" style="font-size:19.0px" x="180.0" y="126.0" text-anchor="middle">地址、方向、长度</text></g><g class="done"><rect class="vb" x="350" y="65" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="465.0" y="100.0" text-anchor="middle">DMA取得总线</text><text class="vt" style="font-size:19.0px" x="465.0" y="126.0" text-anchor="middle">设备↔主存</text></g><g class="done"><rect class="vb" x="635" y="65" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="750.0" y="100.0" text-anchor="middle">DMA更新计数</text><text class="vt" style="font-size:19.0px" x="750.0" y="126.0" text-anchor="middle">CPU可执行其他工作</text></g><g class="active"><rect class="vb" x="635" y="215" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="750.0" y="250.0" text-anchor="middle">块传送完成</text><text class="vt" style="font-size:19.0px" x="750.0" y="276.0" text-anchor="middle">中断通知CPU</text></g></g></svg>