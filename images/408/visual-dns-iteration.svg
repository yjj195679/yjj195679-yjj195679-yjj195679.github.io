<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="visual-dns-iteration-title visual-dns-iteration-desc"><title id="visual-dns-iteration-title">DNS：本地服务器代客户端逐级询问</title><desc id="visual-dns-iteration-desc">本地DNS返回结果；以后命中有效缓存时可以跳过部分或全部上游查询。图中一行代表一次问答或最终返回，不按箭头数量计算报文数。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="visual-dns-iteration-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">DNS：本地服务器代客户端逐级询问</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#visual-dns-iteration-arrow)" d="M136.0,111.0 L486.0,111.0"/><text style="font-size:18.0px" class="vt vl" x="311.0" y="99.0" text-anchor="middle">递归请求 example.com</text><path class="ve" marker-end="url(#visual-dns-iteration-arrow)" d="M486.0,169.0 L836.0,169.0"/><text style="font-size:18.0px" class="vt vl" x="661.0" y="157.0" text-anchor="middle">问根：获得 .com 服务器线索</text><path class="ve" marker-end="url(#visual-dns-iteration-arrow)" d="M486.0,227.0 L836.0,227.0"/><text style="font-size:18.0px" class="vt vl" x="661.0" y="215.0" text-anchor="middle">问 .com：获得权威服务器线索</text><path class="ve" marker-end="url(#visual-dns-iteration-arrow)" d="M486.0,285.0 L836.0,285.0"/><text style="font-size:18.0px" class="vt vl" x="661.0" y="273.0" text-anchor="middle">问权威：获得目标记录</text><path class="ve" marker-end="url(#visual-dns-iteration-arrow)" d="M486.0,343.0 L136.0,343.0"/><text style="font-size:18.0px" class="vt vl" x="311.0" y="331.0" text-anchor="middle">返回结果并按TTL缓存</text><g class="active"><rect class="vb" x="70" y="25" width="130" height="52" rx="10"/><text class="vt" style="font-size:19.0px" x="135.0" y="58.0" text-anchor="middle">客户端</text></g><g class="active"><rect class="vb" x="420" y="25" width="130" height="52" rx="10"/><text class="vt" style="font-size:19.0px" x="485.0" y="58.0" text-anchor="middle">本地DNS</text></g><g class="active"><rect class="vb" x="770" y="25" width="130" height="52" rx="10"/><text class="vt" style="font-size:19.0px" x="835.0" y="58.0" text-anchor="middle">层次DNS</text></g></g></svg>