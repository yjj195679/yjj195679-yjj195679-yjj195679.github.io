<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="visual-encapsulation-title visual-encapsulation-desc"><title id="visual-encapsulation-title">发送到接收：数据怎样逐层封装</title><desc id="visual-encapsulation-desc">终点逐层检查和去除封装；首部和尾部属于哪一层应分清。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="visual-encapsulation-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">发送到接收：数据怎样逐层封装</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#visual-encapsulation-arrow)" d="M299.0,106.0 L342.0,106.0"/><path class="ve" marker-end="url(#visual-encapsulation-arrow)" d="M584.0,106.0 L627.0,106.0"/><path class="ve" marker-end="url(#visual-encapsulation-arrow)" d="M750.0,151.0 L750.0,207.0"/><path class="ve" marker-end="url(#visual-encapsulation-arrow)" d="M631.0,256.0 L588.0,256.0"/><path class="ve" marker-end="url(#visual-encapsulation-arrow)" d="M346.0,256.0 L303.0,256.0"/><g class="done"><rect class="vb" x="65" y="65" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="180.0" y="100.0" text-anchor="middle">应用数据</text><text class="vt" style="font-size:19.0px" x="180.0" y="126.0" text-anchor="middle">HTTP等</text></g><g class="done"><rect class="vb" x="350" y="65" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="465.0" y="100.0" text-anchor="middle">运输层加首部</text><text class="vt" style="font-size:19.0px" x="465.0" y="126.0" text-anchor="middle">TCP段 / UDP数据报</text></g><g class="done"><rect class="vb" x="635" y="65" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="750.0" y="100.0" text-anchor="middle">网络层加首部</text><text class="vt" style="font-size:19.0px" x="750.0" y="126.0" text-anchor="middle">IP数据报</text></g><g class="done"><rect class="vb" x="635" y="215" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="750.0" y="250.0" text-anchor="middle">链路层加首尾</text><text class="vt" style="font-size:19.0px" x="750.0" y="276.0" text-anchor="middle">以太网帧</text></g><g class="done"><rect class="vb" x="350" y="215" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="465.0" y="250.0" text-anchor="middle">物理层传输比特</text><text class="vt" style="font-size:19.0px" x="465.0" y="276.0" text-anchor="middle">跨路由逐跳转发</text></g><g class="active"><rect class="vb" x="65" y="215" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="180.0" y="250.0" text-anchor="middle">接收端逆向解封装</text><text class="vt" style="font-size:19.0px" x="180.0" y="276.0" text-anchor="middle">交给对应应用</text></g></g></svg>