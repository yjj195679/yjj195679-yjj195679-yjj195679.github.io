<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="visual-endian-bytes-title visual-endian-bytes-desc"><title id="visual-endian-bytes-title">同一个32位数的大端与小端布局</title><desc id="visual-endian-bytes-desc">小端把最低有效字节0x78放在最低地址。字节内部bit顺序没有因此颠倒。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="visual-endian-bytes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">同一个32位数的大端与小端布局</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="40.0" y="100" width="189.5" height="64" rx="10"/><text class="vt" style="font-size:19.0px" x="134.75" y="126.0" text-anchor="middle">地址1000</text><text class="vt" style="font-size:19.0px" x="134.75" y="152.0" text-anchor="middle">78</text></g><g class="base"><rect class="vb" x="237.5" y="100" width="189.5" height="64" rx="10"/><text class="vt" style="font-size:19.0px" x="332.25" y="126.0" text-anchor="middle">地址1001</text><text class="vt" style="font-size:19.0px" x="332.25" y="152.0" text-anchor="middle">56</text></g><g class="base"><rect class="vb" x="435.0" y="100" width="189.5" height="64" rx="10"/><text class="vt" style="font-size:19.0px" x="529.75" y="126.0" text-anchor="middle">地址1002</text><text class="vt" style="font-size:19.0px" x="529.75" y="152.0" text-anchor="middle">34</text></g><g class="base"><rect class="vb" x="632.5" y="100" width="189.5" height="64" rx="10"/><text class="vt" style="font-size:19.0px" x="727.25" y="126.0" text-anchor="middle">地址1003</text><text class="vt" style="font-size:19.0px" x="727.25" y="152.0" text-anchor="middle">12</text></g></g></svg>