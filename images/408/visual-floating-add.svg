<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="visual-floating-add-title visual-floating-add-desc"><title id="visual-floating-add-title">浮点加法：1.5 + 0.25如何对阶</title><desc id="visual-floating-add-desc">结果已规格化；一般还需按保留位、保护位和舍入规则处理并检查阶码范围。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="visual-floating-add-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">浮点加法：1.5 + 0.25如何对阶</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="40" y="100" width="252" height="64" rx="10"/><text class="vt" style="font-size:19.0px" x="166.0" y="139.0" text-anchor="middle">1.110₂ × 2⁰</text></g><g class="base"><rect class="vb" x="300" y="100" width="252" height="64" rx="10"/><text class="vt" style="font-size:19.0px" x="426.0" y="139.0" text-anchor="middle">= 1.75</text></g><g class="base"><rect class="vb" x="560" y="100" width="252" height="64" rx="10"/><text class="vt" style="font-size:19.0px" x="686.0" y="139.0" text-anchor="middle">精确，无舍入损失</text></g></g></svg>