<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="visual-hard-soft-link-title visual-hard-soft-link-desc"><title id="visual-hard-soft-link-title">硬链接和软链接：名字指向哪里</title><desc id="visual-hard-soft-link-desc">软链接按路径解析，删除a后s可能失效；b不因a删除而失效。最终释放还需考虑打开引用等条件。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="visual-hard-soft-link-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">硬链接和软链接：名字指向哪里</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#visual-hard-soft-link-arrow)" d="M299.0,106.0 L342.0,106.0"/><path class="ve" marker-end="url(#visual-hard-soft-link-arrow)" d="M584.0,106.0 L627.0,106.0"/><path class="ve" marker-end="url(#visual-hard-soft-link-arrow)" d="M750.0,151.0 L750.0,207.0"/><path class="ve" marker-end="url(#visual-hard-soft-link-arrow)" d="M631.0,256.0 L588.0,256.0"/><g class="done"><rect class="vb" x="65" y="65" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="180.0" y="100.0" text-anchor="middle">目录名a</text><text class="vt" style="font-size:19.0px" x="180.0" y="126.0" text-anchor="middle">指向inode 42</text></g><g class="done"><rect class="vb" x="350" y="65" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="465.0" y="100.0" text-anchor="middle">再建硬链接b</text><text class="vt" style="font-size:19.0px" x="465.0" y="126.0" text-anchor="middle">同指inode 42</text></g><g class="done"><rect class="vb" x="635" y="65" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="750.0" y="100.0" text-anchor="middle">另建软链接s</text><text class="vt" style="font-size:19.0px" x="750.0" y="126.0" text-anchor="middle">独立inode存路径a</text></g><g class="done"><rect class="vb" x="635" y="215" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="750.0" y="250.0" text-anchor="middle">删除名字a</text><text class="vt" style="font-size:19.0px" x="750.0" y="276.0" text-anchor="middle">b仍可访问文件</text></g><g class="active"><rect class="vb" x="350" y="215" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="465.0" y="250.0" text-anchor="middle">软链接s仍指路径a</text><text class="vt" style="font-size:19.0px" x="465.0" y="276.0" text-anchor="middle">路径消失则悬空</text></g></g></svg>