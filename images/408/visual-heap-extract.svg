<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="visual-heap-extract-title visual-heap-extract-desc"><title id="visual-heap-extract-title">最大堆取出堆顶与向下筛选</title><desc id="visual-heap-extract-desc">3与较大的孩子8交换，得到规模5的最大堆；9不再参与调整。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="visual-heap-extract-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">最大堆取出堆顶与向下筛选</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#visual-heap-extract-arrow)" d="M376.0,89.4 L278.0,148.2"/><path class="ve" marker-end="url(#visual-heap-extract-arrow)" d="M474.0,89.4 L572.0,148.2"/><path class="ve" marker-end="url(#visual-heap-extract-arrow)" d="M199.8,214.0 L153.1,277.0"/><path class="ve" marker-end="url(#visual-heap-extract-arrow)" d="M250.2,214.0 L296.9,277.0"/><g class="active"><rect class="vb" x="380" y="30" width="90" height="60" rx="10"/><text class="vt" style="font-size:19.0px" x="425.0" y="67.0" text-anchor="middle">8</text></g><g class="base"><rect class="vb" x="180" y="150" width="90" height="60" rx="10"/><text class="vt" style="font-size:19.0px" x="225.0" y="187.0" text-anchor="middle">7</text></g><g class="base"><rect class="vb" x="580" y="150" width="90" height="60" rx="10"/><text class="vt" style="font-size:19.0px" x="625.0" y="187.0" text-anchor="middle">3</text></g><g class="base"><rect class="vb" x="80" y="285" width="90" height="60" rx="10"/><text class="vt" style="font-size:19.0px" x="125.0" y="322.0" text-anchor="middle">2</text></g><g class="base"><rect class="vb" x="280" y="285" width="90" height="60" rx="10"/><text class="vt" style="font-size:19.0px" x="325.0" y="322.0" text-anchor="middle">4</text></g><g class="done"><rect class="vb" x="540" y="285" width="90" height="60" rx="10"/><text class="vt" style="font-size:19.0px" x="585.0" y="322.0" text-anchor="middle">9</text></g></g></svg>