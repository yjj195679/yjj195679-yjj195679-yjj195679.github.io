<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="visual-http-rtt-title visual-http-rtt-desc"><title id="visual-http-rtt-title">HTTP非持久连接：一个对象的2RTT</title><desc id="visual-http-rtt-desc">对象传输时间另加。复用已建连接时通常无需再算TCP握手RTT；并行、流水线和TLS会改变总时间模型。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="visual-http-rtt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">HTTP非持久连接：一个对象的2RTT</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#visual-http-rtt-arrow)" d="M136.0,111.0 L836.0,111.0"/><text style="font-size:18.0px" class="vt vl" x="486.0" y="99.0" text-anchor="middle">0→RTT：建立TCP连接</text><path class="ve" marker-end="url(#visual-http-rtt-arrow)" d="M136.0,169.0 L836.0,169.0"/><text style="font-size:18.0px" class="vt vl" x="486.0" y="157.0" text-anchor="middle">RTT→2RTT：HTTP请求与首字节</text><path class="ve" marker-end="url(#visual-http-rtt-arrow)" d="M836.0,227.0 L136.0,227.0"/><text style="font-size:18.0px" class="vt vl" x="486.0" y="215.0" text-anchor="middle">2RTT之后：传输对象数据</text><g class="active"><rect class="vb" x="70" y="25" width="130" height="52" rx="10"/><text class="vt" style="font-size:19.0px" x="135.0" y="58.0" text-anchor="middle">客户端</text></g><g class="active"><rect class="vb" x="770" y="25" width="130" height="52" rx="10"/><text class="vt" style="font-size:19.0px" x="835.0" y="58.0" text-anchor="middle">服务器</text></g></g></svg>