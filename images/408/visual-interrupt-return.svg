<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="visual-interrupt-return-title visual-interrupt-return-desc"><title id="visual-interrupt-return-title">中断返回：处理结束不必切换进程</title><desc id="visual-interrupt-return-desc">本例继续P，说明中断不必导致进程切换；发生特权级转换也不等于发生进程切换。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="visual-interrupt-return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">中断返回：处理结束不必切换进程</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#visual-interrupt-return-arrow)" d="M299.0,106.0 L342.0,106.0"/><path class="ve" marker-end="url(#visual-interrupt-return-arrow)" d="M584.0,106.0 L627.0,106.0"/><path class="ve" marker-end="url(#visual-interrupt-return-arrow)" d="M750.0,151.0 L750.0,207.0"/><path class="ve" marker-end="url(#visual-interrupt-return-arrow)" d="M631.0,256.0 L588.0,256.0"/><g class="done"><rect class="vb" x="65" y="65" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="180.0" y="113.0" text-anchor="middle">P在用户态运行</text></g><g class="done"><rect class="vb" x="350" y="65" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="465.0" y="100.0" text-anchor="middle">中断响应</text><text class="vt" style="font-size:19.0px" x="465.0" y="126.0" text-anchor="middle">保存断点与必要现场</text></g><g class="done"><rect class="vb" x="635" y="65" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="750.0" y="100.0" text-anchor="middle">内核处理中断</text><text class="vt" style="font-size:19.0px" x="750.0" y="126.0" text-anchor="middle">更新设备/唤醒任务</text></g><g class="done"><rect class="vb" x="635" y="215" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="750.0" y="250.0" text-anchor="middle">返回路径检查</text><text class="vt" style="font-size:19.0px" x="750.0" y="276.0" text-anchor="middle">是否需要调度</text></g><g class="active"><rect class="vb" x="350" y="215" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="465.0" y="250.0" text-anchor="middle">恢复P继续执行</text><text class="vt" style="font-size:19.0px" x="465.0" y="276.0" text-anchor="middle">本例不满足切换条件</text></g></g></svg>