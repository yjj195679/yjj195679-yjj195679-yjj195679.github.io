<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="visual-linked-insert-title visual-linked-insert-desc"><title id="visual-linked-insert-title">单链表插入：先接后继，再改前驱</title><desc id="visual-linked-insert-desc">再让A指向S，形成A→S→B。若先覆盖p.next再用它找B，就会丢失原后继。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="visual-linked-insert-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">单链表插入：先接后继，再改前驱</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#visual-linked-insert-arrow)" d="M214.0,131.0 L332.0,131.0"/><path class="ve" marker-end="url(#visual-linked-insert-arrow)" d="M494.0,131.0 L612.0,131.0"/><g class="base"><rect class="vb" x="60" y="100" width="150" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="135.0" y="138.0" text-anchor="middle">p：结点 A</text></g><g class="active"><rect class="vb" x="340" y="100" width="150" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="415.0" y="138.0" text-anchor="middle">新结点 S</text></g><g class="base"><rect class="vb" x="620" y="100" width="150" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="695.0" y="138.0" text-anchor="middle">原后继 B</text></g></g></svg>