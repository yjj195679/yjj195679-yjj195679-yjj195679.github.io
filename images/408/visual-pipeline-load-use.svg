<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="visual-pipeline-load-use-title visual-pipeline-load-use-desc"><title id="visual-pipeline-load-use-title">load-use冒险：有转发也可能需要停顿</title><desc id="visual-pipeline-load-use-desc">下一周期把MEM/WB中的值转发到I2的EX输入；具体停顿数取决于题设流水线和存储时序。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="visual-pipeline-load-use-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">load-use冒险：有转发也可能需要停顿</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#visual-pipeline-load-use-arrow)" d="M299.0,106.0 L342.0,106.0"/><path class="ve" marker-end="url(#visual-pipeline-load-use-arrow)" d="M584.0,106.0 L627.0,106.0"/><g class="done"><rect class="vb" x="65" y="65" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="180.0" y="100.0" text-anchor="middle">I1：lw r1,0(r2)</text><text class="vt" style="font-size:19.0px" x="180.0" y="126.0" text-anchor="middle">EX算地址</text></g><g class="done"><rect class="vb" x="350" y="65" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="465.0" y="100.0" text-anchor="middle">I1：MEM读数据</text><text class="vt" style="font-size:19.0px" x="465.0" y="126.0" text-anchor="middle">I2：停顿一拍</text></g><g class="active"><rect class="vb" x="635" y="65" width="230" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="750.0" y="100.0" text-anchor="middle">I2：EX使用r1</text><text class="vt" style="font-size:19.0px" x="750.0" y="126.0" text-anchor="middle">通过转发得到数据</text></g></g></svg>