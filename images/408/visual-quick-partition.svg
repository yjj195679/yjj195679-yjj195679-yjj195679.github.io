<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="visual-quick-partition-title visual-quick-partition-desc"><title id="visual-quick-partition-title">快速排序：完整的一次划分</title><desc id="visual-quick-partition-desc">3落在最终位置2；左侧均小于3，右侧均大于3；两侧仍需递归排序。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="visual-quick-partition-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">快速排序：完整的一次划分</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="40.0" y="100" width="123.66666666666666" height="64" rx="10"/><text class="vt" style="font-size:19.0px" x="101.83333333333333" y="139.0" text-anchor="middle">2</text></g><g class="base"><rect class="vb" x="171.66666666666666" y="100" width="123.66666666666666" height="64" rx="10"/><text class="vt" style="font-size:19.0px" x="233.5" y="139.0" text-anchor="middle">1</text></g><g class="active"><rect class="vb" x="303.3333333333333" y="100" width="123.66666666666666" height="64" rx="10"/><text class="vt" style="font-size:19.0px" x="365.16666666666663" y="139.0" text-anchor="middle">3</text></g><g class="base"><rect class="vb" x="435.0" y="100" width="123.66666666666666" height="64" rx="10"/><text class="vt" style="font-size:19.0px" x="496.8333333333333" y="139.0" text-anchor="middle">4</text></g><g class="base"><rect class="vb" x="566.6666666666666" y="100" width="123.66666666666666" height="64" rx="10"/><text class="vt" style="font-size:19.0px" x="628.5" y="139.0" text-anchor="middle">5</text></g><g class="base"><rect class="vb" x="698.3333333333333" y="100" width="123.66666666666666" height="64" rx="10"/><text class="vt" style="font-size:19.0px" x="760.1666666666666" y="139.0" text-anchor="middle">6</text></g></g></svg>