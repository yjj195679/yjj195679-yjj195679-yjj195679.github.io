<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="visual-ripple-add-steps-title visual-ripple-add-steps-desc"><title id="visual-ripple-add-steps-title">逐位看进位：0111 + 0011</title><desc id="visual-ripple-add-steps-desc">0+0+1=1，本位和1，向高位进位0。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="visual-ripple-add-steps-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">逐位看进位：0111 + 0011</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#visual-ripple-add-steps-arrow)" d="M224.0,120.5 L352.0,168.2"/><path class="ve" marker-end="url(#visual-ripple-add-steps-arrow)" d="M224.0,201.0 L352.0,201.0"/><path class="ve" marker-end="url(#visual-ripple-add-steps-arrow)" d="M224.0,281.5 L352.0,233.8"/><path class="ve" marker-end="url(#visual-ripple-add-steps-arrow)" d="M524.0,175.9 L642.0,140.8"/><path class="ve" marker-end="url(#visual-ripple-add-steps-arrow)" d="M524.0,221.6 L642.0,250.6"/><g class="base"><rect class="vb" x="70" y="60" width="150" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="145.0" y="98.0" text-anchor="middle">A3=0</text></g><g class="base"><rect class="vb" x="70" y="170" width="150" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="145.0" y="208.0" text-anchor="middle">B3=0</text></g><g class="base"><rect class="vb" x="70" y="280" width="150" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="145.0" y="318.0" text-anchor="middle">C3=1</text></g><g class="active"><rect class="vb" x="360" y="160" width="160" height="82" rx="10"/><text class="vt" style="font-size:19.0px" x="440.0" y="208.0" text-anchor="middle">全加器</text></g><g class="base"><rect class="vb" x="650" y="85" width="150" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="725.0" y="123.0" text-anchor="middle">S3=1</text></g><g class="base"><rect class="vb" x="650" y="240" width="150" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="725.0" y="278.0" text-anchor="middle">C4=0</text></g></g></svg>