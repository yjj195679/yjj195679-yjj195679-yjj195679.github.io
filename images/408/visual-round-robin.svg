<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="visual-round-robin-title visual-round-robin-desc"><title id="visual-round-robin-title">时间片轮转：完整队列与甘特图</title><desc id="visual-round-robin-desc">P1本次用1个时间单位，完成并退出队列。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="visual-round-robin-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">时间片轮转：完整队列与甘特图</text><g transform="translate(0 55)"><g class="done"><rect class="vb" x="35" y="85" width="167" height="95" rx="10"/><text class="vt" style="font-size:19.0px" x="118.5" y="126.5" text-anchor="middle">P1</text><text class="vt" style="font-size:19.0px" x="118.5" y="152.5" text-anchor="middle">0→2</text></g><g class="done"><rect class="vb" x="207" y="85" width="167" height="95" rx="10"/><text class="vt" style="font-size:19.0px" x="290.5" y="126.5" text-anchor="middle">P2</text><text class="vt" style="font-size:19.0px" x="290.5" y="152.5" text-anchor="middle">2→4</text></g><g class="done"><rect class="vb" x="379" y="85" width="81" height="95" rx="10"/><text class="vt" style="font-size:19.0px" x="419.5" y="126.5" text-anchor="middle">P3</text><text class="vt" style="font-size:19.0px" x="419.5" y="152.5" text-anchor="middle">4→5</text></g><g class="done"><rect class="vb" x="465" y="85" width="167" height="95" rx="10"/><text class="vt" style="font-size:19.0px" x="548.5" y="126.5" text-anchor="middle">P1</text><text class="vt" style="font-size:19.0px" x="548.5" y="152.5" text-anchor="middle">5→7</text></g><g class="done"><rect class="vb" x="637" y="85" width="81" height="95" rx="10"/><text class="vt" style="font-size:19.0px" x="677.5" y="126.5" text-anchor="middle">P2</text><text class="vt" style="font-size:19.0px" x="677.5" y="152.5" text-anchor="middle">7→8</text></g><g class="active"><rect class="vb" x="723" y="85" width="81" height="95" rx="10"/><text class="vt" style="font-size:19.0px" x="763.5" y="126.5" text-anchor="middle">P1</text><text class="vt" style="font-size:19.0px" x="763.5" y="152.5" text-anchor="middle">8→9</text></g></g></svg>