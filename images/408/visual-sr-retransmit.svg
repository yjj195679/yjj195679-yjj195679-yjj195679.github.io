<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="visual-sr-retransmit-title visual-sr-retransmit-desc"><title id="visual-sr-retransmit-title">选择重传SR：乱序缓存后一次交付</title><desc id="visual-sr-retransmit-desc">帧1到达填补缺口，接收方向上层按序交付1和已缓存的2；图中单独ACK按帧编号约定，勿与TCP的期望字节ack混用。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="visual-sr-retransmit-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">选择重传SR：乱序缓存后一次交付</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#visual-sr-retransmit-arrow)" d="M136.0,111.0 L836.0,111.0"/><text style="font-size:18.0px" class="vt vl" x="486.0" y="99.0" text-anchor="middle">帧0到达，单独确认0</text><path class="ve" marker-end="url(#visual-sr-retransmit-arrow)" d="M136.0,169.0 L836.0,169.0"/><text style="font-size:18.0px" class="vt vl" x="486.0" y="157.0" text-anchor="middle">帧1丢失 ×</text><path class="ve" marker-end="url(#visual-sr-retransmit-arrow)" d="M136.0,227.0 L836.0,227.0"/><text style="font-size:18.0px" class="vt vl" x="486.0" y="215.0" text-anchor="middle">帧2到达，缓存并确认2</text><path class="ve" marker-end="url(#visual-sr-retransmit-arrow)" d="M136.0,285.0 L836.0,285.0"/><text style="font-size:18.0px" class="vt vl" x="486.0" y="273.0" text-anchor="middle">帧1超时，单独重传1</text><path class="ve" marker-end="url(#visual-sr-retransmit-arrow)" d="M836.0,343.0 L136.0,343.0"/><text style="font-size:18.0px" class="vt vl" x="486.0" y="331.0" text-anchor="middle">ACK1；接收窗口推进到3</text><g class="active"><rect class="vb" x="70" y="25" width="130" height="52" rx="10"/><text class="vt" style="font-size:19.0px" x="135.0" y="58.0" text-anchor="middle">发送方</text></g><g class="active"><rect class="vb" x="770" y="25" width="130" height="52" rx="10"/><text class="vt" style="font-size:19.0px" x="835.0" y="58.0" text-anchor="middle">接收方</text></g></g></svg>