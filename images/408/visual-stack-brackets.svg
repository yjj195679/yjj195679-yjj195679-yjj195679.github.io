<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="visual-stack-brackets-title visual-stack-brackets-desc"><title id="visual-stack-brackets-title">括号匹配与栈顶的变化</title><desc id="visual-stack-brackets-desc">与栈顶(匹配，弹出(；输入结束且栈空，匹配成功。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="visual-stack-brackets-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">括号匹配与栈顶的变化</text><g transform="translate(0 55)"><g class="base"><rect class="vb" x="320" y="330" width="200" height="40" rx="10"/><text class="vt" style="font-size:19.0px" x="420.0" y="357.0" text-anchor="middle">栈底</text></g></g></svg>