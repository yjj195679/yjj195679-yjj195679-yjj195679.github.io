<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="visual-tcp-cwnd-title visual-tcp-cwnd-desc"><title id="visual-tcp-cwnd-title">拥塞窗口：到门限后为什么不再翻倍</title><desc id="visual-tcp-cwnd-desc">理想轮次模型：ssthresh=8 MSS；慢开始按轮次翻倍，达到门限后按拥塞避免每轮约增加1 MSS。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="visual-tcp-cwnd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">拥塞窗口：到门限后为什么不再翻倍</text><g transform="translate(0 55)"><g class="done"><rect class="vb" x="60" y="297" width="90" height="23" rx="10"/><text class="vt" style="font-size:8.5px" x="105.0" y="315.5" text-anchor="middle">1</text></g><g class="done"><rect class="vb" x="190" y="274" width="90" height="46" rx="10"/><text class="vt" style="font-size:19.0px" x="235.0" y="304.0" text-anchor="middle">2</text></g><g class="done"><rect class="vb" x="320" y="228" width="90" height="92" rx="10"/><text class="vt" style="font-size:19.0px" x="365.0" y="281.0" text-anchor="middle">4</text></g><g class="done"><rect class="vb" x="450" y="136" width="90" height="184" rx="10"/><text class="vt" style="font-size:19.0px" x="495.0" y="235.0" text-anchor="middle">8</text></g><g class="done"><rect class="vb" x="580" y="113" width="90" height="207" rx="10"/><text class="vt" style="font-si