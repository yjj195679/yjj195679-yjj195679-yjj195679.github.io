<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="visual-tcp-handshake-title visual-tcp-handshake-desc"><title id="visual-tcp-handshake-title">三次握手：seq、ack与状态逐条对照</title><desc id="visual-tcp-handshake-desc">服务端收到第三次ACK后进入ESTABLISHED；纯ACK不消耗序号。示例无数据、无丢包。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="visual-tcp-handshake-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">三次握手：seq、ack与状态逐条对照</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#visual-tcp-handshake-arrow)" d="M136.0,111.0 L836.0,111.0"/><text style="font-size:18.0px" class="vt vl" x="486.0" y="99.0" text-anchor="middle">SYN seq=100</text><path class="ve" marker-end="url(#visual-tcp-handshake-arrow)" d="M836.0,169.0 L136.0,169.0"/><text style="font-size:18.0px" class="vt vl" x="486.0" y="157.0" text-anchor="middle">SYN+ACK seq=500 ack=101</text><path class="ve" marker-end="url(#visual-tcp-handshake-arrow)" d="M136.0,227.0 L836.0,227.0"/><text style="font-size:18.0px" class="vt vl" x="486.0" y="215.0" text-anchor="middle">ACK seq=101 ack=501</text><g class="active"><rect class="vb" x="70" y="25" width="130" height="52" rx="10"/><text class="vt" style="font-size:19.0px" x="135.0" y="58.0" text-anchor="middle">客户端</text></g><g class="active"><rect class="vb" x="770" y="25" width="130" height="52" rx="10"/><text class="vt" style="font-size:19.0px" x="835.0" y="58.0" text-anchor="middle">服务端</text></g></g></svg>