<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="visual-topological-title visual-topological-desc"><title id="visual-topological-title">拓扑排序：删除边怎样让入度变为0</title><desc id="visual-topological-desc">选择零入度顶点并输出，删除它的出边，再把新出现的零入度顶点加入队列。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="visual-topological-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">拓扑排序：删除边怎样让入度变为0</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#visual-topological-arrow)" d="M164.0,86.0 L342.0,86.0"/><path class="ve" marker-end="url(#visual-topological-arrow)" d="M115.0,121.0 L115.0,247.0"/><path class="ve" marker-end="url(#visual-topological-arrow)" d="M395.0,121.0 L395.0,247.0"/><path class="ve" marker-end="url(#visual-topological-arrow)" d="M164.0,286.0 L342.0,286.0"/><g class="done"><rect class="vb" x="70" y="55" width="90" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="115.0" y="93.0" text-anchor="middle">A</text></g><g class="done"><rect class="vb" x="350" y="55" width="90" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="395.0" y="93.0" text-anchor="middle">B</text></g><g class="done"><rect class="vb" x="70" y="255" width="90" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="115.0" y="293.0" text-anchor="middle">C</text></g><g class="active"><rect class="vb" x="350" y="255" width="90" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="395.0" y="293.0" text-anchor="middle">D</text></g><g class="base"><rect class="vb" x="520" y="75" width="310" height="220" rx="10"/><text class="vt" style="font-size:19.0px" x="675.0" y="166.0" text-anchor="middle">剩余入度</text><text class="vt" style="font-size:19.0px" x="675.0" y="192.0" text-anchor="middle">C:已删</text><text class="vt" style="font-size:19.0px" x="675.0" y="218.0" text-anchor="middle">D:0</text></g></g></svg>