<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="visual-tree-inorder-title visual-tree-inorder-desc"><title id="visual-tree-inorder-title">一棵树逐步走完中序遍历</title><desc id="visual-tree-inorder-desc">中序规则：左子树→根→右子树。这里的“访问”是输出结点，沿边经过不等于输出。</desc><style>.bg{fill:var(--diagram-bg,#fff)}.vb{fill:var(--diagram-fill,#eff4f9);stroke:var(--diagram-line,#356493);stroke-width:2}.vt{fill:var(--diagram-text,#17212f);font-family:SimSun,"Times New Roman",serif;font-size:19px}.ve{stroke:var(--diagram-line,#356493);stroke-width:2;fill:none}.active .vb{stroke:var(--hand-example,#7444ad);stroke-width:4;fill:var(--diagram-fill,#f3eafb)}.done .vb{stroke:var(--hand-memory,#237352)}.vl{paint-order:stroke;stroke:var(--diagram-bg,#fff);stroke-width:7;stroke-linejoin:round}</style><defs><marker id="visual-tree-inorder-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path fill="var(--diagram-line,#356493)" d="M0 0 L10 5 L0 10z"/></marker></defs><rect class="bg" width="900" height="500"/><text class="vt" x="450" y="35" text-anchor="middle" style="font-size:24px">一棵树逐步走完中序遍历</text><g transform="translate(0 55)"><path class="ve" marker-end="url(#visual-tree-inorder-arrow)" d="M366.0,104.8 L278.0,159.8"/><path class="ve" marker-end="url(#visual-tree-inorder-arrow)" d="M474.0,104.8 L562.0,159.8"/><path class="ve" marker-end="url(#visual-tree-inorder-arrow)" d="M192.0,231.0 L151.2,282.0"/><path class="ve" marker-end="url(#visual-tree-inorder-arrow)" d="M248.0,231.0 L288.8,282.0"/><g class="done"><rect class="vb" x="370" y="40" width="100" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="420.0" y="78.0" text-anchor="middle">A</text></g><g class="done"><rect class="vb" x="170" y="165" width="100" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="220.0" y="203.0" text-anchor="middle">B</text></g><g class="active"><rect class="vb" x="570" y="165" width="100" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="620.0" y="203.0" text-anchor="middle">C</text></g><g class="done"><rect class="vb" x="70" y="290" width="100" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="120.0" y="328.0" text-anchor="middle">D</text></g><g class="done"><rect class="vb" x="270" y="290" width="100" height="62" rx="10"/><text class="vt" style="font-size:19.0px" x="320.0" y="328.0" text-anchor="middle">E</text></g></g></svg>