<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵动随机挑选器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');

        body {
            font-family: 'Noto Sans SC', system-ui, sans-serif;
        }

        .option-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .option-item:hover {
            transform: translateX(8px);
            background-color: #f3f4f6;
        }

        .result {
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            0% { transform: scale(0.3) rotate(-15deg); opacity: 0; }
            50% { transform: scale(1.15) rotate(8deg); }
            100% { transform: scale(1) rotate(0); }
        }

        .wheel {
            transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: fall 3.5s linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(800px) rotate(720deg);
                opacity: 0;
            }
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.4);
            border-radius: 20px;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-600 via-pink-500 to-rose-400 min-h-screen text-white">
    <div class="max-w-2xl mx-auto p-6">
        <!-- Header -->
        <div class="text-center mb-10 pt-8">
            <div class="inline-flex items-center gap-3 mb-4">
                <i class="fas fa-dice text-5xl"></i>
                <h1 class="text-5xl font-bold tracking-tight">灵动随机挑选</h1>
            </div>
            <p class="text-xl opacity-90">输入选项，让命运帮你决定！🎲</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- 选项面板 -->
            <div class="lg:col-span-5 bg-white/10 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-white/20">
                <h2 class="text-2xl font-semibold mb-6 flex items-center gap-2">
                    <i class="fas fa-list"></i> 你的选项
                </h2>

                <!-- 添加选项 -->
                <div class="flex gap-3 mb-6">
                    <input
                        id="optionInput"
                        type="text"
                        placeholder="输入一个选项..."
                        class="flex-1 bg-white/20 border border-white/30 focus:border-white/60 rounded-2xl px-6 py-4 text-white placeholder-white/60 focus:outline-none text-lg transition-all"
                        onkeypress="if(event.key === 'Enter') addOption()">
                    <button
                        onclick="addOption()"
                        class="bg-white text-purple-600 hover:bg-purple-100 px-8 py-4 rounded-2xl font-semibold flex items-center gap-2 transition-all active:scale-95">
                        <i class="fas fa-plus"></i>
                        添加
                    </button>
                </div>

                <!-- 选项列表 -->
                <div id="optionsList" class="space-y-3 min-h-[320px] max-h-[420px] overflow-y-auto pr-2 custom-scrollbar">
                </div>

                <div class="mt-6 flex gap-3">
                    <button onclick="clearAll()"
                            class="flex-1 bg-white/20 hover:bg-white/30 py-4 rounded-2xl text-sm font-medium transition-all">
                        清空全部
                    </button>
                    <button onclick="loadExamples()"
                            class="flex-1 bg-white/20 hover:bg-white/30 py-4 rounded-2xl text-sm font-medium transition-all">
                        加载推荐示例
                    </button>
                </div>
            </div>

            <!-- 挑选区域 -->
            <div class="lg:col-span-7 bg-white/10 backdrop-blur-xl rounded-3xl p-10 shadow-2xl border border-white/20 flex flex-col">
                <div class="flex-1 flex flex-col items-center justify-center text-center">
                    <!-- 转盘 -->
                    <div id="pickerVisual" class="relative w-64 h-64 mb-10">
                        <div onclick="pickRandom()" id="wheelContainer"
                             class="w-64 h-64 rounded-full border-8 border-white/60 shadow-inner cursor-pointer hover:scale-105 transition-transform flex items-center justify-center bg-gradient-to-br from-yellow-300 to-orange-400">
                            <div class="text-center">
                                <i class="fas fa-dice-five text-8xl text-white/90 mb-2"></i>
                                <div class="text-2xl font-bold text-white tracking-widest">GO</div>
                            </div>
                        </div>
                    </div>

                    <!-- 结果 -->
                    <div id="resultContainer" class="min-h-[140px] flex flex-col items-center justify-center">
                        <div id="result" class="text-6xl font-bold mb-4 min-h-[90px] flex items-center justify-center text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 to-white result hidden">
                        </div>
                        <div id="resultLabel" class="text-xl opacity-75 hidden">这次命运选择了...</div>
                    </div>
                </div>

                <!-- 挑选按钮 -->
                <button onclick="pickRandom()"
                        class="mt-8 w-full bg-white text-purple-700 hover:bg-amber-200 active:scale-[0.97] transition-all py-7 text-2xl font-bold rounded-3xl shadow-xl flex items-center justify-center gap-4 group">
                    <span class="group-active:rotate-12 transition-transform inline-block">🎲</span>
                    <span>立即随机挑选</span>
                </button>

                <div class="text-center mt-6">
                    <button onclick="showHistory()"
                            class="text-white/70 hover:text-white text-sm flex items-center gap-1.5 mx-auto">
                        <i class="fas fa-history"></i>
                        <span>历史记录</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center text-white/60 text-sm mt-16">
            <p>纯静态网页 • 适配手机 • GitHub Pages 友好</p>
        </div>
    </div>

    <!-- 历史记录弹窗 -->
    <div id="historyModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-white text-gray-900 rounded-3xl max-w-md w-full mx-4 max-h-[80vh] overflow-hidden">
            <div class="p-6 border-b flex items-center justify-between">
                <h3 class="text-2xl font-semibold">挑选历史</h3>
                <button onclick="hideHistory()" class="text-3xl leading-none text-gray-400 hover:text-gray-600">×</button>
            </div>
            <div id="historyList" class="p-6 max-h-[60vh] overflow-y-auto space-y-4 text-lg">
            </div>
            <div class="p-6 border-t">
                <button onclick="clearHistory()"
                        class="w-full py-4 bg-red-100 hover:bg-red-200 text-red-700 rounded-2xl font-medium">
                    清空历史
                </button>
            </div>
        </div>
    </div>

    <script>
        let options = [];
        let history = [];

        function renderOptions() {
            const container = document.getElementById('optionsList');
            container.innerHTML = '';

            if (options.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-white/40 py-12">
                        <i class="fas fa-inbox text-6xl mb-4"></i>
                        <p>还没有选项呢~</p>
                        <p class="text-sm mt-1">点击下方“加载推荐示例”试试看</p>
                    </div>
                `;
                return;
            }

            options.forEach((opt, index) => {
                const div = document.createElement('div');
                div.className = `option-item flex items-center justify-between bg-white/90 text-gray-800 px-6 py-4 rounded-2xl group`;
                div.innerHTML = `
                    <div class="flex-1 font-medium">${opt}</div>
                    <button onclick="removeOption(${index})"
                            class="text-red-500 hover:text-red-600 opacity-0 group-hover:opacity-100 transition-all">
                        <i class="fas fa-trash"></i>
                    </button>
                `;
                container.appendChild(div);
            });
        }

        function addOption() {
            const input = document.getElementById('optionInput');
            const val = input.value.trim();

            if (!val) return;
            if (options.includes(val)) {
                alert('这个选项已经存在啦！');
                return;
            }

            options.push(val);
            input.value = '';
            renderOptions();
        }

        function removeOption(index) {
            options.splice(index, 1);
            renderOptions();
        }

        function clearAll() {
            if (confirm('确定要清空所有选项吗？')) {
                options = [];
                renderOptions();
            }
        }

        function pickRandom() {
            if (options.length === 0) {
                alert('先添加一些选项吧！😊');
                return;
            }

            const resultEl = document.getElementById('result');
            const labelEl = document.getElementById('resultLabel');
            const wheel = document.getElementById('wheelContainer');

            // 转盘旋转动画
            const randomDeg = 1800 + Math.random() * 1800;
            wheel.style.transform = `rotate(${randomDeg}deg)`;

            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * options.length);
                const winner = options[randomIndex];

                // 重置转盘
                wheel.style.transition = 'none';
                wheel.style.transform = 'rotate(0deg)';
                void wheel.offsetWidth;
                wheel.style.transition = 'transform 3s cubic-bezier(0.25, 0.1, 0.25, 1)';

                // 显示结果
                resultEl.textContent = winner;
                resultEl.classList.remove('hidden');
                labelEl.classList.remove('hidden');

                // 彩带
                createConfetti();

                // 保存历史
                history.unshift({
                    choice: winner,
                    time: new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'})
                });

                if (history.length > 20) history.pop();

            }, 2800);
        }

        function createConfetti() {
            const colors = ['#f59e0b', '#ec4899', '#8b5cf6', '#22d3ee', '#f97316'];
            for (let i = 0; i < 90; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2.5 + 3) + 's';
                confetti.style.opacity = Math.random() * 0.7 + 0.6;
                confetti.style.width = confetti.style.height = (Math.random() * 12 + 8) + 'px';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 6000);
            }
        }

        function loadExamples() {
            options = [
                "去食堂一楼",
                "去食堂二楼",
                "吃火锅",
                "吃麻辣烫",

            ];
            renderOptions();
        }

        function showHistory() {
            const modal = document.getElementById('historyModal');
            const list = document.getElementById('historyList');
            list.innerHTML = '';

            if (history.length === 0) {
                list.innerHTML = `<p class="text-center py-12 text-gray-400">还没有历史记录～</p>`;
            } else {
                history.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'flex justify-between items-center bg-gray-100 p-5 rounded-2xl';
                    div.innerHTML = `
                        <div class="font-semibold">${item.choice}</div>
                        <div class="text-sm text-gray-500">${item.time}</div>
                    `;
                    list.appendChild(div);
                });
            }
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function hideHistory() {
            const modal = document.getElementById('historyModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function clearHistory() {
            if (confirm('确定清空所有历史记录吗？')) {
                history = [];
                hideHistory();
            }
        }

        // 键盘支持
        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.getElementById('optionInput') !== document.activeElement) {
                e.preventDefault();
                document.getElementById('optionInput').focus();
            }
        });

        // 初始化
        window.onload = () => {
            renderOptions();
        };
    </script>
</body>
</html>
